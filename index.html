<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단타 규칙카드</title>
<style>
:root{
  --bg:#0f1115; --panel:#1a1d24; --panel2:#22262f; --line:#2e333d;
  --txt:#e8eaed; --sub:#9aa0a9; --accent:#4f8cff; --accent2:#ffb454;
  --green:#3ecf8e; --red:#ff5d5d; --gold:#ffd54a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;}
header{padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.title{font-weight:700;font-size:16px;margin-right:auto;}
select,button{font-family:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);padding:7px 10px;cursor:pointer;}
select{max-width:46vw;}
button:active{transform:scale(.97);}
.btn-acc{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.toggle.on{background:var(--accent2);border-color:var(--accent2);color:#1a1d24;font-weight:700;}
.bar{height:4px;background:var(--panel2);border-radius:3px;margin-top:10px;overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s;}
.meta{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:10px;align-items:center;}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 14px;gap:14px;}
.card{width:100%;max-width:560px;min-height:62vh;perspective:1600px;cursor:pointer;}
.inner{position:relative;width:100%;height:100%;min-height:62vh;
  transition:transform .5s;transform-style:preserve-3d;}
.card.flip .inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;display:flex;flex-direction:column;}
.back{transform:rotateY(180deg);background:var(--panel2);}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--sub);}
.chip.cat{background:rgba(79,140,255,.15);color:#9bc0ff;border-color:transparent;}
.chip.rev{background:rgba(255,180,84,.16);color:var(--gold);border-color:transparent;}
.code{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.3px;}
.ctitle{font-size:18px;font-weight:700;margin:6px 0 16px;line-height:1.4;}
.front-q{font-size:20px;line-height:1.55;font-weight:600;color:#fff;}
.front-hint{margin-top:auto;font-size:12px;color:var(--sub);text-align:center;padding-top:18px;}
.back-label{font-size:12px;color:var(--accent2);font-weight:700;margin-bottom:8px;}
.back-body{font-size:16px;line-height:1.7;white-space:pre-wrap;flex:1;}
.src{margin-top:14px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;}
.star{position:absolute;top:16px;right:18px;font-size:22px;color:var(--line);z-index:2;}
.star.on{color:var(--gold);}

.nav{display:flex;gap:10px;width:100%;max-width:560px;}
.nav button{flex:1;padding:13px;font-size:15px;}
footer{padding:10px 14px;text-align:center;font-size:11px;color:var(--sub);}
.empty{color:var(--sub);text-align:center;padding:40px;}
</style>
</head>
<body>
<header>
  <div class="row">
    <span class="title">단타 규칙카드</span>
    <button id="modeBtn" class="toggle">순서</button>
    <button id="favBtn" class="toggle">★ 즐겨찾기</button>
  </div>
  <div class="row" style="margin-top:8px;">
    <select id="catSel"></select>
    <button id="resetBtn">진행 초기화</button>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="meta">
    <span id="counter">-</span>
    <span id="catInfo"></span>
  </div>
</header>

<main>
  <div class="card" id="card">
    <span class="star" id="star">★</span>
    <div class="inner">
      <div class="face front">
        <div class="tags">
          <span class="code" id="fCode"></span>
          <span class="chip cat" id="fCat"></span>
          <span class="chip rev" id="fRev" style="display:none;">질문 검수대상</span>
        </div>
        <div class="ctitle" id="fTitle"></div>
        <div class="front-q" id="fQ"></div>
        <div class="front-hint">탭하면 답 보기 ↻</div>
      </div>
      <div class="face back">
        <div class="tags"><span class="code" id="bCode"></span></div>
        <div class="back-label">답 / 행동</div>
        <div class="back-body" id="bBody"></div>
        <div class="src" id="bSrc"></div>
      </div>
    </div>
  </div>
  <div class="nav">
    <button id="prevBtn">◀ 이전</button>
    <button id="nextBtn" class="btn-acc">다음 ▶</button>
  </div>
</main>
<footer>탭=뒤집기 · 순서/랜덤 · 즐겨찾기 · 진행 자동저장</footer>

<script>
const DATA = {"cats": {"A": "A 시황·시장환경", "B": "B 매매인프라·HTS", "C": "C 종목선정", "D": "D 차트·파동", "F": "F 리스크·자금관리", "G": "G 심리·루틴·마인드", "E1": "E1 종가배팅", "E2": "E2 양봉·상한가", "E3": "E3 음봉매매", "E4": "E4 돌파매매", "E5": "E5 뉴스매매", "E6": "E6 대형주매매", "E7": "E7 종합·기타", "E8": "E8 신규주눌림", "E9": "E9 급등주눌림", "E11": "E11 바닥권눌림"}, "order": ["G", "F", "A", "B", "C", "D", "E3", "E6", "E1", "E11", "E9", "E8", "E2", "E5", "E4", "E7"], "cards": [{"code": "G-멘탈-01", "title": "장전 명상 루틴", "cat": "G", "type": "B", "front": "「장전 명상 루틴」 — 규칙/대응은?", "back": "장 시작 전 1~2분 명상으로 심리 안정화", "source": "G1(1강 §18.5)", "review": true}, {"code": "G-멘탈-02", "title": "안 보는 매매 — 호가창 비관찰", "cat": "G", "type": "A", "front": "음봉매매(상단) 매수 후", "back": "매수 존 구간에 분할주문만 걸어두고 호가창을 실시간으로 보지 않음(실시간 관찰은 오히려 조기손절·조기매도 유발)\n예외: 양봉 매매는 실시간 관찰 필요(매매 종류별로 다르게 적용)", "source": "G1(5강 §10.7)", "review": false}, {"code": "G-멘탈-03", "title": "복기 — 효율적 범위 선정", "cat": "G", "type": "B", "front": "「복기 — 효율적 범위 선정」 — 규칙/대응은?", "back": "모든 종목을 복기하지 말고 기간(주간·월간) 단위로 손익이 가장 큰 종목 위주로 선별 복기. 형식보다 지속성이 핵심", "source": "G2(1강 §18.5)", "review": true}, {"code": "G-멘탈-04", "title": "복기 데이터를 예측 자산으로 축적", "cat": "G", "type": "B", "front": "「복기 데이터를 예측 자산으로 축적」 — 규칙/대응은?", "back": "매일 장마감 후 특징주·뉴스를 기록(신규/재탕, 상승률)해 과거 이력 데이터를 누적시키고, 향후 유사 뉴스 발생 시 학습효과로 활용", "source": "G2(3강 §5.3)", "review": true}, {"code": "G-멘탈-05", "title": "비교 금지", "cat": "G", "type": "B", "front": "「비교 금지」 — 규칙/대응은?", "back": "타인의 수익(유튜브·커뮤니티 인증 등)과 비교하지 말 것. 비교 대상은 오직 자기 자신, 본인만의 페이스 유지", "source": "G3(1강 §18.3)", "review": true}, {"code": "G-멘탈-06", "title": "손실의 정상화 — 트레이딩 비용 인식", "cat": "G", "type": "B", "front": "「손실의 정상화 — 트레이딩 비용 인식」 — 규칙/대응은?", "back": "초보 단계의 손실은 경험 부족에 따른 자연스러운 비용으로 인식. 많은 수익보다 \"잃지 않는 것\"의 우선순위를 높게 둘 것", "source": "G3(1강 §18.2)", "review": true}, {"code": "G-멘탈-07", "title": "심리적으로 편안한 시드 규모 찾기", "cat": "G", "type": "B", "front": "「심리적으로 편안한 시드 규모 찾기」 — 규칙/대응은?", "back": "과도한 베팅으로 심리적 압박을 받는 규모는 부적합 — 본인이 편안하게 운용 가능한 시드를 찾을 것", "source": "G3(1강 §18.2)", "review": true}, {"code": "G-멘탈-08", "title": "일관된 대응 원칙", "cat": "G", "type": "B", "front": "「일관된 대응 원칙」 — 규칙/대응은?", "back": "동일한 상황에서는 동일한 방식으로 대응. 검증된 기법과 명확한 기준에 의해서만 매수·매도 실행. \"좋아하는\" 매매가 아니라 \"잘하는\" 매매를 추구", "source": "G4(1강 §18.1)", "review": true}, {"code": "G-멘탈-09", "title": "사전 시나리오 수립 습관", "cat": "G", "type": "B", "front": "「사전 시나리오 수립 습관」 — 규칙/대응은?", "back": "급락·급등 등 큰 변동 상황에서는 즉흥 대응이 아니라, 추가매수 조건·손절 한계·확대 베팅 조건을 사전에 시나리오로 설계해두고 그 규칙대로 움직일 것", "source": "G4(7강 §1.2)", "review": true}, {"code": "G-멘탈-10", "title": "예외 적용 시 범위 한정", "cat": "G", "type": "B", "front": "「예외 적용 시 범위 한정」 — 규칙/대응은?", "back": "원칙에 예외를 허용할 때는(\"보수적 상한가 매매법은 대장에만 적용\" 등) 그 예외가 적용되는 범위를 명확히 한정해 일관성을 유지할 것", "source": "G4(8강 §6.3)", "review": true}, {"code": "G-멘탈-11", "title": "신규 매매법 테스트 — 소액 분리 원칙", "cat": "G", "type": "B", "front": "「신규 매매법 테스트 — 소액 분리 원칙」 — 규칙/대응은?", "back": "신규 매매법은 본 계좌 베팅액의 1/20 이하로 테스트, 별도 계좌 분리 권장. 장기간(수개월~수년) 테스트해도 수익이 안 나면 과감히 패스", "source": "G5(1강 §9.1)", "review": true}, {"code": "G-멘탈-12", "title": "수익을 담보로 매매법을 확장", "cat": "G", "type": "B", "front": "「수익을 담보로 매매법을 확장」 — 규칙/대응은?", "back": "한 가지 매매법으로 안정적 수익을 먼저 확보한 후에만 점진적으로 다음 매매법을 추가", "source": "G5(1강 §6.1, §9)", "review": true}, {"code": "G-멘탈-13", "title": "매매 스타일 자가진단 및 불필요한 매매 제거", "cat": "G", "type": "B", "front": "「매매 스타일 자가진단 및 불필요한 매매 제거」 — 규칙/대응은?", "back": "본인 적성(스캘핑/스윙/단타)을 스스로 진단하고, 지속적으로 손실 나는 매매(감에 의존)는 과감히 제거", "source": "G5(1강 §18.4)", "review": true}, {"code": "G-멘탈-14", "title": "트렌드 매매 우선 원칙", "cat": "G", "type": "B", "front": "「트렌드 매매 우선 원칙」 — 규칙/대응은?", "back": "\"단타 매매의 기본은 트렌드 매매다\" — 현재 가장 잘 통하는 매매법·종목·테마를 빠르게 파악하고 적용", "source": "G6(1강 §9.2)", "review": true}, {"code": "G-멘탈-15", "title": "올라운더 지향", "cat": "G", "type": "B", "front": "「올라운더 지향」 — 규칙/대응은?", "back": "한 가지 기법에만 의존하는 태도(\"주식계 공무원\")를 경계하고 다양한 기법을 구사할 수 있는 올라운더를 지향", "source": "G6(1강 §9.2)", "review": true}, {"code": "G-멘탈-16", "title": "단타 선택의 합리적 절충 원칙", "cat": "G", "type": "B", "front": "「단타 선택의 합리적 절충 원칙」 — 규칙/대응은?", "back": "100% 확신이 없는 상승 파동에서는 장기투자(높은 심리비용)보다 단타(낮은 심리비용)로 짧게 수익을 취하는 절충 전략을 기본으로 채택", "source": "G6(1강 §8.3)", "review": true}, {"code": "G-멘탈-17", "title": "인내의 미학 — 선택적 집중", "cat": "G", "type": "B", "front": "「인내의 미학 — 선택적 집중」 — 규칙/대응은?", "back": "모든 종목에 진입하지 않고 꼭 필요한 종목만 선택·집중", "source": "G7(1강 §18.6)", "review": true}, {"code": "G-멘탈-18", "title": "유연한 사고 — 매매법 교체", "cat": "G", "type": "B", "front": "「유연한 사고 — 매매법 교체」 — 규칙/대응은?", "back": "동일 매매로 계속 손실이 나면 관점과 방법을 바꿀 것(예: 종가배팅 부진 시 시가배팅 전환). 단, 이는 \"사전에 정한 규칙을 지키는\" 일관성(G4)과 모순되지 않음 — 안 맞는 규칙 자체를 교체하는 것은 다른 차원", "source": "G7(8강 §19.1)", "review": true}, {"code": "G-멘탈-19", "title": "차근차근 실력 쌓기 — 무리한 투자 금지", "cat": "G", "type": "B", "front": "「차근차근 실력 쌓기 — 무리한 투자 금지」 — 규칙/대응은?", "back": "조급함을 경계, 집 매도·대출 확대·풀미수 등 무리한 투자 금지. 시드머니보다 실력이 핵심임을 인지", "source": "G7(8강 §19.2)", "review": true}, {"code": "G-멘탈-20", "title": "제도 변화 적응 원칙", "cat": "G", "type": "B", "front": "「제도 변화 적응 원칙」 — 규칙/대응은?", "back": "상한가율 변경·NXT 도입·공매도 금지재개 등 제도는 계속 변화하므로 적응을 유일한 해법으로 받아들일 것", "source": "G7(8강 §19.3)", "review": true}, {"code": "G-멘탈-21", "title": "하락장 생존 3원칙", "cat": "G", "type": "B", "front": "「하락장 생존 3원칙」 — 규칙/대응은?", "back": "1. 세력 주도주 집중(시장 방향과 무관하게 수익 내는 종목)\n2. 골든타임 한정 매매(거래량 집중 시간대에만 집중, 나머지는 휴식)\n3. 보유 종목 최소화(가장 강한 1~2개만, 흐름 안 좋으면 즉시 손절 또는 무포 오버나잇)\n--", "source": "G7(8강 §18)", "review": true}, {"code": "G-IMI-멘탈-01", "title": "생존 최우선 — 2~3년 목표", "cat": "G", "type": "B", "front": "「생존 최우선 — 2~3년 목표」 — 규칙/대응은?", "back": "현금 비중·비중 조절·분할 매수 원칙을 지키면 하락장에도 계좌 큰 타격 없음. \"2~3년 살아남기\"를 1순위 목표로 설정", "source": "[IMI 0617·0619]", "review": true}, {"code": "G-IMI-멘탈-02", "title": "포모(FOMO) 차단", "cat": "G", "type": "A", "front": "소수 종목이 독주하는 포모장", "back": "돈 버는 건 극소수임을 인지. 비중을 확 줄여야 포모가 오지 않음. 기대감에 섣불리 잡으면 마음고생", "source": "[IMI 0618·0619 / 주간 0618]", "review": false}, {"code": "G-IMI-멘탈-03", "title": "손절도 잘한 매매", "cat": "G", "type": "B", "front": "「손절도 잘한 매매」 — 규칙/대응은?", "back": "원칙대로 손절한 뒤 확보한 현금으로 4종목 매매해 손실을 메우는 것 = 잘한 매매. \"원칙 지킨 손절은 잘한 매매\"", "source": "[IMI 0618]", "review": true}, {"code": "G-IMI-멘탈-04", "title": "매일 시황 갱신 습관", "cat": "G", "type": "B", "front": "「매일 시황 갱신 습관」 — 규칙/대응은?", "back": "키워드(종전·미국·이란·트럼프 등) 검색으로 시황을 매일 갱신. 넥스트(시간외) 흐름보다 정규장 매수세 위치를 기준으로 트렌드 파악", "source": "[IMI 0619]", "review": true}, {"code": "G-IMI-멘탈-05", "title": "확인 후 진입(관망 우선)", "cat": "G", "type": "B", "front": "「확인 후 진입(관망 우선)」 — 규칙/대응은?", "back": "강한 대장주는 음봉마다 매집·홀딩. 나머지 테마는 먼저 잡지 말고 소식 나오고 상승 확인 후 진입해도 늦지 않음", "source": "[주간 0618]", "review": true}, {"code": "G-IMI-멘탈-06", "title": "환경에 맞는 매매법부터 마스터", "cat": "G", "type": "B", "front": "「환경에 맞는 매매법부터 마스터」 — 규칙/대응은?", "back": "멋있어 보인다는 이유로 내 환경에 안 맞는 매매법(스캘핑 등) 억지로 좇지 말 것. 지금 할 수 있는 매매 환경을 점검 → 맞는 매매법 먼저 마스터 → 점점 빠른 매매로 확장. 바쁜 날은 분할 모으기(코스닥 ETF 등), 시간 날 때 빠른 매매", "source": "[IMI 0622]", "review": true}, {"code": "G-IMI-멘탈-07", "title": "잽 맞으며 생존", "cat": "G", "type": "B", "front": "「잽 맞으며 생존」 — 규칙/대응은?", "back": "스트레이트(풀비중) 안 맞고 잽(분할·현금)만 맞으며 살아남기. 풀비중 -20%는 회복에 +30% 필요·시장 이탈로 이어짐", "source": "[IMI 0623]", "review": true}, {"code": "G-IMI-멘탈-08", "title": "시장이 정해준다 — 인정=손절", "cat": "G", "type": "B", "front": "「시장이 정해준다 — 인정=손절」 — 규칙/대응은?", "back": "갈/안 갈 종목은 시장이 선택. 아니면 인정하고 손절. 종목과 사랑에 빠져 신용·대출로 버티면 반대매매(바이오 고수 30억→청산 사례)", "source": "[주간 0625]", "review": true}, {"code": "G-IMI-멘탈-09", "title": "가상매매·기다림도 매매", "cat": "G", "type": "A", "front": "소액·초보 또는 마땅한 자리 없음", "back": "주도주를 차트만 보고 가상매매로 연습. 매매 안 하고 기다리고 쉴 줄 아는 것도 성공적 매매", "source": "[주간 0625]", "review": false}, {"code": "F-리스크-01", "title": "미수 절대 금지", "cat": "F", "type": "B", "front": "「미수 절대 금지」 — 규칙/대응은?", "back": "미수 사용 금지(사용자 90% 퇴출 통계 인지). 신용은 수익 부분에 한해 제한적 사용(담보비율 140% 이상 유지)", "source": "F2(1강 §6.2, §12)", "review": true}, {"code": "F-리스크-02", "title": "종목당 비중 한도", "cat": "F", "type": "B", "front": "「종목당 비중 한도」 — 규칙/대응은?", "back": "표준: 1/3(약 33%) 이내\n예외: 확신 높은 강세장(코스피 5일선 위 등)에서 최대 70%(2/3)까지", "source": "F2(1강 §12)", "review": true}, {"code": "F-리스크-03", "title": "보유 종목 수 한도", "cat": "F", "type": "B", "front": "「보유 종목 수 한도」 — 규칙/대응은?", "back": "표준: 5종목 이하 권장\n초보자: 3종목 이하\n한계선: 10종목 초과 시 관리 어려움", "source": "F2(1강 §12), F3(1강 §13)", "review": true}, {"code": "F-리스크-04", "title": "물타기 금지 — 예외는 1회성만", "cat": "F", "type": "B", "front": "「물타기 금지 — 예외는 1회성만」 — 규칙/대응은?", "back": "원칙: 물타기 금지\n예외: 확신 있는 종목이 대외 요인으로 갭하락 + 반등 예상 시에만 일회성 허용(매우 드문 경우)", "source": "F3(1강 §13)", "review": true}, {"code": "F-리스크-05", "title": "불타기 비중확대 절차", "cat": "F", "type": "A", "front": "저점은 잘 잡았으나 비중 부족, 반등 확인됨 / 확대 후 다시 저점 이탈", "back": "비중 확대(불타기)\n즉시 비중 축소(전량 또는 절반 매도)", "source": "F3(1강 §16)", "review": false}, {"code": "F-리스크-06", "title": "스윙에서의 1:1 추매 원칙", "cat": "F", "type": "B", "front": "「스윙에서의 1:1 추매 원칙」 — 규칙/대응은?", "back": "스윙 매매에서도 매수금액과 동일한 금액으로만 추가매수(1:1), 평단을 크게 낮추는 피라미딩(2~3배수)은 사용 안 함", "source": "F3(1강 §16)", "review": true}, {"code": "F-리스크-07", "title": "예외적 1:2~1:3 승부수", "cat": "F", "type": "A", "front": "극히 예외적 특수상황(전일 과도한 급락 후 반등을 사전에 확신하는 시나리오, \"1년에 한 번 있을까 말까\")", "back": "평소 1:1 원칙을 깨고 1:2~1:3까지 확대 허용", "source": "F3(7강 §1.2)", "review": false}, {"code": "F-리스크-08", "title": "어드밴스드 종가배팅 비중대응", "cat": "F", "type": "B", "front": "「어드밴스드 종가배팅 비중대응」 — 규칙/대응은?", "back": "과도한 하락 → 추가매수 또는 손절\n과도하고 급격한 상승 → 불타기 또는 수익실현\n장세 불안정 → 시간기준 손절(오후2시) 후 스탠다드로 전환", "source": "F4(2강 §14.3)", "review": true}, {"code": "F-리스크-09", "title": "스나이퍼 종가배팅 — 비중 분산 금지", "cat": "F", "type": "B", "front": "「스나이퍼 종가배팅 — 비중 분산 금지」 — 규칙/대응은?", "back": "여러 자리에 나눠 사는 것보다 맥점 한 자리를 정확히 저격", "source": "F4(5강 §6)", "review": true}, {"code": "F-리스크-10", "title": "ML 매매 적용 제한", "cat": "F", "type": "A", "front": "거래량이 적은 비주력 종목", "back": "ML 매매 적용 금지(거래량이 많은 대장급 종목에만 적용)", "source": "F4(8강 §12.4)", "review": false}, {"code": "F-리스크-11", "title": "가변 타점 — 중간반등 시 타점 하향", "cat": "F", "type": "A", "front": "표준 ML 자리 도달 전 5% 이상 중간 반등", "back": "ML 한 단계 아래로 타점을 낮춰 대기", "source": "F4(8강 §12.2)", "review": false}, {"code": "F-리스크-12", "title": "시스템 리스크 대응", "cat": "F", "type": "A", "front": "키움 등 HTS 주문체결 지연 등 시스템 오류로 계획보다 많은 물량이 한꺼번에 체결", "back": "작은 반등구간이라도 신속 매도로 대응(수익금 확보 우선)", "source": "F4(7강 §10.7)", "review": false}, {"code": "F-리스크-13", "title": "기간컷 — 유연한 한도 설정", "cat": "F", "type": "B", "front": "「기간컷 — 유연한 한도 설정」 — 규칙/대응은?", "back": "무반등 시 사전에 기간(예 3일) 한도를 설정하되, 거북이 파동 등 합리적 근거가 확인되면 보유를 연장하는 유연성 발휘(절대 규칙 아님)", "source": "F5(씨피시스템 사례)", "review": true}, {"code": "F-리스크-14", "title": "반반치킨 — 부분 보유 연장", "cat": "F", "type": "A", "front": "장후반 큰 상승 발생", "back": "전량 매도 대신 일부(예 30%)를 남겨 익일 추가 시세 확인 후 매도", "source": "F6(삼성중공업 사례)", "review": false}, {"code": "F-리스크-15", "title": "승부수 전략 — 30/70 비중 분리", "cat": "F", "type": "B", "front": "「승부수 전략 — 30/70 비중 분리」 — 규칙/대응은?", "back": "30%만 먼저 수익실현 후 나머지 70%로 승부 / 또는 70% 먼저 정리 후 30%만 승부 — 단기 자동매도 습관을 깨고 싶을 때만, 초보자 비권장", "source": "F4(8강 §5.5)", "review": true}, {"code": "F-멘탈-01", "title": "매매빈도 관리", "cat": "F", "type": "B", "front": "「매매빈도 관리」 — 규칙/대응은?", "back": "잦은 장중매매(스캘핑 포함)는 손실누적 원인 — 익절·손절을 1:1 수준으로 관리하고 피라미딩 추매 배제, 확률(승률) 기반 승부", "source": "F1(1강 §17)", "review": true}, {"code": "F-멘탈-02", "title": "벌크업 — 수익금 누적 운용", "cat": "F", "type": "B", "front": "「벌크업 — 수익금 누적 운용」 — 규칙/대응은?", "back": "수익금을 인출하지 않고 투자금에 누적시켜 점진적(5~10%씩)으로 베팅 규모 확대. 인출은 생활비 필요시에만", "source": "F7(1강 §14)", "review": true}, {"code": "F-멘탈-03", "title": "벌크업 한계 시 리셋", "cat": "F", "type": "A", "front": "투자금이 일정 수준을 초과해 손실이 반복되는 \"벽\"에 부딪힘", "back": "투자금을 절반 수준으로 줄여(리셋) 다시 벌크업 시작", "source": "F7(1강 §14.4)", "review": false}, {"code": "F-멘탈-04", "title": "초보자 인출 습관화", "cat": "F", "type": "B", "front": "「초보자 인출 습관화」 — 규칙/대응은?", "back": "초보자는 벌크업 운용자와 달리 일정 수익 누적 시 인출을 습관화할 것\n--", "source": "F7(1강 §18.3)", "review": true}, {"code": "F-손절-01", "title": "손절 기준 7가지(복수 충족 시 종합판단)", "cat": "F", "type": "B", "front": "「손절 기준 7가지(복수 충족 시 종합판단)」 — 규칙/대응은?", "back": "하나만으로도 가능하나 복수 충족 시 더 확실히 손절. 실무적으로 금액기준이 가장 많이 활용됨\n1. 예상과 반대 움직임\n2. 금액 기준(평균 3일치 수익 초과 손실)\n3. 시간 기준(미수 3일 초과 또는 3시간 이상 무변동 밀림)\n4. 추세 기준(매수근거 이평선 이탈+하락지속)\n5. 매수 근거 소멸(재료 function filterKey(){return st.cat+'|'+(st.favOnly?'fav':'all');}
function baseList(){
  let l = (st.cat==='ALL') ? all.slice() : all.filter(c=>c.cat===st.cat);

  return l;
}

function getList(){

  if(st.mode==='random'){
    const seedKey='seed|'+filterKey();
    if(!st[seedKey] || st[seedKey].length!==l.length){
      let idx=l.map((_,i)=>i);
      for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
      st[seedKey]=idx; save();
    }
    l = st[seedKey].map(i=>l[i]).filter(Boolean);
  }
  return l;
}

  list = getList(); clampPos();
  document.getElementById('modeBtn').textContent = st.mode==='order'?'순서':'랜덤';
  document.getElementById('modeBtn').classList.toggle('on', st.mode==='random');
  document.getElementById('favBtn').classList.toggle('on', st.favOnly);
  document.getElementById('catInfo').textContent = (st.cat==='ALL'?'전체':cats[st.cat]);
  card.classList.remove('flip');
  if(list.length===0){
    document.getElementById('fTitle').textContent='카드 없음';
    document.getElementById('fQ').textContent = st.favOnly?'즐겨찾기한 카드가 없습니다.':'';
    document.getElementById('counter').textContent='0 / 0';
    document.getElementById('barFill').style.width='0%';
    document.getElementById('star').style.display='none';
    document.getElementById('bBody').textContent='';
    document.getElementById('fCode').textContent='';document.getElementById('fCat').textContent='';
    document.getElementById('fTitle').textContent= st.favOnly?'즐겨찾기 비어있음':'카드 없음';
    return;
  }
  document.getElementById('star').style.display='block';
  const c = list[pos];
  document.getElementById('fCode').textContent=c.code;
  document.getElementById('bCode').textContent=c.code;
  document.getElementById('fCat').textContent=cats[c.cat]||c.cat;
  document.getElementById('fRev').style.display = c.review?'inline-block':'none';
  document.getElementById('fTitle').textContent=c.title;
  document.getElementById('fQ').textContent=c.front||c.title;
  document.getElementById('bBody').textContent=c.back||'(내용 없음)';
  document.getElementById('bSrc').textContent= c.source? ('출처 '+c.source):'';
  const star=document.getElementById('star');
  star.classList.toggle('on', !!st.fav[c.code]);
  document.getElementById('counter').textContent=(pos+1)+' / '+list.length;
  document.getElementById('barFill').style.width=((pos+1)/list.length*100)+'%';
  st.pos[filterKey()]=pos; save();
}

card.addEventListener('click',e=>{ if(e.target.id==='star')return; card.classList.toggle('flip'); });
document.getElementById('star').addEventListener('click',e=>{
  e.stopPropagation();
  const c=list[pos]; if(!c)return;
  st.fav[c.code]=!st.fav[c.code]; if(!st.fav[c.code])delete st.fav[c.code];
  save(); render();
});
function go(d){ if(list.length===0)return; pos+=d;
  if(pos>=list.length)pos=0; if(pos<0)pos=list.length-1; render(); }
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('modeBtn').onclick=()=>{ st.mode=st.mode==='order'?'random':'order';
  pos=st.pos[filterKey()]||0; save(); render(); };
document.getElementById('favBtn').onclick=()=>{ st.favOnly=!st.favOnly; save();
  pos=st.pos[filterKey()]||0; render(); };
catSel.onchange=()=>{ st.cat=catSel.value; save(); pos=st.pos[filterKey()]||0; render(); };
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('현재 필터의 진행 위치를 처음으로 되돌릴까요?')){ pos=0; st.pos[filterKey()]=0; save(); render(); }
};
// 키보드(PC)
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '){e.preventDefault();card.classList.toggle('flip');}
});
// 스와이프(모바일)
let sx=0;
card.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>60){ go(dx<0?1:-1);} });

render();
</script>
</body>
</html>
