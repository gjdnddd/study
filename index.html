대응)\n\n### 보유 중 이탈 대응\n- 3일선 이탈 → 다음 자리 5일선 확인 후 재진입 검토\n- 5일선 이탈 → 다음 자리 8일선 확인 or 손절\n- 8일선 이탈 → 손절 (15일선까지 대기는 권장 안 함)\n- 라운드피겨 이탈 → 즉시 손절, 다음 라운드피겨 재설정\n\n### 상한가 안착 방식 실시간 모니터\n- 오전에 급격히 상한가 → 매물 소화 부족 → 다음날 3일선 아닌 5일선/8일선 준비\n- 공방하며 상한가 → 매물 소화 많음 → 다음날 3일선 지지 기대\n\n---\n\n## 장후 루틴\n\n- [ ] 오늘 내가 진입한 이평선 지지 여부 확인\n- [ ] 음봉 성격 확인 (속임수 vs 차익실현)\n- [ ] 재료 지속성 여부 확인\n- [ ] 내일 시나리오 설정 (상단 1/3 이상 → 상승 / 이하 → 탈출)\n\n---\n\n## 진입 전 최종 체크리스트\n\n| # | 항목 | 확인 |\n|---|------|------|\n| 1 | 시장 거래대금 파악 → 이평선 선택 | □ |\n| 2 | 급등주 5일선 위에 있는가? | □ |\n| 3 | 거래대금 150억봉/500억봉 발생했나? | □ |\n| 4 | 상한가 안착 방식 확인 (공방 vs 급격) | □ |\n| 5 | 속임수 음봉 여부 확인 | □ |\n| 6 | 역배열 조건 2가지 중 하나 충족했나? | □ |\n| 7 | 신규 재료 vs 재탕 재료 구분 | □ |\n| 8 | 라운드피겨 지지/저항 설정 | □ |\n| 9 | 손절 기준 사전 설정 | □ |\n| 10 | 시나리오 2가지 작성 | □ |\n\n---\n\n## 이평선별 매매 빠른 참조표\n\n| 이평선 | 장세 | 거래대금 조건 | 지켜보기 |\n|--------|------|---------------|----------|\n| 3일선 | 강한 장 | 150억봉+ | 당일~다음날 |\n| 5일선 | 보통 장 | 제한 없음 | 2~3일 |\n| 8일선 | 약한 장/역배열 | 제한 없음 | 3~5일 |\n| 15일선 | 관심 멀어짐 | — | 매매 자제 |\n| 20일선 | 3음봉 이상 급등주 | 거래량 감소 | 5~7일 |\n| 240일선 | 역배열 탈출 | 대량거래 돌파 | 2~3거래일 |\n\n---\n\n## 핵심 원칙 10초 복기\n\n1. 급등주 = **5일선 위에서** 논다\n2. 시장 강도에 따라 **3→5→8일선** 유연하게\n3. **속임수 음봉** = 거래량 줄면서 내림\n4. **대량거래봉** 후 3일선 지지 신뢰도 높음\n5. **역배열** = 횡보 or 대량거래 조건 없으면 진입 금지\n6. **라운드피겨** = 강한 심리적 지지/저항\n7. **신규 재료** > 재탕 재료\n8. 상단 **1/3** 지키면 강한 반등 / 절반 이하면 탈출\n9. 거래대금 작으면 **3일선 매매 금지**\n10. **3→5→8일선** 순서로 다음 지지 자리 설정\n\n\n---\n\n## 〔월독프 7주차 보강〕 진입 전 6항목과 제외 기준\n\n**진입 전 체크(6항목)** — ①거래대금·거래량이 충분한가(비중 싣기 가능한가) ②지수는 상승·하락·조정 중 어디인가(약하면 보수적으로) ③일봉이 바닥권·박스권·신고가 중 어디인가 ④관심 섹터인가·추가 상장 물량은 없나 ⑤**종목의 패턴(가장 중요)** ⑥지속 가능한 모멘텀이 있나.\n\n| 구분 | 실행 기준 |\n|---|---|\n| **3일선 진입** | 상한가 다음 날 **갭상승한** 종목이 3일선까지 하락했을 때. **갭상승 못 하고 흐르면 제외** |\n| **3일선 손절** | 매수가 대비 **-5% 또는 5일선 이탈** 즉시 |\n| **8일선 진입** | **3음봉** 전후 · 1일차 음봉이 크고(고점 대비 -10%↑) 점차 작아짐 · 3일차 분봉 지지 · 첫 5일선 이탈 시 **거래량 감소** 확인. 세팅은 **10일선** |\n| **8일선 제외** | **5~6음봉(찔끔 하락)** · **중대형주** |\n| **재료 제외** | 무상증자 · 바이오 · 실적발표 · 3자배정의 **눌림**은 하지 않음 (경영권 분쟁·M&A는 함) |\n| **파동 주의** | 바닥권 억봉(역배열에서 120일선 강돌파) 후 3일선은 O, **두 번째 상승 파동의 3일선은 조심** |\n\n\n---\n\n## 〔차읽남 강의자료 보강〕 3일선 vs 8일선 선택표와 진입 시점\n\n### 어느 이평선으로 갈 것인가\n| 3일선으로 간다 | 8일선을 기다린다 |\n|---|---|\n| 상한가·장대양봉 후 **상승률이 큼** | 상승률이 적음 |\n| 고가에서 **바로 조정** | 고가에서 **2~3일 머묾** |\n| 과거에 3일선 반등을 잘 줬던 종목 | 과거에 3일선 반등을 잘 안 준 종목 |\n| 상한가 거래대금 ≥ 직전 장대양봉 거래대금 | 상한가 거래대금 **<** 직전 장대양봉 거래대금 |\n| 3일선까지 낙폭(이격) 충분 | 낙폭이 너무 적음 |\n\n> **예외**: 시장 **주도 섹터의 대장주**는 낙폭이 적어도 3일선 반등이 강할 수 있다(와이씨켐 +17%).\n\n### 대량거래봉 유효 조건 (4가지 전부 충족)\n① 당일 거래대금 150억/500억 이상 ② 종가가 시가 대비 **+9% 이상**(VI 1회 이상) ③ 전일 대비 오늘 고가 **+15% 이상** ④ 오늘 고가가 저가 대비 **+15% 이상**\n\n### 진입 시점은 세 곳뿐\n1. **500억봉 후 첫 강한 조정(장대음봉)** — 고점 물량이 쌓여 팔 사람이 없어 쉽게 오른다\n2. **150억봉 후 첫 3일선**\n3. **500억봉 후 첫 7~8일선**\n\n### ⚠️ 회피 신호\n- **1·2일차에 주요 저항선(224일선 등)을 맞고 떨어지며 윗꼬리** → 높은 확률로 장기 하락\n- **첫 500억봉 후 갭이 약하거나 뜨지 않으며 하락** → 장기 하락 전환 가능성\n- **바닥권 150억봉** → 신뢰도 낮음(상승추세·고가놀이에서만 비중)\n\n### 매수 시점 3분류\n| 케이스 | 상황 |\n|---|---|\n| **오전 매수** | 낙폭과대 — 당일 반등 노림 |\n| **오후 매수** | 거래량 감소는 오후에나 확인 가능 |\n| **다음날 매수** | 3·8일선 종목이 종가에 밑꼬리를 만든 경우 |\n\n> 조정 성격이 애매하면 오전 매수는 추가 하락 위험 → **거래량 감소 확인 후 종가 위주 매수 + 다음날 분할매수**로 보완.\n"}, {"label": "낙폭과대반등", "file": "E14_낙폭과대반등_가이드.md", "md": "# 3차 — E. 낙폭과대 반등 실전 가이드 [차읽남]\n\n> ⚠️ 적용 대상: 급등 후 수일 내(2~3거래일) 급락한 테마주·세력주. 상세 근거는 `2.5차 규칙카드/cards_E14_낙폭과대반등.md` 상단 참조.\n\n---\n\n## 장전 루틴\n\n### 1. 하락 유형 파악\n- [ ] 단기 큰 폭 하락(변동폭 큼)인가? → 과대낙폭형, 기술적 반등 노림\n- [ ] 소폭 계단식 하락인가? → 바닥권 올 때까지 대기, 반등 기대 낮춤\n\n### 2. 낙폭과대 수치 확인\n- [ ] 고가 대비 **-40%** 근처인가?\n- [ ] 처음 상승 시작 지점까지 내려왔는가?\n\n### 3. 거래량 확인\n- [ ] 하락 거래량 < 상승 거래량? → 속임수 음봉 가능, 반등 기대\n- [ ] 거래량 감소하며 지지선 근접? → 매수 타이밍 근접\n\n### 4. 테마·재료 확인\n- [ ] 단발성 테마인가 vs 지속 가능 테마인가?\n- [ ] 지속성 테마라면 → 다음 일정(정책·수주·실적) 언제인가?\n\n---\n\n## 장중 루틴\n\n### 진입 판단\n1. 상승 시작 지점·전저점 근처까지 내려왔는가?\n2. 분봉에서 반등 시도하는 모습 보이는가?\n3. 라운드피겨(심리적 지지선) 부근인가?\n4. 장대음봉 거래량 대비 하락 거래량 감소 확인\n\n### 대응 시나리오\n- **하락폭 크다** → 손절\n- **하락폭 적다** → 추가매수\n- **비중 이미 크다** → 반등 시 추가매수분 먼저 분할매도\n\n---\n\n## 장후 루틴\n\n- [ ] 오늘 하락 유형 재확인 (계단식 진행 중인가?)\n- [ ] 거래량 감소하며 지지 유지인가?\n- [ ] 내일 시나리오: 반등 목표 vs 손절 기준\n\n---\n\n## 빠른 참조: 낙폭과대 판단 3단 논법\n\n```\n① 고가 대비 -40% + 상승 시작점까지 하락 → 구조적으로 낙폭과대\n② 하락 거래량 < 상승 거래량 → 매물 남아있음, 속임수 음봉\n③ 테마 지속성 O + 다음 일정 있음 → 보유 기간 연장 근거\n```\n\n---\n\n## 핵심 10초 복기\n\n1. **계단식 하락 = 기다려라** / 과대낙폭 = 반등 노려라\n2. **-40% + 상승 시작점** = 낙폭과대 기준\n3. 거래량 줄면서 하락 = **속임수 음봉** → 반등 기대\n4. 테마 단발성 → 반등 후 즉시 매도\n5. 테마 지속성 + 일정 있음 → 추가 상승 기대하며 보유\n6. 손절 **-5%** 기계적으로\n7. 하락폭 크면 손절 / 적으면 추가매수\n\n\n---\n\n## 〔월독프 7주차 보강〕 고가권 첫 투매 분할표\n\n| 대상 | 분할 지점 | 비고 |\n|---|---|---|\n| **대형주** | 고점 대비 **-25% / -30%** 2분할 | 당일 급투매일 때만 (수 주에 걸친 계단식 하락은 제외) |\n| **급등주** | 고점 대비 **-30% / -35% / -40%** 3분할 | |\n\n- **오전에 확 올랐다가 확 밀린 시점**이 확률이 높다. **오후 투매는 다음 날 추가 하락** 가능.\n- **거래량 감소 = 팔 사람이 없다** / 거래량 증가하며 하락 = 매물 남음.\n- **최대 5거래일**까지만 보유(물타기를 하더라도).\n- **시즌 판정**: 돈이 대형주로 몰리는 시즌에는 중소형주 반등이 잘 안 나온다 → 전략이 맞는 시즌에 집중, 아니면 쉰다.\n\n\n---\n\n## 〔소와곰 보강〕 낙폭 구간 3단계 통합표\n\n| 낙폭 | 대상 | 근거 출처 |\n|---|---|---|\n| **-15%** | 끼 있는 종목의 1차 반등, 상한가 종목의 급락, 3연상 종목 | [소와곰정리], [소와곰 230504·241026] |\n| **-25~-30%** | 대형주 당일 급투매(2분할), 급등주 1차, 3연상 종목 2차 | [월독프 7주차], [소와곰 241018] |\n| **-30~-40%** | 급등주 표준 낙폭과대(3분할), 차읽남 원본 기준 | [월독프 7주차], [차읽남 221226] |\n| **-50%** | 깊은 투매 — **끼 있는 종목에 한정** | [소와곰 241026] |\n\n- **공통 전제**: 거래량이 잘 터지는(=끼가 있는) 종목이어야 하고, **계단식 하락은 대상이 아니다.**\n- **실행 제한**: 첫 하락 구간에서만. 이후는 3번째 하락까지 대기. 최대 5거래일 보유.\n- **진입 트리거**: 하락 추세를 돌리는 모습 또는 **급락 첫 파동의 고점 돌파**.\n- **원인 확인**: 이유 없는 급락이면 회사 홈페이지에서 원인을 찾는다 — 찾으면 큰 기회.\n"}, {"label": "대형주단기매매", "file": "E15_대형주단기매매_가이드.md", "md": "# 3차 — E. 대형주·일정주 단기매매 실전 가이드 [차읽남]\n\n---\n\n## 대형주 단기스윙 — 장전 루틴\n\n### 1. 급락 원인 분석 (진입 전 필수)\n- [ ] 시장 전반 하락인가? (관세·금리·환율 등 매크로)\n- [ ] 섹터/개별 종목 이슈인가? (실적·규제·악재)\n- [ ] **일시적 공포**인가 vs **구조적 문제**인가?\n  - 일시적 공포 = 매매 OK\n  - 구조적 문제 = 패스\n\n### 2. 종목 상태 확인\n- [ ] 정배열 종목인가? (상승 추세 중 급락)\n  - YES → 단기스윙 유효\n  - 역배열 → 반등 약함, 패스\n- [ ] 기관·외국인 순매수 시작했는가?\n- [ ] 반대매매 물량 소화됐는가?\n\n### 3. 지지선 확인\n- [ ] 이평선 근처인가?\n- [ ] 박스권 하단·전저점 부근인가?\n\n---\n\n## 대형주 단기스윙 — 장중 루틴\n\n### 진입 타이밍\n- 장 초반 : 반대매매 여전히 나올 수 있음 → 관찰\n- **종가 부근** 선호 (장 막판 수급 확인 후 진입)\n- 분봉에서 반등 시작 확인 후 진입\n\n### 분할매수 실행\n1. 1차: -10% 이상 하락 자리\n2. 2차: 추가 -5% 자리\n3. 3차: 바닥 다진 후 반등 시\n\n### 보유 중 대응\n- 반등 완만 → 분할 매도로 수익 점진 실현\n- 5일 내 반등 없으면 → 비중 축소 또는 익절 대응\n\n---\n\n## 일정주 단기매매 — 장전 루틴\n\n### 1. 일정 정보 파악\n- [ ] 네이버·구글·DART로 이벤트 일정 확인\n- [ ] 남은 일정 기간은? (충분한 기간 있는가?)\n- [ ] 현재 주가 위치는? (고점 = 재료소멸 주의 / 저점 = 발표날 상승 기대)\n\n### 2. 종목 선정\n- [ ] 대장주 또는 2등주인가? (꼴등주 = 패스)\n- [ ] 이미 많이 올라 고점인가? → 패스\n- [ ] 3음봉 이상 하락 후 반등 자리인가? → 진입 준비\n\n### 3. 지지선 설정\n- [ ] 급격한 상한가 종목 → **라운드피겨** 기준 지지선 설정\n- [ ] 공방 있는 자리 → 더 신뢰도 높은 지지선\n\n---\n\n## 일정주 — 장중 루틴\n\n- 하락 발생 시 **추가매수 금지**, 즉시 손절 판단\n- 지지선 이탈 → 기계적 손절\n\n---\n\n## 핵심 10초 복기\n\n**대형주:**\n1. **일시적 공포 + 정배열** = 단기스윙 진입 조건\n2. **종가 부근** 진입 선호 (장 초반 반대매매 주의)\n3. 분할매수 → 분할매도 (반등 완만)\n4. 5일 내 반등 없으면 비중 축소\n\n**일정주:**\n1. **일정 전 상승 = 재료소멸** 주의\n2. **대장·2등주만** 선택\n3. **하락 = 즉시 손절** (추가매수 금지)\n4. 라운드피겨 = 급격 상한가 종목의 지지선 기준\n\n\n---\n\n## 〔차읽남 강의자료 보강〕 10일선 매매 (상승장 중대형주 눌림)\n\n> 3일선(초단기) · 8일선(단기) 위에 놓이는 **세 번째 계층**. 상승장 중대형주 전용.\n\n### 적용 환경 4조건 (모두 충족)\n① 코스피 거래대금 **15조원 이상 + 우상향** ② 종목 차트가 **신고가 또는 박스권 돌파** ③ **기관·외국인 순매수가 탄탄** ④ **현재 주도 섹터** 또는 업황 양호\n\n### 종목 선정\n- **15% 이상 장대양봉** 후 박스권 돌파 또는 신고가\n- 장대양봉 당일 **기관·외인 중 한 주체 순매수 大**, **양매수면 더 좋음**\n- 첫 상승 이후 반등을 주지 않았고 **외인·기관 이탈이 적은** 종목이 **10일선 근처**로 올 때\n- 기관·외국인주는 **2개 양봉 합산 15% 이상**이면 기준봉 인정\n- 수급 확인: **[0796]에서 최근 2~3개월** 기간 설정해 순매수·이탈 점검\n\n### 매매 원칙\n| 항목 | 기준 |\n|---|---|\n| 분할매수 | 박스권 하단 또는 **10일선 부근**(정확히는 7~10일선 사이) |\n| 손절 | **박스권 하단 이탈 또는 -5%선** |\n| 수익실현 | 박스권 상단 근처 또는 매수세 붙을 때 분할매도 |\n| 시간 | **5일 이내 반등 없으면 정리** |\n\n- **강한 시기에는 박스권 하단까지 안 내려온다** → 10일선에서 매수하되, 다음날 10일선 위치를 예측(주가 상승 시 10일선도 상승)해 분할.\n- **10일선 살짝 이탈 허용**: 2차 박스를 만들며 이격이 작아진 상태면 살짝 깨도 무방(완전히 꺾이지 않는 한).\n- **감점**: 시간외(애프터마켓) 상승.\n- **그룹주 순환매 활용**: 대장주 반등 확인 후 다음 순번 선점(카카오 → 카카오뱅크 → 카카오페이).\n"}]};

    const seedKey='seed|'+filterKey();
    if(!st[seedKey] || st[seedKey].length!==l.length){
      let idx=l.map((_,i)=>i);
      for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
      st[seedKey]=idx; save();
    }
    l = st[seedKey].map(i=>l[i]).filter(Boolean);
  }
  return l;
}

let list = getList();
let pos = st.pos[filterKey()] || 0;

const card=document.getElementById('card');
function clampPos(){ if(pos<0)pos=0; if(pos>=list.length)pos=list.length-1; if(list.length===0)pos=0; }
function render(){
  list = getList(); clampPos();
  document.getElementById('modeBtn').textContent = st.mode==='order'?'순서':'랜덤';
  document.getElementById('modeBtn').classList.toggle('on', st.mode==='random');
  document.getElementById('favBtn').classList.toggle('on', st.favOnly);
  document.getElementById('catInfo').textContent = (st.cat==='ALL'?'전체':cats[st.cat]);
  card.classList.remove('flip');
  if(list.length===0){
    document.getElementById('fTitle').textContent='카드 없음';
    document.getElementById('fQ').textContent = st.favOnly?'즐겨찾기한 카드가 없습니다.':'';
    document.getElementById('counter').textContent='0 / 0';
    document.getElementById('barFill').style.width='0%';
    document.getElementById('star').style.display='none';
    document.getElementById('bBody').textContent='';
    document.getElementById('fCode').textContent='';document.getElementById('fCat').textContent='';
    document.getElementById('fTitle').textContent= st.favOnly?'즐겨찾기 비어있음':'카드 없음';
    return;
  }
  document.getElementById('star').style.display='block';
  const c = list[pos];
  document.getElementById('fCode').textContent=c.code;
  document.getElementById('bCode').textContent=c.code;
  document.getElementById('fCat').textContent=cats[c.cat]||c.cat;
  document.getElementById('fRev').style.display = c.review?'inline-block':'none';
  document.getElementById('fTitle').textContent=c.title;
  document.getElementById('fQ').textContent=c.front||c.title;
  document.getElementById('bBody').textContent=c.back||'(내용 없음)';
  document.getElementById('bSrc').textContent= c.source? ('출처 '+c.source):'';
  const star=document.getElementById('star');
  star.classList.toggle('on', !!st.fav[c.code]);
  document.getElementById('counter').textContent=(pos+1)+' / '+list.length;
  document.getElementById('barFill').style.width=((pos+1)/list.length*100)+'%';
  st.pos[filterKey()]=pos; save();
}

card.addEventListener('click',e=>{ if(e.target.id==='star')return; card.classList.toggle('flip'); });
document.getElementById('star').addEventListener('click',e=>{
  e.stopPropagation();
  const c=list[pos]; if(!c)return;
  st.fav[c.code]=!st.fav[c.code]; if(!st.fav[c.code])delete st.fav[c.code];
  save(); render();
});
function go(d){ if(list.length===0)return; pos+=d;
  if(pos>=list.length)pos=0; if(pos<0)pos=list.length-1; render(); }
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('modeBtn').onclick=()=>{ st.mode=st.mode==='order'?'random':'order';
  pos=st.pos[filterKey()]||0; save(); render(); };
document.getElementById('favBtn').onclick=()=>{ st.favOnly=!st.favOnly; save();
  pos=st.pos[filterKey()]||0; render(); };
catSel.onchange=()=>{ st.cat=catSel.value; save(); pos=st.pos[filterKey()]||0; render(); };
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('현재 필터의 진행 위치를 처음으로 되돌릴까요?')){ pos=0; st.pos[filterKey()]=0; save(); render(); }
};
// 키보드(PC)
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '){e.preventDefault();card.classList.toggle('flip');}
});
// 스와이프(모바일)
let sx=0;
card.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>60){ go(dx<0?1:-1);} });

// ── 탭: 카드 / 체크리스트(3차 가이드) ──────────────────────────────
st.tab = st.tab || 'card';
st.guide = st.guide || (GUIDES.guides[0] && GUIDES.guides[0].label);

const tabCard = document.getElementById('tabCard');
const tabChecklist = document.getElementById('tabChecklist');
const cardControls = document.getElementById('cardControls');
const cardEl = document.getElementById('card');
const cardNav = document.getElementById('cardNav');
const cardFooter = document.getElementById('cardFooter');
const checklistView = document.getElementById('checklistView');

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return s;
}

// 아주 단순한 마크다운 → HTML 변환기 (헤더/표/목록/체크박스/인용/굵게/구분선)
function mdToHtml(md){
  const lines = md.split('\n');
  let html = '', i = 0;
  let inList = null; // 'ul' | 'ol'
  function closeList(){ if(inList){ html += '</'+inList+'>'; inList=null; } }
  while(i < lines.length){
    const ln = lines[i];
    const t = ln.trim();

    if(!t){ closeList(); i++; continue; }

    // 표
    if(t.startsWith('|')){
      const rows = [];
      while(i < lines.length && lines[i].trim().startsWith('|')){
        rows.push(lines[i].trim()); i++;
      }
      // 두번째 행이 구분선(---|---)이면 헤더 있는 표
      const cells = r => r.slice(1, r.endsWith('|')?-1:undefined).split('|').map(c=>c.trim());
      let hdr = null, body = rows;
      if(rows.length>1 && /^[-:\s|]+$/.test(rows[1])){ hdr = cells(rows[0]); body = rows.slice(2); }
      closeList();
      html += '<table>';
      if(hdr){ html += '<tr>'+hdr.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>'; }
      body.forEach(r=>{ html += '<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; });
      html += '</table>';
      continue;
    }

    // 구분선
    if(/^-{3,}$/.test(t)){ closeList(); html += '<hr>'; i++; continue; }

    // 헤더
    let m = t.match(/^(#{1,4})\s+(.*)$/);
    if(m){ closeList(); const lvl = Math.min(m[1].length,3); html += '<h'+lvl+'>'+inline(m[2])+'</h'+lvl+'>'; i++; continue; }

    // 인용
    if(t.startsWith('>')){
      closeList();
      let q = [];
      while(i < lines.length && lines[i].trim().startsWith('>')){ q.push(lines[i].trim().replace(/^>\s?/,'')); i++; }
      html += '<blockquote>'+q.map(inline).join('<br>')+'</blockquote>';
      continue;
    }

    // 체크박스 목록
    m = t.match(/^-\s*\[[ xX]\]\s*(.*)$/);
    if(m){
      if(inList!=='ul'){ closeList(); html += '<ul>'; inList='ul'; }
      html += '<li class="chk">'+inline(m[1])+'</li>'; i++; continue;
    }

    // 일반 불릿 (들여쓰기 포함)
    m = t.match(/^[-*]\s+(.*)$/);
    if(m){
      if(inList!=='ul'){ closeList(); html += '<ul>'; inList='ul'; }
      html += '<li>'+inline(m[1])+'</li>'; i++; continue;
    }

    // 번호 목록
    m = t.match(/^\d+[.)]\s+(.*)$/);
    if(m){
      if(inList!=='ol'){ closeList(); html += '<ol>'; inList='ol'; }
      html += '<li>'+inline(m[1])+'</li>'; i++; continue;
    }

    // 문단
    closeList();
    html += '<p>'+inline(t)+'</p>';
    i++;
  }
  closeList();
  return html;
}

function renderChecklist(){
  const picker = document.getElementById('gdPicker');
  if(!picker.dataset.built){
    picker.innerHTML = '<select id="gdSel">'+GUIDES.guides.map(g=>
      '<option value="'+esc(g.label)+'">'+esc(g.label)+'</option>'
    ).join('')+'</select>';
    picker.dataset.built = '1';
    document.getElementById('gdSel').onchange = (e)=>{
      st.guide = e.target.value; save();
      document.getElementById('gdBody').innerHTML = renderGuideBody();
      checklistView.scrollTop = 0;
    };
  }
  document.getElementById('gdSel').value = st.guide;
  document.getElementById('gdBody').innerHTML = renderGuideBody();
}
function renderGuideBody(){
  const g = GUIDES.guides.find(x=>x.label===st.guide) || GUIDES.guides[0];
  return g ? mdToHtml(g.md) : '';
}

function showTab(tab){
  st.tab = tab; save();
  tabCard.classList.toggle('on', tab==='card');
  tabChecklist.classList.toggle('on', tab==='checklist');
  const cardOn = tab==='card';
  cardControls.style.display = cardOn?'':'none';
  cardEl.style.display = cardOn?'':'none';
  cardNav.style.display = cardOn?'':'none';
  cardFooter.style.display = cardOn?'':'none';
  checklistView.style.display = cardOn?'none':'flex';
  if(!cardOn) renderChecklist();
}
tabCard.onclick = ()=>showTab('card');
tabChecklist.onclick = ()=>showTab('checklist');

render();
showTab(st.tab);
</script>
