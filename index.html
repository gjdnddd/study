<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단타 규칙카드</title>
<style>
:root{
  --bg:#0f1115; --panel:#1a1d24; --panel2:#22262f; --line:#2e333d;
  --txt:#e8eaed; --sub:#9aa0a9; --accent:#4f8cff; --accent2:#ffb454;
  --green:#3ecf8e; --red:#ff5d5d; --gold:#ffd54a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;}
header{padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.title{font-weight:700;font-size:16px;margin-right:auto;}
select,button{font-family:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);padding:7px 10px;cursor:pointer;}
select{max-width:46vw;}
button:active{transform:scale(.97);}
.btn-acc{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.toggle.on{background:var(--accent2);border-color:var(--accent2);color:#1a1d24;font-weight:700;}
.bar{height:4px;background:var(--panel2);border-radius:3px;margin-top:10px;overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s;}
.meta{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:10px;align-items:center;}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 14px;gap:14px;}
.card{width:100%;max-width:560px;min-height:62vh;perspective:1600px;cursor:pointer;}
.inner{position:relative;width:100%;height:100%;min-height:62vh;
  transition:transform .5s;transform-style:preserve-3d;}
.card.flip .inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;display:flex;flex-direction:column;}
.back{transform:rotateY(180deg);background:var(--panel2);}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--sub);}
.chip.cat{background:rgba(79,140,255,.15);color:#9bc0ff;border-color:transparent;}
.chip.rev{background:rgba(255,180,84,.16);color:var(--gold);border-color:transparent;}
.code{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.3px;}
.ctitle{font-size:18px;font-weight:700;margin:6px 0 16px;line-height:1.4;}
.front-q{font-size:20px;line-height:1.55;font-weight:600;color:#fff;}
.front-hint{margin-top:auto;font-size:12px;color:var(--sub);text-align:center;padding-top:18px;}
.back-label{font-size:12px;color:var(--accent2);font-weight:700;margin-bottom:8px;}
.back-body{font-size:16px;line-height:1.7;white-space:pre-wrap;flex:1;}
.src{margin-top:14px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;}
.star{position:absolute;top:16px;right:18px;font-size:22px;color:var(--line);z-index:2;}
.star.on{color:var(--gold);}

.nav{display:flex;gap:10px;width:100%;max-width:560px;}
.nav button{flex:1;padding:13px;font-size:15px;}
footer{padding:10px 14px;text-align:center;font-size:11px;color:var(--sub);}
.empty{color:var(--sub);text-align:center;padding:40px;}

.tabbar{display:flex;gap:6px;margin-top:8px;}
.tabbar button{flex:1;padding:9px;font-size:13px;background:transparent;}
.tabbar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

#checklistView{display:none;width:100%;max-width:560px;flex:1;overflow-y:auto;padding:4px 0 20px;}
.gd-picker{margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;}
.gd-picker select{width:100%;padding:12px 10px;font-size:15px;font-weight:700;background:var(--panel2);
  color:#fff;border:1px solid var(--accent2);border-radius:10px;}
.gd-body{font-size:14px;line-height:1.7;}
.gd-body h1{font-size:17px;margin:0 0 6px;color:#fff;}
.gd-body h2{font-size:16px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line);color:#fff;}
.gd-body h2:first-child{border-top:none;padding-top:0;}
.gd-body h3{font-size:14.5px;margin:14px 0 6px;color:var(--accent2);}
.gd-body p{margin:6px 0;color:var(--txt);}
.gd-body blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);
  background:var(--panel2);border-radius:0 8px 8px 0;color:var(--sub);font-size:13px;}
.gd-body ul,.gd-body ol{margin:4px 0;padding-left:20px;}
.gd-body li{margin:3px 0;}
.gd-body li.chk{list-style:none;margin-left:-20px;padding-left:22px;position:relative;}
.gd-body li.chk::before{content:"☐";position:absolute;left:0;color:var(--accent2);}
.gd-body hr{border:none;border-top:1px solid var(--line);margin:16px 0;}
.gd-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px;}
.gd-body th,.gd-body td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
.gd-body th{background:var(--panel2);color:#fff;}
.gd-body b{color:#fff;}
</style>
</head>
<body>
<header>
  <div class="row">
    <span class="title">단타 규칙카드</span>
  </div>
  <div class="tabbar">
    <button id="tabCard" class="on">카드</button>
    <button id="tabChecklist">체크리스트</button>
  </div>
  <div id="cardControls">
    <div class="row" style="margin-top:8px;">
      <button id="modeBtn" class="toggle">순서</button>
      <button id="favBtn" class="toggle">★ 즐겨찾기</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <select id="catSel"></select>
      <button id="resetBtn">진행 초기화</button>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="meta">
      <span id="counter">-</span>
      <span id="catInfo"></span>
    </div>
  </div>
</header>

<main>
  <div class="card" id="card">
    <span class="star" id="star">★</span>
    <div class="inner">
      <div class="face front">
        <div class="tags">
          <span class="code" id="fCode"></span>
          <span class="chip cat" id="fCat"></span>
          <span class="chip rev" id="fRev" style="display:none;">질문 검수대상</span>
        </div>
        <div class="ctitle" id="fTitle"></div>
        <div class="front-q" id="fQ"></div>
        <div class="front-hint">탭하면 답 보기 ↻</div>
      </div>
      <div class="face back">
        <div class="tags"><span class="code" id="bCode"></span></div>
        <div class="back-label">답 / 행동</div>
        <div class="back-body" id="bBody"></div>
        <div class="src" id="bSrc"></div>
      </div>
    </div>
  </div>
  <div class="nav" id="cardNav">
    <button id="prevBtn">◀ 이전</button>
    <button id="nextBtn" class="btn-acc">다음 ▶</button>
  </div>

  <div id="checklistView">
    <div class="gd-picker" id="gdPicker"></div>
    <div class="gd-body" id="gdBody"></div>
  </div>
</main>
<footer id="cardFooter">탭=뒤집기 · 순서/랜덤 · 즐겨찾기 · 진행 자동저장</footer>

<script>
const DATA = {"cats": {"A": "A 시황·시장환경", "B": "B 매매인프라·HTS", "C": "C 종목선정", "D": "D 차트·파동", "F": "F 리스크·자금관리", "G": "G 심리·루틴·마인드", "E1": "E1 종가배팅", "E2": "E2 양봉·상한가", "E3": "E3 음봉매매", "E4": "E4 돌파매매", "E5": "E5 뉴스매매", "E6": "E6 대형주매매", "E7": "E7 종합·기타", "E8": "E8 신규주눌림", "E9": "E9 급등주눌림", "E11": "E11 바닥권눌림"}, "order": ["G", "F", "A", "B", "C", "D", "E3", "E6", "E1", "E11", "E9", "E8", "E2", "E5", "E4", "E7"], "cards": [{"code": "G-멘탈-01", "title": "장전 명상 루틴", "cat": "G", "type": "B", "front": "「장전 명상 루틴」 — 규칙/대응은?", "back": "장 시작 전 1~2분 명상으로 심리 안정화", "source": "G1(1강 §18.5)", "review": true}, {"code": "G-멘탈-02", "title": "안 보는 매매 — 호가창 비관찰", "cat": "G", "type": "A", "front": "음봉매매(상단) 매수 후", "back": "매수 존 구간에 분할주문만 걸어두고 호가창을 실시간으로 보지 않음(실시간 관찰은 오히려 조기손절·조기매도 유발)\n예외: 양봉 매매는 실시간 관찰 필요(매매 종류별로 다르게 적용)", "source": "G1(5강 §10.7)", "review": false}, {"code": "G-멘탈-03", "title": "복기 — 효율적 범위 선정", "cat": "G", "type": "B", "front": "「복기 — 효율적 범위 선정」 — 규칙/대응은?", "back": "모든 종목을 복기하지 말고 기간(주간·월간) 단위로 손익이 가장 큰 종목 위주로 선별 복기. 형식보다 지속성이 핵심", "source": "G2(1강 §18.5)", "review": true}, {"code": "G-멘탈-04", "title": "복기 데이터를 예측 자산으로 축적", "cat": "G", "type": "B", "front": "「복기 데이터를 예측 자산으로 축적」 — 규칙/대응은?", "back": "매일 장마감 후 특징주·뉴스를 기록(신규/재탕, 상승률)해 과거 이력 데이터를 누적시키고, 향후 유사 뉴스 발생 시 학습효과로 활용", "source": "G2(3강 §5.3)", "review": true}, {"code": "G-멘탈-05", "title": "비교 금지", "cat": "G", "type": "B", "front": "「비교 금지」 — 규칙/대응은?", "back": "타인의 수익(유튜브·커뮤니티 인증 등)과 비교하지 말 것. 비교 대상은 오직 자기 자신, 본인만의 페이스 유지", "source": "G3(1강 §18.3)", "review": true}, {"code": "G-멘탈-06", "title": "손실의 정상화 — 트레이딩 비용 인식", "cat": "G", "type": "B", "front": "「손실의 정상화 — 트레이딩 비용 인식」 — 규칙/대응은?", "back": "초보 단계의 손실은 경험 부족에 따른 자연스러운 비용으로 인식. 많은 수익보다 \"잃지 않는 것\"의 우선순위를 높게 둘 것", "source": "G3(1강 §18.2)", "review": true}, {"code": "G-멘탈-07", "title": "심리적으로 편안한 시드 규모 찾기", "cat": "G", "type": "B", "front": "「심리적으로 편안한 시드 규모 찾기」 — 규칙/대응은?", "back": "과도한 베팅으로 심리적 압박을 받는 규모는 부적합 — 본인이 편안하게 운용 가능한 시드를 찾을 것", "source": "G3(1강 §18.2)", "review": true}, {"code": "G-멘탈-08", "title": "일관된 대응 원칙", "cat": "G", "type": "B", "front": "「일관된 대응 원칙」 — 규칙/대응은?", "back": "동일한 상황에서는 동일한 방식으로 대응. 검증된 기법과 명확한 기준에 의해서만 매수·매도 실행. \"좋아하는\" 매매가 아니라 \"잘하는\" 매매를 추구", "source": "G4(1강 §18.1)", "review": true}, {"code": "G-멘탈-09", "title": "사전 시나리오 수립 습관", "cat": "G", "type": "B", "front": "「사전 시나리오 수립 습관」 — 규칙/대응은?", "back": "급락·급등 등 큰 변동 상황에서는 즉흥 대응이 아니라, 추가매수 조건·손절 한계·확대 베팅 조건을 사전에 시나리오로 설계해두고 그 규칙대로 움직일 것", "source": "G4(7강 §1.2)", "review": true}, {"code": "G-멘탈-10", "title": "예외 적용 시 범위 한정", "cat": "G", "type": "B", "front": "「예외 적용 시 범위 한정」 — 규칙/대응은?", "back": "원칙에 예외를 허용할 때는(\"보수적 상한가 매매법은 대장에만 적용\" 등) 그 예외가 적용되는 범위를 명확히 한정해 일관성을 유지할 것", "source": "G4(8강 §6.3)", "review": true}, {"code": "G-멘탈-11", "title": "신규 매매법 테스트 — 소액 분리 원칙", "cat": "G", "type": "B", "front": "「신규 매매법 테스트 — 소액 분리 원칙」 — 규칙/대응은?", "back": "신규 매매법은 본 계좌 베팅액의 1/20 이하로 테스트, 별도 계좌 분리 권장. 장기간(수개월~수년) 테스트해도 수익이 안 나면 과감히 패스", "source": "G5(1강 §9.1)", "review": true}, {"code": "G-멘탈-12", "title": "수익을 담보로 매매법을 확장", "cat": "G", "type": "B", "front": "「수익을 담보로 매매법을 확장」 — 규칙/대응은?", "back": "한 가지 매매법으로 안정적 수익을 먼저 확보한 후에만 점진적으로 다음 매매법을 추가", "source": "G5(1강 §6.1, §9)", "review": true}, {"code": "G-멘탈-13", "title": "매매 스타일 자가진단 및 불필요한 매매 제거", "cat": "G", "type": "B", "front": "「매매 스타일 자가진단 및 불필요한 매매 제거」 — 규칙/대응은?", "back": "본인 적성(스캘핑/스윙/단타)을 스스로 진단하고, 지속적으로 손실 나는 매매(감에 의존)는 과감히 제거", "source": "G5(1강 §18.4)", "review": true}, {"code": "G-멘탈-14", "title": "트렌드 매매 우선 원칙", "cat": "G", "type": "B", "front": "「트렌드 매매 우선 원칙」 — 규칙/대응은?", "back": "\"단타 매매의 기본은 트렌드 매매다\" — 현재 가장 잘 통하는 매매법·종목·테마를 빠르게 파악하고 적용", "source": "G6(1강 §9.2)", "review": true}, {"code": "G-멘탈-15", "title": "올라운더 지향", "cat": "G", "type": "B", "front": "「올라운더 지향」 — 규칙/대응은?", "back": "한 가지 기법에만 의존하는 태도(\"주식계 공무원\")를 경계하고 다양한 기법을 구사할 수 있는 올라운더를 지향", "source": "G6(1강 §9.2)", "review": true}, {"code": "G-멘탈-16", "title": "단타 선택의 합리적 절충 원칙", "cat": "G", "type": "B", "front": "「단타 선택의 합리적 절충 원칙」 — 규칙/대응은?", "back": "100% 확신이 없는 상승 파동에서는 장기투자(높은 심리비용)보다 단타(낮은 심리비용)로 짧게 수익을 취하는 절충 전략을 기본으로 채택", "source": "G6(1강 §8.3)", "review": true}, {"code": "G-멘탈-17", "title": "인내의 미학 — 선택적 집중", "cat": "G", "type": "B", "front": "「인내의 미학 — 선택적 집중」 — 규칙/대응은?", "back": "모든 종목에 진입하지 않고 꼭 필요한 종목만 선택·집중", "source": "G7(1강 §18.6)", "review": true}, {"code": "G-멘탈-18", "title": "유연한 사고 — 매매법 교체", "cat": "G", "type": "B", "front": "「유연한 사고 — 매매법 교체」 — 규칙/대응은?", "back": "동일 매매로 계속 손실이 나면 관점과 방법을 바꿀 것(예: 종가배팅 부진 시 시가배팅 전환). 단, 이는 \"사전에 정한 규칙을 지키는\" 일관성(G4)과 모순되지 않음 — 안 맞는 규칙 자체를 교체하는 것은 다른 차원", "source": "G7(8강 §19.1)", "review": true}, {"code": "G-멘탈-19", "title": "차근차근 실력 쌓기 — 무리한 투자 금지", "cat": "G", "type": "B", "front": "「차근차근 실력 쌓기 — 무리한 투자 금지」 — 규칙/대응은?", "back": "조급함을 경계, 집 매도·대출 확대·풀미수 등 무리한 투자 금지. 시드머니보다 실력이 핵심임을 인지", "source": "G7(8강 §19.2)", "review": true}, {"code": "G-멘탈-20", "title": "제도 변화 적응 원칙", "cat": "G", "type": "B", "front": "「제도 변화 적응 원칙」 — 규칙/대응은?", "back": "상한가율 변경·NXT 도입·공매도 금지재개 등 제도는 계속 변화하므로 적응을 유일한 해법으로 받아들일 것", "source": "G7(8강 §19.3)", "review": true}, {"code": "G-멘탈-21", "title": "하락장 생존 3원칙", "cat": "G", "type": "B", "front": "「하락장 생존 3원칙」 — 규칙/대응은?", "back": "1. 세력 주도주 집중(시장 방향과 무관하게 수익 내는 종목)\n2. 골든타임 한정 매매(거래량 집중 시간대에만 집중, 나머지는 휴식)\n3. 보유 종목 최소화(가장 강한 1~2개만, 흐름 안 좋으면 즉시 손절 또는 무포 오버나잇)\n--", "source": "G7(8강 §18)", "review": true}, {"code": "G-IMI-멘탈-01", "title": "생존 최우선 — 2~3년 목표", "cat": "G", "type": "B", "front": "「생존 최우선 — 2~3년 목표」 — 규칙/대응은?", "back": "현금 비중·비중 조절·분할 매수 원칙을 지키면 하락장에도 계좌 큰 타격 없음. \"2~3년 살아남기\"를 1순위 목표로 설정", "source": "[IMI 0617·0619]", "review": true}, {"code": "G-IMI-멘탈-02", "title": "포모(FOMO) 차단", "cat": "G", "type": "A", "front": "소수 종목이 독주하는 포모장", "back": "돈 버는 건 극소수임을 인지. 비중을 확 줄여야 포모가 오지 않음. 기대감에 섣불리 잡으면 마음고생", "source": "[IMI 0618·0619 / 주간 0618]", "review": false}, {"code": "G-IMI-멘탈-03", "title": "손절도 잘한 매매", "cat": "G", "type": "B", "front": "「손절도 잘한 매매」 — 규칙/대응은?", "back": "원칙대로 손절한 뒤 확보한 현금으로 4종목 매매해 손실을 메우는 것 = 잘한 매매. \"원칙 지킨 손절은 잘한 매매\"", "source": "[IMI 0618]", "review": true}, {"code": "G-IMI-멘탈-04", "title": "매일 시황 갱신 습관", "cat": "G", "type": "B", "front": "「매일 시황 갱신 습관」 — 규칙/대응은?", "back": "키워드(종전·미국·이란·트럼프 등) 검색으로 시황을 매일 갱신. 넥스트(시간외) 흐름보다 정규장 매수세 위치를 기준으로 트렌드 파악", "source": "[IMI 0619]", "review": true}, {"code": "G-IMI-멘탈-05", "title": "확인 후 진입(관망 우선)", "cat": "G", "type": "B", "front": "「확인 후 진입(관망 우선)」 — 규칙/대응은?", "back": "강한 대장주는 음봉마다 매집·홀딩. 나머지 테마는 먼저 잡지 말고 소식 나오고 상승 확인 후 진입해도 늦지 않음", "source": "[주간 0618]", "review": true}, {"code": "G-IMI-멘탈-06", "title": "환경에 맞는 매매법부터 마스터", "cat": "G", "type": "B", "front": "「환경에 맞는 매매법부터 마스터」 — 규칙/대응은?", "back": "멋있어 보인다는 이유로 내 환경에 안 맞는 매매법(스캘핑 등) 억지로 좇지 말 것. 지금 할 수 있는 매매 환경을 점검 → 맞는 매매법 먼저 마스터 → 점점 빠른 매매로 확장. 바쁜 날은 분할 모으기(코스닥 ETF 등), 시간 날 때 빠른 매매", "source": "[IMI 0622]", "review": true}, {"code": "G-IMI-멘탈-07", "title": "잽 맞으며 생존", "cat": "G", "type": "B", "front": "「잽 맞으며 생존」 — 규칙/대응은?", "back": "스트레이트(풀비중) 안 맞고 잽(분할·현금)만 맞으며 살아남기. 풀비중 -20%는 회복에 +30% 필요·시장 이탈로 이어짐", "source": "[IMI 0623]", "review": true}, {"code": "G-IMI-멘탈-08", "title": "시장이 정해준다 — 인정=손절", "cat": "G", "type": "B", "front": "「시장이 정해준다 — 인정=손절」 — 규칙/대응은?", "back": "갈/안 갈 종목은 시장이 선택. 아니면 인정하고 손절. 종목과 사랑에 빠져 신용·대출로 버티면 반대매매(바이오 고수 30억→청산 사례)", "source": "[주간 0625]", "review": true}, {"code": "G-IMI-멘탈-09", "title": "가상매매·기다림도 매매", "cat": "G", "type": "A", "front": "소액·초보 또는 마땅한 자리 없음", "back": "주도주를 차트만 보고 가상매매로 연습. 매매 안 하고 기다리고 쉴 줄 아는 것도 성공적 매매", "source": "[주간 0625]", "review": false}, {"code": "F-리스크-01", "title": "미수 절대 금지", "cat": "F", "type": "B", "front": "「미수 절대 금지」 — 규칙/대응은?", "back": "미수 사용 금지(사용자 90% 퇴출 통계 인지). 신용은 수익 부분에 한해 제한적 사용(담보비율 140% 이상 유지)", "source": "F2(1강 §6.2, §12)", "review": true}, {"code": "F-리스크-02", "title": "종목당 비중 한도", "cat": "F", "type": "B", "front": "「종목당 비중 한도」 — 규칙/대응은?", "back": "표준: 1/3(약 33%) 이내\n예외: 확신 높은 강세장(코스피 5일선 위 등)에서 최대 70%(2/3)까지", "source": "F2(1강 §12)", "review": true}, {"code": "F-리스크-03", "title": "보유 종목 수 한도", "cat": "F", "type": "B", "front": "「보유 종목 수 한도」 — 규칙/대응은?", "back": "표준: 5종목 이하 권장\n초보자: 3종목 이하\n한계선: 10종목 초과 시 관리 어려움", "source": "F2(1강 §12), F3(1강 §13)", "review": true}, {"code": "F-리스크-04", "title": "물타기 금지 — 예외는 1회성만", "cat": "F", "type": "B", "front": "「물타기 금지 — 예외는 1회성만」 — 규칙/대응은?", "back": "원칙: 물타기 금지\n예외: 확신 있는 종목이 대외 요인으로 갭하락 + 반등 예상 시에만 일회성 허용(매우 드문 경우)", "source": "F3(1강 §13)", "review": true}, {"code": "F-리스크-05", "title": "불타기 비중확대 절차", "cat": "F", "type": "A", "front": "저점은 잘 잡았으나 비중 부족, 반등 확인됨 / 확대 후 다시 저점 이탈", "back": "비중 확대(불타기)\n즉시 비중 축소(전량 또는 절반 매도)", "source": "F3(1강 §16)", "review": false}, {"code": "F-리스크-06", "title": "스윙에서의 1:1 추매 원칙", "cat": "F", "type": "B", "front": "「스윙에서의 1:1 추매 원칙」 — 규칙/대응은?", "back": "스윙 매매에서도 매수금액과 동일한 금액으로만 추가매수(1:1), 평단을 크게 낮추는 피라미딩(2~3배수)은 사용 안 함", "source": "F3(1강 §16)", "review": true}, {"code": "F-리스크-07", "title": "예외적 1:2~1:3 승부수", "cat": "F", "type": "A", "front": "극히 예외적 특수상황(전일 과도한 급락 후 반등을 사전에 확신하는 시나리오, \"1년에 한 번 있을까 말까\")", "back": "평소 1:1 원칙을 깨고 1:2~1:3까지 확대 허용", "source": "F3(7강 §1.2)", "review": false}, {"code": "F-리스크-08", "title": "어드밴스드 종가배팅 비중대응", "cat": "F", "type": "B", "front": "「어드밴스드 종가배팅 비중대응」 — 규칙/대응은?", "back": "과도한 하락 → 추가매수 또는 손절\n과도하고 급격한 상승 → 불타기 또는 수익실현\n장세 불안정 → 시간기준 손절(오후2시) 후 스탠다드로 전환", "source": "F4(2강 §14.3)", "review": true}, {"code": "F-리스크-09", "title": "스나이퍼 종가배팅 — 비중 분산 금지", "cat": "F", "type": "B", "front": "「스나이퍼 종가배팅 — 비중 분산 금지」 — 규칙/대응은?", "back": "여러 자리에 나눠 사는 것보다 맥점 한 자리를 정확히 저격", "source": "F4(5강 §6)", "review": true}, {"code": "F-리스크-10", "title": "ML 매매 적용 제한", "cat": "F", "type": "A", "front": "거래량이 적은 비주력 종목", "back": "ML 매매 적용 금지(거래량이 많은 대장급 종목에만 적용)", "source": "F4(8강 §12.4)", "review": false}, {"code": "F-리스크-11", "title": "가변 타점 — 중간반등 시 타점 하향", "cat": "F", "type": "A", "front": "표준 ML 자리 도달 전 5% 이상 중간 반등", "back": "ML 한 단계 아래로 타점을 낮춰 대기", "source": "F4(8강 §12.2)", "review": false}, {"code": "F-리스크-12", "title": "시스템 리스크 대응", "cat": "F", "type": "A", "front": "키움 등 HTS 주문체결 지연 등 시스템 오류로 계획보다 많은 물량이 한꺼번에 체결", "back": "작은 반등구간이라도 신속 매도로 대응(수익금 확보 우선)", "source": "F4(7강 §10.7)", "review": false}, {"code": "F-리스크-13", "title": "기간컷 — 유연한 한도 설정", "cat": "F", "type": "B", "front": "「기간컷 — 유연한 한도 설정」 — 규칙/대응은?", "back": "무반등 시 사전에 기간(예 3일) 한도를 설정하되, 거북이 파동 등 합리적 근거가 확인되면 보유를 연장하는 유연성 발휘(절대 규칙 아님)", "source": "F5(씨피시스템 사례)", "review": true}, {"code": "F-리스크-14", "title": "반반치킨 — 부분 보유 연장", "cat": "F", "type": "A", "front": "장후반 큰 상승 발생", "back": "전량 매도 대신 일부(예 30%)를 남겨 익일 추가 시세 확인 후 매도", "source": "F6(삼성중공업 사례)", "review": false}, {"code": "F-리스크-15", "title": "승부수 전략 — 30/70 비중 분리", "cat": "F", "type": "B", "front": "「승부수 전략 — 30/70 비중 분리」 — 규칙/대응은?", "back": "30%만 먼저 수익실현 후 나머지 70%로 승부 / 또는 70% 먼저 정리 후 30%만 승부 — 단기 자동매도 습관을 깨고 싶을 때만, 초보자 비권장", "source": "F4(8강 §5.5)", "review": true}, {"code": "F-멘탈-01", "title": "매매빈도 관리", "cat": "F", "type": "B", "front": "「매매빈도 관리」 — 규칙/대응은?", "back": "잦은 장중매매(스캘핑 포함)는 손실누적 원인 — 익절·손절을 1:1 수준으로 관리하고 피라미딩 추매 배제, 확률(승률) 기반 승부", "source": "F1(1강 §17)", "review": true}, {"code": "F-멘탈-02", "title": "벌크업 — 수익금 누적 운용", "cat": "F", "type": "B", "front": "「벌크업 — 수익금 누적 운용」 — 규칙/대응은?", "back": "수익금을 인출하지 않고 투자금에 누적시켜 점진적(5~10%씩)으로 베팅 규모 확대. 인출은 생활비 필요시에만", "source": "F7(1강 §14)", "review": true}, {"code": "F-멘탈-03", "title": "벌크업 한계 시 리셋", "cat": "F", "type": "A", "front": "투자금이 일정 수준을 초과해 손실이 반복되는 \"벽\"에 부딪힘", "back": "투자금을 절반 수준으로 줄여(리셋) 다시 벌크업 시작", "source": "F7(1강 §14.4)", "review": false}, {"code": "F-멘탈-04", "title": "초보자 인출 습관화", "cat": "F", "type": "B", "front": "「초보자 인출 습관화」 — 규칙/대응은?", "back": "초보자는 벌크업 운용자와 달리 일정 수익 누적 시 인출을 습관화할 것\n--", "source": "F7(1강 §18.3)", "review": true}, {"code": "F-손절-01", "title": "손절 기준 7가지(복수 충족 시 종합판단)", "cat": "F", "type": "B", "front": "「손절 기준 7가지(복수 충족 시 종합판단)」 — 규칙/대응은?", "back": "하나만으로도 가능하나 복수 충족 시 더 확실히 손절. 실무적으로 금액기준이 가장 많이 활용됨\n1. 예상과 반대 움직임\n2. 금액 기준(평균 3일치 수익 초과 손실)\n3. 시간 기준(미수 3일 초과 또는 3시간 이상 무변동 밀림)\n4. 추세 기준(매수근거 이평선 이탈+하락지속)\n5. 매수 근거 소멸(재료 , "source": "C2(4강 §5)", "review": false}, {"code": "C-진입-04", "title": "등급별 베팅 강도 차등", "cat": "C", "type": "B", "front": "「등급별 베팅 강도 차등」 — 규칙/대응은?", "back": "S급: 적극 진입\nA급: 진입 가능(개별재료 명확)\nB급: 대장 위주만, 2·3등주는 확률 저하 인지하고 신중\nC급: 회피 권장(단, 섹터 전체 동반상승이면 예외 검토)", "source": "C2(4강 §5)", "review": true}, {"code": "C-진입-05", "title": "JB(제시봉) 발생 종목 우선 검토", "cat": "C", "type": "A", "front": "대형주 전일대비 +10% 이상, 급등주 +15% 이상, 거래대금 500억 이상, 양봉마감", "back": "JB로 분류해 관심종목 등록 및 매매 우선 검토", "source": "C4(2강 §8)", "review": false}, {"code": "C-진입-06", "title": "JB 연속 발생 종목 — 강한 종목으로 평가", "cat": "C", "type": "A", "front": "동일 종목에서 JB가 연속 발생", "back": "강한 종목으로 판단해 매매 우선순위 상향", "source": "C4(2강 §8)", "review": false}, {"code": "C-진입-07", "title": "끼 좋은 종목 우대", "cat": "C", "type": "A", "front": "과거 특정 테마에서 대장·부대장 역할을 했던 종목", "back": "이후 유사/다른 테마에서도 대장·부대장이 될 확률이 높다고 판단해 우대 검토", "source": "C6(2강 §4.2)", "review": false}, {"code": "C-청산-01", "title": "약세 패턴 JB 매도 시그널", "cat": "C", "type": "A", "front": "분봉 JB가 고점에서 약세(파란색) 패턴으로 발생", "back": "매도 시그널로 인식", "source": "C4(2강 §8 분봉JB)", "review": false}, {"code": "C-IMI-선정-01", "title": "안 할 종목 기준 4가지", "cat": "C", "type": "B", "front": "「안 할 종목 기준 4가지」 — 규칙/대응은?", "back": "위 조건 중 하나라도 해당하면 매매 X. \"안 할 종목\" 기준을 명확히 세우면 관찰 종목이 크게 줄어듦\n조건①: 캔들 1~2개로 10%+ 급등(예: 3분봉 1개로 12% 상한가)\n조건②: 3년 연속 영업적자 등 실적 불량 잡주\n조건③: 거래대금 약하고 지속 하락\n조건④: 재료 소멸·역배열 지속", "source": "[IMI 0618·0619]", "review": true}, {"code": "C-IMI-선정-02", "title": "2·3등주 선별 — 섹터 호재 확인 후", "cat": "C", "type": "A", "front": "상한가 1등주 발생", "back": "섹터·재료 연결 → 개별호재인지 섹터호재인지 확인 → 섹터 호재면 끼 있는 2·3등주를 지지·저지바 자리에서 매매", "source": "[IMI 0617·0619]", "review": false}, {"code": "C-IMI-선정-03", "title": "가장 많은 사람이 보는 종목 찾기", "cat": "C", "type": "B", "front": "「가장 많은 사람이 보는 종목 찾기」 — 규칙/대응은?", "back": "매매 종목 선택 시 \"지금 시장에서 가장 많은 사람이 쳐다보는 종목이 무엇인가\"만 계속 질문. 리포트 다량 불필요, 기사 몇 개·차트로 확인", "source": "[IMI 0622]", "review": true}, {"code": "C-IMI-선정-04", "title": "관종 정렬 — 강한 종목 상단 + 핫섹터 한정", "cat": "C", "type": "A" const GUIDES = {"guides": [{"label": "공통루틴", "file": "0_공통루틴.md", "md": "# 3차 — 0. 공통 매매 루틴 (시간순)\n\n> 2.5차 카드(A·B·C·D·F·G, 130개)를 \"장 시작 전 → 장중 → 장 마감 → 마감 후\" 시간 흐름으로 재배치.\n> 전략(E1~E7)에 상관없이 모든 매매에 공통으로 적용되는 절차·원칙만 다룬다.\n> 개별 전략(종가배팅, 음봉매매 등)의 구체적 타이밍·진입기준은 각 전략별 3차 문서(3차-E1~E7)에서 다룸.\n> 카드 출처 태그는 본문 중 [A-진입-01] 형식으로 그대로 유지해, 2.5차 카드와 1:1 추적 가능하게 함.\n\n---\n\n## 1단계. 장 시작 전 (전일 마감 후 ~ 당일 개장 전)\n\n### 1.1 전일 복기 — 가장 먼저 할 일\n하루를 마감했다면 바로 그날 복기를 한다. 모든 종목을 복기하는 건 비효율적이니, 그날 가장 크게 수익이 나거나 손실이 난 종목 위주로만 본다 [G-멘탈-03]. 매일 장마감 후 그날의 특징주·주요 뉴스를 신규/재탕 여부와 상승률까지 함께 기록해두면, 이 데이터가 누적되어 나중에 비슷한 뉴스가 다시 나왔을 때 학습 효과로 작동한다 [G-멘탈-04]. 형식을 갖추는 것보다 매일 빠짐없이 하는 지속성이 더 중요하다.\n\n### 1.2 관심종목 갱신\n- 상승률 기준(JB) 관심종목은 최근 5거래일(주말 제외)치만 유지하며 매일 갱신한다. 테마별 관심종목(로봇·바이오 등)과는 별도로 관리하고 혼용하지 않는다 [B-선정-01, B-선정-02].\n- 거래대금 기준을 충족하지 못해도 상한가를 기록한 종목은 전부 별도로 등록해둔다 [B-선정-03].\n- 기준값(거래대금 500억, 상승률 15%/10%)은 고정값이 아니다. 시장 유동성이나 상한가율 변경에 맞춰 스스로 조정한다 — 예를 들어 관심종목이 너무 많아지면 1,000억까지 올리고, 장이 침체되면 300억까지 내린다 [C-멘탈-03, B-세팅-04].\n\n### 1.3 신규 주도주 발굴\n기존 주도 섹터(반도체 등)가 정체되면 수급이 다른 종목으로 옮겨간다. \"제2·제3의 주도주\"가 될 종목을 평소에 미리 찾아두는 습관을 들인다 [A-선정-06].\n\n### 1.4 시황 판단 — 가장 먼저 보는 것\n모든 분석은 시황 → 섹터 → 테마 → 종목 → 타점·기법 순으로 위에서 아래로 진행한다. 기법을 먼저 정하고 아무 종목에나 끼워 맞추는 순서는 실패로 이어진다 [A-진입-01].\n\n코스피 지수를 다음 기준으로 먼저 분류한다 [A-선정-01]:\n\n| 구간 | 판정 |\n|---|---|\n| 5일선 위 | 초강세장(강배팅 구간) |\n| 10일선 위 | 강한 상승장 |\n| 20일선 위 | 상승장 |\n| 20일선 아래~60일선 위 | 박스권(횡보) |\n| 60일선 아래 | 하락장 |\n\n정배열(20일선·10일선·5일선이 순서대로 위에 위치)이면 기법 매매·일반 매매 모두 효율이 높다. 역배열(60일선·120일선이 20일선보다 위)이면 하락장으로 보고 베팅에 주의하며, 기법 매매 효율도 떨어진다는 걸 인지한다 [A-진입-02]. 단, 이평선은 참고일 뿐이니 추세·각도·글로벌 시황까지 종합적으로 본다 [A-멘탈-02]. 일봉만으로 상승/하락이 애매하면 월봉으로 전환해 추세를 명확히 한다 [A-선정-02].\n\n### 1.5 미국 시장·해외 지표 체크\n인베스팅닷컴에서 US30(다우)·US500(S&P)·US Tech100(나스닥)·US2000(러셀2000, 중소형주) 4개 선물지수를 확인한다. 대형주 지수와 러셀2000이 동반 상승하면 시장 컨디션이 양호하다는 뜻이고, 대형주만 오르고 러셀2000이 빠지면(\"빅테크만 끌어올리는 장\") 국내 중소형주·테마주는 약세를 예상하고 보수적으로 접근한다 [A-선정-05, A-진입-07]. 코스피200 야간선물도 보조로 참고한다.\n\n### 1.6 세력 주도주 포착\n0659(섹터)+0198(실시간순위)+0147(상한가포착)+0177(과거대장변천사) 4개 화면을 조합해서 그날 강한 종목을 미리 찾아둔다 [B-진입-07].\n\n---\n\n## 2단계. 장중\n\n### 2.1 대장주 서열 판단\n동일 테마에서 여러 종목이 동시에 상한가에 도달하면 즉시 서열을 분류한다. 단순히 누가 먼저 상한가에 갔는지보다, 풀림 정도와 재진입 속도가 더 중요한 판단 기준이다 — 최초 진입이 가장 빨라도 심하게 풀리면 순위가 내려가고, 늦게 진입해도 풀림이 경미하고 재진입이 빠르면 더 높은 서열로 평가한다. 베팅은 \"3등주보다 부대장, 부대장보다 대장\" 순으로 한다 [C-진입-01]. 대장 지위는 영구적이지 않아 통상 2~3일~1주일, 최근엔 장중에도 바뀌므로 수시로 재확인한다 [C-멘탈-01]. 종목·날짜·서열은 HTS 메모 기능으로 테마명까지 포함해 구체적으로 기록해둔다 [C-멘탈-02]. 단일 거래일 기준으로 강해 보이는 종목과, 주·월 단위 누적 추세로 본 진짜 대장이 다를 수 있다는 점도 염두에 둔다 [A-선정-07].\n\n### 2.2 종목 등급 판별\n상한가 종목은 다음 기준으로 등급을 매긴다 [C-진입-03, C-진입-04]:\n\n| 등급 | 기준 | 대응 |\n|---|---|---|\n| S급 | HTS 호재뉴스+강한 재료+테마 대장주+당일 주도주+신선한 재료+오전 강한 상한가 | 적극 진입 |\n| A급 | HTS 호재뉴스 있음, 명확한 개별 재료 | 진입 가능 |\n| B급 | 대장 놓친 2등주, 인터넷 뉴스만 검색됨 | 대장 위주만, 2·3등주는 신중 |\n| C급 | 로켓파동형, 거래대금 부족, 뉴스 전혀 없음 | 회피(섹터 전체 동반상승이면 예외 검토) |\n\n신규주 첫날 상한가가 300%(스펙주)인 경우는 이 등급표를 그대로 적용하지 말고 별도로 난이도를 평가한다 [C-선정-05].\n\n### 2.3 회피 필터 — 매수 전 마지막 체크\n다음에 해당하면 타점에 도달했어도 매매를 패스한다:\n- 코스닥 3개년 연속 적자, 기준봉 이탈(정배열→역배열 전환), 환기·관리종목, 반등 없는 지속 하락(\"쫄쫄이 하락\") [C-선정-01]\n- 제목만 화려하고 \"검토 중\"·\"예정\" 등 구체성 없는 호재 [C-선정-03]\n- 뉴스 공표 전 이미 매수세가 유입된 선취매 흔적이 분봉에 보임 [C-선정-04]\n- 점상한가로 매물 소화 과정 없이 30% 직행(\"허공\" 구조) — 향후 지지자리를 특정할 수 없음 [D-진입-02 회피판단 연계]\n- 보호예수 해제일이 임박(영업일 아닌 달력일로 15일/30일째 다음날 계산) [C-선정-07]\n\n### 2.4 지표 활용 — 타점 판단\nML·JL·CL 세 지표 중 하나만 고른다면 JL을 가장 신뢰한다(나머지는 보조) [B-멘탈-03]. 단, 모든 지표는 절대 기준이 아니라 참고용이다 [B-멘탈-02].\n\n- JL3(상단매매 표준) 도달 시 1차 매수 검토. 강한 종목은 JL3까지 안 오고 JL2.5~JL2에서 반등하는 경향이 있고, JL4까지 밀리면 약한 종목으로 본다 [B-진입-01, B-진입-02].\n- CL+JL+지지선(또는 라운드피겨)이 겹치는 자리는 신뢰도가 가장 높다 [B-진입-03].\n- JL과 ML이 서로 다른 방향을 가리키면(JL은 위, ML은 아래) 더 보수적인 ML 자리에서 기다리는 쪽으로 전환한다 [B-진입-05].\n- 표준 ML 자리 도달 전에 5% 이상 중간 반등이 나오면, ML을 한 단계 더 아래로 낮춰서 대기한다 [B-진입-06].\n- ML 매매는 거래량이 적은 비주력 종목에는 적용하지 않는다(중간 휩소 위험) — 대장급 종목에만 적용 [B-선정-04].\n- 단일 가격이 아니라 일정 구간(밴드)을 매수 영역으로 잡고, 표준 타점을 중심으로 위·아래 타점을 함께 분할 매수한다 [B-진입-04].\n\n### 2.5 차트 패턴 판단\n- 라운드피겨(0으로 끝나는 가격)와 ML이 겹치는 자리는 적극 매수 검토 [D-진입-03].\n- 거래량이 많이 발생한 자리가 의미 있는 지지/저항이다 [D-진입-04].\n- 박스권을 막 돌파한 첫 자리, 특히 새 테마라면 상대적으로 안전하다 [D-진입-05].\n- 롱바디 상한가(충분히 움직이다 상한가 마감)는 지지·저항이 풍부해 매매하기 가장 쉽다 [D-진입-06].\n- 대시세 차트(바닥권 대량거래+6개월 이상 박스권 돌파)는 계속 상승할 가능성이 높아 관심종목에 등록한다. 단기시세 차트(역배열+매물대 많음)는 재하락 가능성이 높아 신중히 본다 [D-진입-07, D-진입-08].\n- N자 파동(상승→조정→재상승)이 기대되는 구조적 호재 종목은 조정 구간에서 재상승을 기대하며 매수한다 [D-진입-01].\n- 에베레스트 파동(급등 후 급락하는 역V자)은 적극적인 매매 대상으로 선호한다. 거래량이 줄면서 천천히 빠지는 패턴은 매매 대상에서 제외한다 [D-진입-02].\n\n### 2.6 비중 조절\n- 물타기는 원칙적으로 금지다. 최저점(맥점) 포착에 집중하는 것이 먼저다 [F-리스크-04].\n- 불타기(비중 확대)는 저점을 잘 잡았는데 비중이 부족할 때, 반등이 확인된 후에만 한다. 확대 후 다시 저점을 이탈하면 즉시 비중을 축소(전량 또는 절반 매도)한다 [F-리스크-05].\n- 추가매수는 1:1 비율(매수금액과 동일한 금액)만 원칙으로 한다. 평단을 크게 낮추는 피라미딩(2~3배수)은 쓰지 않는다 [F-리스크-06].\n- 여러 자리에 나눠 사는 것보다 맥점 한 자리를 정확히 저격하는 쪽을 우선한다 [F-리스크-09].\n- 1:2~1:3까지 확대하는 \"승부수\"는 전일 과도한 급락 후 반등을 사전에 확신하는 등 극히 예외적인 상황(1년에 한 번 있을까 말까)에서만 허용한다 [F-리스크-07].\n\n### 2.7 종목 특성별 추가 판단\n- 동일 호재로 동시 상한가가 떴다면 1~2번째 종목은 강하고 그 이후는 약해지는 경향이 있다 [짝짓기 매매 연계].\n- 과거 특정 테마에서 대장·부대장 역할을 했던 종목(\"끼 좋은 종목\")은 다시 그런 역할을 할 확률이 높다고 보고 우대한다 [C-진입-07].\n- 신규주는 상승·하락 모두 일반 종목 대비 약 3배 탄력을 보인다. 상승 기대도 크지만 하락 위험도 3배라는 걸 비중에 반영한다 [C-선정-08].\n- 같은 자리에 반복해서 재진입(\"두 탕\", \"세 탕\")할수록 확률이 급격히 떨어진다. 첫 자리가 맥점이라는 원칙을 다시 새긴다 [C-선정-09].\n\n---\n\n## 3단계. 장 마감 (15:00 전후 ~ 정규장 종료)\n\n### 3.1 시황 재확인\n장중 판단은 어려우니, 장 마감 시점에 5일선/10일선 이탈 여부로 박스권인지 상승추세인지를 확인한다. 종목별로 평소 조정 패턴(밀림 정도)을 미리 알아두면 비교가 쉽다 [A-선정-03].\n\n### 3.2 손절 여부 최종 점검\n다음 7가지 중 하나라도 해당하면 손절을 검토하고, 복수가 겹치면 더 확실하게 손절한다 [F-손절-01]:\n1. 매수 근거와 반대로 가격이 움직임\n2. 손실액이 평균 3일치 수익을 넘음\n3. 미수 기준 3일 초과, 또는 3시간 이상 의미 있는 변동 없이 밀림\n4. 매수 근거였던 이평선이 깨지고 하락 지속\n5. 매수 이유였던 뉴스·재료가 오보·정정으로 사라짐\n6. 종목 또는 시장 전체에 중대한 악재\n7. 통상 2~3% 손실(개인 기준)\n\n판단이 애매하면 이렇게 스스로 묻는다: \"지금 이 종목을 안 들고 있다고 가정하고, 지금 가격에 같은 비중으로 다시 살 의향이 있는가?\" 있으면 보유 유지, 없으면 손절을 검토한다 [F-손절-02].\n\n---\n\n## 4단계. 마감 후 (장 종료 ~ 다음날 개장 전)\n\n### 4.1 NXT 시간대 대응\nNXT 프리·애프터마켓은 주로 개인 중심이고, 기관·외국인은 KRX 정규장 시간에 주로 개입한다. NXT에서 보유 물량을 전량 매도하기보다, 정규장 확인 후 대응(반반치킨 또는 오후 매수)이 더 안전하다.\n\n### 4.2 분할매도 — 반반치킨\n오른다고 무조건 다 파는 게 아니라, 장후반 큰 상승이 났을 때 일부(예 30%)를 남겨 익일 추가 시세를 확인한 뒤 매도하는 쪽이 더 효율적이다 [F-리스크-14].\n\n### 4.3 시스템 리스크 대응\nHTS 주문체결이 지연되는 등 시스템 오류로 계획보다 많은 물량이 한꺼번에 체결될 수 있다. 이런 경우 작은 반등구간이라도 신속하게 매도해 수익금을 먼저 확보한다 [F-리스크-12].\n\n### 4.4 그날의 복기\n1단계로 돌아가 그날 손익이 가장 컸던 종목 위주로 복기하고, 다음날 관심종목을 다시 갱신한다.\n\n---\n\n## 상시 적용 원칙 (시간 구분 없이 항상)\n\n### 자금 관리 — 협상 불가능한 기초 원칙\n- 미수는 절대 금지한다. 미수 사용자의 약 90%가 시장에서 퇴출된다는 점을 항상 기억한다. 신용은 수익 부분에 한해서만, 담보비율 140% 이상을 유지하며 제한적으로 쓴다 [F-리스크-01].\n- 종목당 비중은 통상 1/3(약 33%) 이내로 관리한다. 확신이 높은 강세장에서만 예외적으로 최대 70%까지 허용한다 [F-리스크-02].\n- 보유 종목 수는 기본 5종목 이하, 초보자는 3종목 이하를 권장한다. 10종목을 넘으면 관리가 어려워진다 [F-리스크-03].\n- 수익금은 인출하지 않고 투자금에 누적시켜(벌크업) 점진적으로(5~10%씩) 베팅 규모를 키운다. 인출은 생활비가 필요할 때만 한다. 투자금이 일정 수준을 넘어 손실이 반복되는 \"벽\"에 부딪히면, 절반 수준으로 줄여(리셋) 다시 시작한다 [F-멘탈-02, F-멘탈-03]. 단, 초보자는 일정 수익이 쌓이면 인출을 습관화하는 쪽이 낫다 [F-멘탈-04].\n\n### 매매 빈도 관리\n잦은 장중 매매(스캘핑 포함)는 손실 누적의 주된 원인이다. 익절·손절을 1:1 수준으로 관리하고 피라미딩 추매를 배제해서 확률(승률) 기반으로 승부한다 [F-멘탈-01].\n\n### 멘탈 관리\n- 장 시작 전 1~2분 명상으로 심리를 안정화한다 [G-멘탈-01].\n- 음봉매매처럼 매수 후 굳이 실시간으로 지켜볼 필요가 없는 매매는 분할주문만 걸어두고 호가창을 보지 않는 게 오히려 유리하다(실시간 관찰이 조기손절·조기매도를 유발할 수 있음). 단, 양봉 매매는 실시간 관찰이 필요하다는 점에서 다르게 적용한다 [G-멘탈-02].\n- 타인의 수익과 비교하지 않는다. 비교 대상은 오직 자기 자신이다 [G-멘탈-05].\n- 초보 단계의 손실은 경험 부족에 따른 자연스러운 비용으로 받아들인다. 많은 수익보다 \"잃지 않는 것\"을 우선한다 [G-멘탈-06]. 과도한 베팅으로 심리적 압박을 받는 시드 규모는 부적합하니, 본인이 편안하게 운용 가능한 규모를 찾는다 [G-멘탈-07].\n\n### 일관된 대응\n- 동일한 상황에는 동일한 방식으로 대응한다. 검증된 기법과 명확한 기준으로만 매수·매도한다 — \"좋아하는\" 매매가 아니라 \"잘하는\" 매매를 추구한다 [G-멘탈-08].\n- 큰 변동이 예상될 때는 즉흥 대응이 아니라, 추가매수 조건·손절 한계·확대 베팅 조건을 미리 시나리오로 짜두고 그 규칙대로 움직인다 [G-멘탈-09].\n- 원칙에 예외를 둘 때는(\"보수적 상한가 매매법은 대장에만 적용\" 등) 그 예외의 범위를 명확히 한정해서 일관성을 지킨다 [G-멘탈-10].\n\n### 매매법 운용\n- 신규 매매법은 본 계좌 베팅액의 1/20 이하로, 별도 계좌에서 테스트한다. 장기간 테스트해도 수익이 안 나면 과감히 패스한다 [G-멘탈-11].\n- 한 가지 매매법으로 먼저 안정적 수익을 확보한 뒤에야 다음 매매법을 추가한다 [G-멘탈-12].\n- 본인의 매매 적성(스캘핑/스윙/단타)을 스스로 진단하고, 지속적으로 손실 나는 매매(감에 의존)는 과감히 제거한다 [G-멘탈-13].\n- \"단타 매매의 기본은 트렌드 매매다\" — 지금 가장 잘 통하는 매매법·종목·테마를 빠르게 파악하고 적용한다. 한 가지 기법에만 의존하지 말고 여러 기법을 구사할 수 있는 올라운더를 지향한다 [G-멘탈-14, G-멘탈-15].\n- 동일 매매로 계속 손실이 나면 관점과 방법을 바꾼다. 단, 이것은 \"사전에 정한 규칙을 지키는\" 일관성과 모순되지 않는다 — 안 맞는 규칙 자체를 교체하는 것은 다른 차원의 문제다 [G-멘탈-18].\n\n### 시장·제도 변화 대응\n시황·제도(상한가율, NXT 도입, 공매도 금지·재개 등)는 계속 바뀐다. 적응을 유일한 해법으로 받아들인다 [A-멘탈-01, G-멘탈-20].\n\n### 하락장 생존 3원칙\n1. 세력 주도주 집중(시장 방향과 무관하게 수익 내는 종목 위주)\n2. 골든타임 한정 매매(거래량 집중 시간대에만, 나머지는 휴식)\n3. 보유 종목 최소화(가장 강한 1~2개만, 흐름 안 좋으면 즉시 손절 또는 무포 오버나잇)\n[G-멘탈-21]\n\n---\n\n## 참고 — 본 문서에서 다루지 않는 내용\n\n다음은 전략(E1~E7)마다 기준이 달라서 본 공통 문서에 넣지 않고, 각 전략별 3차 문서에서 다룬다:\n- 종가배팅의 표준 진입 시간대(KRX 15:00~15:30 / NXT 19:30~20:00) — 3차-E1\n- 음봉매매 상단/중단의 구체적 패턴(A/B/C)과 JL3·JL8 구간별 적용 — 3차-E3\n- 뉴스 매매의 체크리스트 7항목과 Buy/Sell 신호 — 3차-E5\n- 대형주 음봉/양봉매매의 NXT 타이밍 — 3차-E6\n- 신규상장주 분석 5단계와 짝짓기 매매 — 3차-E7\n\n\n---\n\n# ⟦IMI · 주간매매 추가⟧ — 공통 루틴\n\n> IMI 강사의 장중 루틴 및 시황 정의 방식을 제시 공통루틴에 추가.\n> 기존 카드 태그는 [A-IMI-진입-01] 형식으로 유지.\n\n## 0단계 추가. 주간 시황 방향 설정 (주말·주초)\n\n주간매매 강의(허웅)로 큰 그림을 먼저 잡는다 [주간 0618].\n- 센티먼트 3대 지표(시그널 게이지·공포탐욕지수·에디얼) 확인 → 저점이면 대장주 음봉 매집 모드, 상단이면 양봉 분할 익절 모드 [A-IMI-선정-01].\n- 이번 주 주요 일정(만기일·실적발표·정책 이벤트) 파악 후 노이즈와 핵심 구분.\n- 지금이 \"쏠림장\"인지 \"분산장\"인지 규정. 쏠림장이면 고정값 4종목 집중 전략 선언 [A-IMI-진입-01].\n\n## 1단계 추가. 장 시작 전 — IMI 시황 정의 루틴\n\n### 1.A 시황 국면 재확인\n- 전일 4종목(삼전·하닉·삼성전기·SK스퀘어) 종가 흐름 확인.\n- 특정 이슈 업데이트(종전·금리·반도체 수급 등) 키워드 검색 → 시황 갱신 [A-IMI-멘탈-01].\n- 지수가 올랐는데 하락 종목이 압도적으로 많은 구조이면 쏠림장 유지 판단 [A-IMI-진입-01].\n\n### 1.B 관종 상단 정렬\n- 500억봉 0~5일차 종목을 등락률 순으로 돌려 살 만한 자리 종목을 관종 상단에 배치 [B-IMI-세팅-02].\n- 직전 저항·지지 가격대에 시세 알림 등록 [B-IMI-세팅-04].\n\n## 2단계 추가. 장중 — IMI 스캔 루틴\n\n### 2.A 고정 상시 확인\n- 지수 1~3분봉 흐름 + 외인·기관 수급 실시간 확인 [B-IMI-세팅-03].\n\n### 2.B 3종 스캔 (전 화면 X, 대장주 위주만)\n① 실시간 조회순위 → 섹터 연결 → 개별/섹터 호재 구분\n② 상한가·상승률 상하위 → 1등 상한가 시 섹터 동반 여부 확인\n③ 거래대금 상위 → 자금 흐름 파악\n- 상한가 종목 발견 → 섹터·재료 연결 → 끼 있는 2·3등주 저지바 자리 체크 [C-IMI-선정-02].\n\n### 2.C 매매 방식 선택 (성향에 따라)\n- **느린 매매(직장인)**: 횡보 박스권에서 지지 확인 후 분할 매집 [E7-IMI].\n- **빠른 매매**: 직전 저항대 시세 알림 → 돌파 알림 오면 추가 진입 [B-IMI-세팅-04].\n\n### 2.D 음봉 종목 판단\n- 급하게 볼 필요 없음. \"익일 양봉 전환 가능성(좋은 기사·시황)이 있는가\" 기준으로만 판단.\n- 재료 소멸 종목(기술적 반등 있어도) X. 핵심: \"매수 버튼 한 명이라도 더 누를 종목인가\" [D-IMI-진입-01].\n\n## 4단계 추가. 마감 후 — IMI 루틴\n\n- 시세알림·자동매도 설정 확인 및 다음날 진입 계획 업데이트.\n- 오늘 특징주·뉴스(신규/재탕 여부, 상승률) 기록 → 누적 데이터로 학습 [G-멘탈-04].\n- 넥스트(시간외) 양호해도 정규장 시작하면 다 던져지는 경우 많음 → 넥스트 매매 지양, 수익은 무조건 실현 [E7-IMI-청산-02].\n\n---\n\n# 〔2026-06-22 보강〕 — 공통 루틴 추가 [IMI 0622]\n\n## 0단계 보강. 매매 환경 진단 (시작 전 셀프 점검)\n- 내가 지금 어떤 매매를 할 수 있는 환경인지 먼저 점검(직장·운전 등) → 그 환경에 맞는 매매법을 먼저 마스터 [G-IMI-멘탈-06].\n- 바쁜 날은 분할 모으기(코스닥 ETF 지지구간 분할 등), 짧게라도 장 볼 수 있는 날은 빠른 매매로 전환.\n\n## 1단계 보강. 종목 선별 핵심 질문\n- \"지금 시장에서 가장 많은 사람이 보는 종목이 무엇인가\"를 계속 질문 → 답이 곧 매매 대상 [C-IMI-선정-03].\n- 관종 상단 = 각 핫섹터에서 가장 강하고 잘 버티는 종목. 차트 반등 자리는 핫한 섹터·재료일 때만 상단 등록 [C-IMI-선정-04].\n\n## 2단계 보강. 강약 판단 (장중 실시간)\n- 강한 종목 = 많이 오르고 조정 적게 받는 종목. 상승폭 대비 조정 깊으면 약한 종목으로 보고 회피 [D-IMI-진입-05].\n- 고점·저점 흐름으로 추세 확인(저점 안 깨면 상승 유지). 같은 섹터면 정배열·10일선 위가 강함.\n- 일봉 저지바 종목이 같은 섹터 대비 덜 올랐고 + 당일 그 섹터가 자금 쏠리는 장이면 → 따라잡기 진입 [D-IMI-진입-06].\n\n## 4단계 보강. 익절 기준 점검\n- 크게 수익난 종목은 \"고점 대비 일정 % 하락 시 매도\" 기준을 사전 설정. 전량 홀딩으로 욕심내지 않음 [F-IMI-손절-03].\n\n---\n\n# 〔2026-06-23~25 보강〕 — 급락·반등장 대응 [IMI 0623·0624 / 주간 0625]\n\n## 0단계 보강. 마이크론·실적 체크 (장 전)\n- 반도체 대형주 매매 시 마이크론 실적·시간외, 미 PCE 등 매크로 지표를 장 전까지 확인 [A-IMI-선정-06]. 가이던스 압도 여부로 셀온 가능성 판단 [A-IMI-진입-04].\n\n## 1단계 보강. 줄긋기 세팅\n- 전날 15분봉 중요 지지구간(여러 지지 겹치는 곳)에 줄 긋고 3분봉으로 옮겨둠. 줄은 영역 판단용(대충). 직장인은 전날 MTS로 미리 세팅 [B-IMI-세팅].\n\n## 2단계 보강. 급락장 대응 루틴\n- 종목 5% 이상 하락 시 \"쎄함\" 감지 → 과거 급락일 최대 낙폭과 비교해 한계 가정 [F-IMI-손절-04].\n- 한 번 상승 후 조정이 직전 저점 깨는지 확인, 쌍바닥·짝궁뎅이에서 보수적 분할 [D-IMI-진입-08].\n- 시가(노란선) 훼손 여부로 강약 실시간 판단 [D-IMI-진입-07].\n- 풀비중 종목 -5% 손절(잡주는 그 전이라도 저점 깨면), 다른 종목 던지고 고정값으로 갈아탐 [F-IMI-손절-05].\n- 인버스는 당일 단타로만, 예상과 다르면 즉시 손절 [F-IMI].\n\n## 2단계 보강. 반등장 대응 루틴\n- 전날 급락 시 분할 매수해 둔 고정값을 반등 시 익절(가장 먼저·크게 반등하는 대장 위주) [E6-IMI].\n- 1등주 판별 3기준(거래대금·상승률·선반응)으로 대장 확인, 후발주·잡주 제외 [C-IMI-선정-06·08].\n\n## 4단계 보강. 손절·현금 관리\n- 종목당 최대금액 정하고 등급별 차등, 현금비중 50~60% 유지. 차트보다 자금·비중·현금이 우선 [F-IMI].\n- 실적 불확실 이벤트 앞에서는 1차만 오버나이트 [F-IMI-진입-05].\n- 매매 안 하고 기다리는 것도 매매. 소액·초보는 주도주 가상매매 연습 [G-IMI-멘탈-09].\n\n---\n\n# 〔2026-06-26·29 보강〕 — 시황 정의·고점 대응 [IMI 0626·0629]\n\n## 1단계 보강. 시황 한 줄 정의 (매일)\n- 지수 방향 × 상승/하락 종목 수 4메커니즘으로 \"오늘은 어떤 장인가\"를 한 줄 정의(동료가 물으면 바로 답할 정도) [A-IMI-선정-07].\n- 외국인+기관 동시 매수 구간 = 최고 매수 신호. 코스닥은 외인 매수 유입 시 지수 ETF 분할 고려.\n\n## 2단계 보강. 고점 시그널 감지\n- 상승 2파 고점에서 대량 음봉 거래량 = 도망 신호(대형주 한정) → 비중 5~10% 축소 + 칼손절 [D-IMI-진입-11, F-IMI-리스크-07].\n- 이벤트·발표 일정은 가까울수록 재료 식상 → 미리 익절, 당일 당시각 매수 금지 [A-IMI-진입-05].\n\n## 2단계 보강. 매매할 종목 없으면 쉼\n- 마땅한 자리 없으면 현금·비중 유지하며 쉬는 것도 정답 [G-IMI-멘탈-10]. 테마는 1·2등주만 [C-IMI-선정-09].\n\n## 4단계 보강. 손절 후회 배제\n- 손절 후 반등해도 결과론으로 후회 X. 그 순간 정보로 옳게 판단했으면 됨 [G-IMI-멘탈-11].\n- 자동매도 주문은 당일 무효면 반드시 해제(다음날 시가 오체결 방지).\n\n---\n\n# 〔2026-06-30 + 7월 전망 보강〕 [IMI 0630 / 클로징 / 플로우 26-07]\n\n## 1단계 보강. 월간 프레임 (7월)\n- 실적은 배신 안 함(삼전·닉스 12M PER 7~8배 저평가). 변동성은 노이즈, 추세는 실적. K-Nifty 초양극화 = 실적 나오는 곳만 [플로우 26-07].\n- 변동성의 정체 = 포모+탐욕+레버리지 숏 감마 → 종가 부근 조정은 던질 자리가 아니라 분할매수 보너스 [A-플로우-판단-01·02].\n\n## 1단계 보강. 저가매수 판별\n- \"많이 빠졌다\"만으로 사지 말 것. 실질 저평가(PER)면 O, 코스닥 소부장 고평가면 X [A-IMI-선정-08].\n- 앞 상승 거래량 잡아먹는 대량 음봉 = 정보 유출 정황 → 매수 중단, 뒤통수 공시 종목은 블랙리스트 [A-IMI-손절-06].\n\n## 2단계 보강. 진입 판별\n- 저지바는 거래대금 큰 종목만, 당일 단타는 시가 위에서만, 일봉+분봉 동시 확인 [D-IMI-진입-13·14·15].\n- 1등 안 가고 후발주 가면 보내줄 것. 거차 3조건 미충족이면 매매 X [C-IMI-선정-11·12].\n- \"받아주는 손이 있는가\"(눌릴 때 매수세)로 주도주 유효성 확인. 순환매는 짧게, 주도주는 깊게 눌릴 때만 [클로징 0630·0702].\n\n## 4단계 보강. 심리·비중\n- 오버나이트 비중 낮으면 악재가 기회로 느껴짐. 반대매매 안 당하고 살아남으면 상위 30% [F-IMI-리스크-08, G-IMI-멘탈-12].\n- 당일 미발동 자동매도는 반드시 당일 취소 [B-IMI-세팅-05].\n- 강의는 덮고 스스로 설명해봐야 내 지식 [G-IMI-멘탈-13].\n---\n\n# 〔2026-08-24~26 보강〕 — 비중 관리 체계화·요인값 루틴 [IMI 0824·0825·0826]\n\n## 0단계 보강. 매매 환경 진단 — 비중을 먼저 정한다\n- 장 시작 전 시장 유불리를 판정하고 **오늘의 기본 비중**부터 결정한다: 상승추세·거래대금 풍부·매크로 악재 없음 → 비중↑ / 하락추세·거래대금 감소·악재 다수 → 비중 대폭↓ [F-IMI-리스크-09].\n- 거래대금 기준선: **7조 이상**이면 정상 매매, 4~5조면 상승률 자체가 낮으므로 회전·비중 축소 [A-IMI-진입-07].\n- 종목별 최대 비중을 미리 확정: A·S급 20~30% / B·C급 5~10% [F-IMI-리스크-10].\n- 오버나잇을 할 계획이면 **현금 40~50%를 남긴다** [F-IMI-리스크-12].\n\n## 1단계 보강. 요인값 업데이트 (매일 저녁·장전)\n- 관리 섹터별 **요인값 키워드로 검색**해 시황을 갱신한다. 3층 구조로 관리: 시장 전체 / 섹터 / 개별 종목 [A-IMI-판단-02].\n- 재료가 나온 지 며칠 지난 종목은 첫날 이유만으로 판단하지 말고 **회의론까지 포함해 최신 시황을 재확인** [C-IMI-선정-21].\n- 전날 미국에서 강세였던 섹터를 확인하고 대응 섹터를 관종에 반영. 야간선물이 빠졌으면 장 초반 약세를 전제로 계획 [A-IMI-진입-06].\n- 미국 반도체가 약세로 마감했으면 **전날 밤에 일봉·중기 분봉에 지지선을 미리 그어둔다** — 다음 날은 실행만 [E6-IMI-진입-08].\n- 실적·인베스터데이 등 이벤트 일정을 확인하고 **이벤트 전 익절 계획**을 세운다 [F-IMI-청산-01, A-IMI-판단-03].\n\n## 1단계 보강. 관종 3중 구조\n- ① **섹터 관종**(분위기 측정용, 매매 대상 아님) ② **매매 관종**(대장·1·2등주만 상단) ③ **S급 관종**(재료+시황+차트 모두 좋은 종목, 지수 하락일 매수용) [B-IMI-세팅-06·08].\n- 관종 그룹명 칸에 아침 자료 기사 제목을 그대로 복사해 붙여 장중 이슈를 잊지 않는다 [B-IMI-세팅-07].\n- 신규 종목은 요인값과 함께 **에버노트 + 키움 종목 메모장에 이중 저장** [B-IMI-세팅-09].\n\n## 2단계 보강. 진입 전 체크 순서\n1. **회피 필터**: 시총 2~3천억 미만 / 분봉 거래대금 500억 미만 / 호가 두께 얇음 / 3개년 연속 적자 / 캔들 1~2개로 10%+ 급등 → 전부 제외 [C-IMI-선정-13·14·19].\n2. **대장 판정**: 오늘 기준 자금·뉴스·상승률이 가장 강한 종목. 어제 대장을 그대로 쓰지 않는다 [C-IMI-선정-15·16·17].\n3. **수급 확인**(대형주에 한함): 외국인·기관 둘 다 매도면 미진입 [E6-IMI-진입-04·05].\n4. **자리 판정**: 상승 1·2파가 끝난 조정인지 시세 초입인지 구분. 매물대는 위쪽 음봉 개수·시가/고가 겹침으로 계산. 20일선 이탈이면 매매 안 함 [D-IMI-진입-16·21].\n5. **지지 근거 중첩 확인**: 이평선 + 저지바 + 분봉 지지구간이 겹칠수록 확률↑. 단 음봉 거래량이 크면 받지 않는다 [D-IMI-진입-24].\n6. **일봉 지지가격을 분봉에 이식**해 세부 타점 구간을 만든다 [B-IMI-세팅-10].\n\n## 2단계 보강. 지수 판단\n- 지수도 일봉·중기 분봉에 지지·저항선을 긋는다. 급락 중 반등은 **2~3회 확인**(조정 후 저점을 높이는지) 후 매수 준비 [D-IMI-진입-18·25].\n- **시가 위/아래**로 지수와 종목의 강도를 판단. 시가 이탈은 매도 신호, 갭하락 시작 종목은 시가 회복 여부를 본다 [D-IMI-진입-17].\n- 지수가 크게 빠진 날은 상승/하락 종목 수를 비교해 **전반 약세인지 특정 대형주발 조정인지** 구분 [A-IMI-판단-01].\n\n## 2단계 보강. 분할 매수 실행\n- **첫 매수는 무조건 작게**, 이후 피라미드. 하락 시 저점을 깨면 더 사고 지지 구간을 깨면 더 산다 [F-IMI-진입-07].\n- 분봉 안에서도 금액을 달리한다: 꼭짓점·저항대에서는 아주 조금, 눌림·저항→지지 전환 자리에서 비중 확대. 매수할 때마다 \"비중을 높일 자리인가\"를 의식 [F-IMI-진입-08, D-IMI-진입-22].\n- 대장이 반등을 시작하면 같은 섹터 2등주도 지지구간을 체크해 진입(짝꿍 매매) [C-IMI-선정-20].\n\n## 3단계 보강. 손절·청산\n- 손절 2중 기준: **깨면 안 되는 자리 이탈 시 -2%라도 즉시** / **최대 비중 상태에서 -5%면 무조건** [F-IMI-손절-06].\n- 단기 목표가는 직전 고점 또는 상승 1파 길이만큼 잡아 **미리 매도 예약** [D-IMI-청산-01].\n- 이벤트(실적 등)를 앞두면 전량 익절하고 오버나잇하지 않는다. 불확실한 시황(전쟁·합의설)도 당일 단타로만 [F-IMI-청산-01·13].\n- 마감 무렵 약보합 종목은 정리해 현금을 확보 [F-IMI-리스크-12].\n\n## 4단계 보강. 마감 후 루틴\n- 시장정리 종목과 주도 섹터 1·2등주를 돌려보며 **어디가 지지·저항이었는지 선을 그어 복기** [B-IMI-세팅-11].\n- 오늘의 매매가 비중 관리 없이 과감했는지 점검 — **비중·현금·손절 3대 원칙** [G-IMI-멘탈-20].\n- \"오늘 시장은 이랬고, 내일 키포인트는 X이고, 나는 무엇을 할 것인가\"를 **안 보고 말로** 정리. 메모는 실행 계획까지 [G-IMI-멘탈-18·19].\n- 걸러낸 종목이 급등했어도 후회하지 않는다. 놓친 종목을 자책하지 않는다 [G-IMI-멘탈-15].\n\n\n# 〔2026-07-03~06 보강〕 하락의 성격을 판별하는 루틴 [클로징 0703·0706]\n\n> 급락장에서 \"지금 들어가도 되는가\"를 판단하는 절차. 0702 급락 → 0703 매수 사이드카 급등 → 0706 힘 꺾임의 3일 흐름에서 도출.\n\n## 장전. 어제의 하락을 분류하고 시작한다\n1. **하락 원인 분류** — 레버리지 ETF·신용의 기계적 청산인가, 사람이 판단해서 판 매도인가. 기계적 청산이면 물량 소화 후 빠른 복귀 가능, 판단 매도면 시장이 소화할 시간 필요 [A-클로징-판단-04].\n2. **악재의 실체 검증** — 루머의 사실 여부, 대체재의 실제 캐파 비중, 수요를 줄이는 방향인지 늘리는 방향인지를 항목별로 확인. 실체가 없으면 급락은 되돌림 대상 [A-클로징-판단-05].\n3. **수급 방향 확인** — 외국인이 현물을 던져도 **선물 순매수·콜 매수+풋 매도 전환**이면 공포 종료 신호로 읽는다 [A-클로징-판단-07].\n4. 오늘 예정된 실적 발표·상장(ADR/공모) 이벤트를 체크하고, 해당 종목은 **\"선반영\" 전제**로 기대치를 낮춘다 [A-클로징-리스크-01].\n\n## 장중. 자리와 쏠림을 같이 본다\n- 주도주가 **60일선 등 장기 이평선을 이탈**하면 그 자체를 매도 신호로 쓰지 말고, 원인이 기계적 청산인지 확인 후 저가매수 유입 지점으로 볼지 판단 [D-클로징-진입-02].\n- **지수는 급등하는데 코스닥·소부장이 못 오르면** 가격 메리트를 진입 근거로 쓰지 않는다. 자금이 대형주 레버리지로만 쏠린 구조이므로 매물 부담만 쌓인다 [A-클로징-판단-06].\n- 이격도가 빠르게 좁혀진 자리는 상승 추세 내 지지로 보되, **20일선 저항 돌파 실패**는 이벤트 선반영 물량일 수 있어 추세 전환으로 단정하지 않는다 [D-클로징-판단-01].\n\n## 마감 후. 급반등 시나리오를 미리 세워둔다\n- 지수·섹터가 **역사적 낙폭 임계점 + 신용 반대매매 소화 + 기계적 프로그램 매도 구조**를 동시에 만족하면, 수급 공백 해소 시 급반등 자리로 보고 관종·현금을 준비 [A-클로징-진입-01].\n- 전제 조건(상위 지수가 크게 안 빠지고 옆으로 눌리는 조정)이 깨지면 시나리오를 폐기한다.\n\n\n# 〔2026-07-05~20 보강〕 주간 단위 운영 루틴 [주간 0705·0712·0720]\n\n> 월요일 장전에 한 주의 매매 범위·일정·시나리오를 먼저 확정하고 들어가는 절차.\n\n## 주말/월요일 장전. 이번 주 매매 범위를 먼저 정한다\n1. **유니버스 확정** — 거래대금 쏠림 여부를 보고 이번 주 매매 대상을 좁힌다. 쏠림이 심하면 쏠림의 중심(주도 대형주) 안에서만 [C-주간-선정-01].\n2. **포지션별 분리** — 단타용 종목군과 스윙용 종목군을 따로 적는다. 두 결론이 달라도 정상 [C-주간-선정-02].\n3. **일정 캘린더** — 실적 발표, CPI/PPI, 금통위, 해외 빅테크 CAPEX 발표를 적고, **열릴 때마다 시장이 빠졌던 정례 이벤트**는 별도 표시해 그날 비중을 줄인다 [F-주간-리스크-02].\n4. **기준선 기록** — 지수·주도주의 120일선 값과 **서킷브레이커 발동 가격대**를 적어둔다 [F-주간-판단-02].\n5. **유동성 방향 규정** — 예탁금·거래대금·주담대 증감으로 \"돈이 늘고 있나 줄고 있나\"를 먼저 정한다 [A-주간-판단-03].\n\n## 개장 직후. 수급으로 그날의 모드를 결정한다\n- 9시 개장 시 **외인·기관 중 누가 매수하는지** 확인. 외인 매도 + 기관 매수면 대응 가능, 어중간한데 대량 프로그램 매도면 바로 빠지고 10시 이후 수급 전환을 기다린다 [A-주간-판단-01].\n- 갭하락이 예상되던 날은 **\"밀리면 감사합니다\"** — 계획대로 밀리면 낙주 분할, 안 밀리면 진입하지 않는다 [F-주간-진입-02].\n- 첫 하락은 건너뛰고 **두 번째 하락부터 1차 진입**, 3~4번까지 열어둔다 [F-주간-진입-01].\n- 해외 상장분(ADR 등) 괴리가 있으면 프리장 갭 → 본장 프로그램 반영 순으로 확인 후 대응 [A-주간-판단-02].\n\n## 장중. 하지 않을 이유를 먼저 확인한다\n- 지수가 상승 추세에 진입하지 않았으면 세게 매매하지 않고 당일 이슈만 가볍게 [F-주간-리스크-01].\n- 방향이 안 잡히고 포트가 가벼우면 **매매를 참는 것**이 정답(물려서 버티는 것과 구분) [F-주간-리스크-01].\n- \"이 정도 빠졌으면 됐지\"라는 생각이 들면 체감으로 폭을 재고 있다는 신호 — 수급과 자리로 다시 판단 [G-주간-판단-02].\n\n## 주말. 대응할 수 없는 시간의 사용법\n- 금요일 저녁·주말에 하락 걱정으로 스트레스받지 않는다. 그 시간에는 **공부**를 한다 [G-주간-멘탈-02].\n- 부정론과 조롱이 극에 달한 시장이 있으면 스윙 관점 스크리닝 대상으로 올려둔다(진입은 악재 소진·기관 유입 확인 후) [G-주간-멘탈-01].\n- 이번 주 손실이 있었다면 감정이 아니라 **다음 주 매매 범위를 좁히는 규칙**으로 바꿔 적는다 [G-주간-멘탈-03].\n\n\n# 〔2026-08-21 보강〕 재료 노출 판별 + 관종·알림 운영 [IMI 0821]\n\n## 장전. 오늘의 재료가 \"노출된 재료\"인지 먼저 가른다\n1. 오늘 예정된 발표·이벤트가 **이미 기사로 돌고 있는가**를 확인한다. 돌고 있다면 노출된 재료 → **시장 예상을 압도적으로 넘지 않으면 발표 후 급락**으로 전제하고 진입 계획을 짧게 잡는다 [A-IMI-판단-05].\n2. 전날 미국 선행 종목이 급등 후 급락했다면 **오른 폭 대비 되돌린 폭**을 계산한다. 절반 넘게 반납 = 매도세, 조정 폭이 작다 = 눌림 [D-IMI-판단-02].\n3. 금리가 올랐으면 **제약·바이오는 약세**로 연결해 둔다(차입 운용 구조) [A-IMI-판단-06].\n4. 금요일이면 주말 불확실성을 감안해 **비중을 미리 줄인다** [F-IMI-리스크-15].\n\n## 장중. 관종 3페이지와 시세 알림으로 돌린다\n- 관종은 **1p 고정값 / 2p 시장정리 종목(0~5일차) / 3p 섹터별**로 두고 상승률·하락률 상위와 함께 등락률 순으로 계속 돌려본다 [B-IMI-세팅-12].\n- 지금 자리가 아닌 종목은 **어차피 지나갈 자리**(상승은 전일 고점·분봉 저항대, 하락은 지지 예상가)에 시세 알림을 걸고 일하러 간다. 알림이 와도 바로 사지 말고 돈이 들어오는지 확인 [B-IMI-세팅-13].\n- 수급은 **선그래프 모양**으로 읽는다(우상향=매수 지속, 우하향 중 횡보=반등 가능) [B-IMI-판단-01].\n- **지수가 플러스라고 다 좋은 게 아니다**: 하락 종목이 상승 종목의 3배면 대형주 쏠림 → 그 종목군 밖에서는 당일 단타로 수익 내기 어렵다. 매일 \"오늘 시장의 색깔\"과 돈의 흐름을 해석한다 [A-IMI-판단-07].\n- 진입 전 **분봉을 전날부터 이어 붙여 상승 시작점**을 확인한다. 1파 첫 조정이면 가능, 2파 이후면 하지 않는다 [D-IMI-진입-27].\n- 대상은 **대장주 + 충분한 시총**. 시총 1000억 미만, 분봉 거래대금 4~5억 종목은 제외 [C-IMI-선정-22·23].\n\n## 보유 중. 지지대 하나로 판단한다\n- 다음 날 갭하락으로 시작하면 **시가가 핵심 지지대 위인지 아래인지**만 본다. 위면 지켜보고(말아 올리면 추가 진입), 아래면 던진다 [D-IMI-손절-01].\n- 진입할 때 **\"여기서 끝낼 매매인가, 모아갈 매매인가\"**를 정해 비중을 맞춘다. 크게 실었으면 손절도 칼같이 [F-IMI-리스크-16].\n- 저점 대비 30% 가까이 오른 구간에서는 **\"조정 나올 때 됐는데\"라는 의심을 유지하며** 비중을 줄인다 [A-IMI-판단-08].\n\n## 마감 후. 반성과 확장\n- 수익금 크기나 \"금요일이니 빨리 끝내자\"는 심리가 판단을 대신하지 않았는지 점검하고, **어떤 자리가 좋았을까를 복기**한다 [G-IMI-멘탈-26].\n- 시장정리 시간이 줄어든 만큼 차트 공부·리포트로 **범위를 확장**한다. 공부 시간이 부족하면 시간을 늘리지 말고 **기간을 늘린다** [G-IMI-멘탈-23].\n\n---\n\n# 〔2026-08-28·31 보강〕 — 유동성 진단·이벤트 대응·리포트 노트 [IMI 0828·0831]\n\n## 0단계 보강. 유동성부터 진단한다\n- 거래대금이 7조 미만이면 **지지가 잘 안 나오고 수익까지 오래 걸리는 장**으로 규정 → 분할 폭 확대 / 더 아래 지지 상정 / 비중 축소 [A-IMI-판단-09].\n- 시장 정리 종목 수가 급감(하루 1개 등)하면 유동성이 마른 직접 증거.\n- 이번 달 시장의 색깔을 한 줄로 정의한다(예: \"삼전닉스에서 돈이 빠지며 업종 간 순환매\"). **패턴은 영구적이지 않다** [A-IMI-판단-12].\n\n## 1단계 보강. 일정과 이벤트를 먼저 확인\n- 달력(시그널 리포트 등)에서 잭슨홀·실적·연설 일정을 확인하고, **항목을 클릭해 관련 기사까지 읽는다** [F-IMI-리스크-20].\n- 이벤트 2일 전부터 포털 검색으로 요인값을 최신화해 **방향에 대한 나만의 기준**을 세운다(연준 내부 기류, 전 총재 발언 등).\n- 방향이 잡히면 → ①이벤트 전 현금 확대 ②오버나잇 금액 축소 ③**피해 업종 특정 후 회피**(금리 인상 → 제약·바이오, 성장주 많은 코스닥) [A-IMI-판단-10].\n- 나아가 그 업종이 몰린 시장의 **인버스 ETF**까지 후보로 검토 [E7-IMI-진입-01].\n\n## 1단계 보강. 다음 자금 행선지 예측\n- 새 섹터를 찾지 말고 **기존에 돈이 크게 들어갔고 중기 시황이 살아 있는 섹터**를 우선 본다. 전날 약세였던 주도 섹터를 돌려보며 대장주로 자금이 흘러가는지 체크 [A-IMI-판단-11].\n- 대장이 없는 섹터라면 **실적·투자포인트가 좋은 종목**을 미리 정해 관종 상단에 올려둔다 [C-IMI-선정-25].\n- 호재 주체가 비상장이면 **지분 구조**를 확인해 실제 움직일 상장사를 특정 [C-IMI-선정-26].\n\n## 2단계 보강. 조정 섹터 진입 판단\n- 선택지는 둘뿐: **①음봉 때 모아간다**(당일 수익 기대 X) **②하루 더 기다렸다 반등 시 진입**. \"음봉이니까 산다\"가 아니라 섹터 시황 검색 + 지수 위치 + 대외 악재를 체크한 뒤 결정 [D-IMI-진입-30].\n- 추세 판정: 직전 저점 미이탈 + 고점 상승 = 상승 추세 유지. 분봉에서 시가 회복 실패 + 직전 저점 이탈 = 하락 추세 시작 [D-IMI-진입-28].\n- 지지 후보가 여럿이면 **가장 가까운 자리**가 확률이 높다 [D-IMI-진입-29].\n- 음봉 거래량이 커도, 돈 들어온 캔들의 1/3도 안 빠지고 중요 지지를 지키면 재반등 확률이 높다. **차트는 거들 뿐, 판단 비중은 시황·재료** [D-IMI-진입-31].\n- 가벼운 섹터(보안·탈모 등)는 당일 추격 금지, 넓은 밴드 분할 + 저항대 미리 매도 예약 [C-IMI-선정-24].\n- 삼성전기가 삼전닉스와 따로 가면 MLCC 재료를 확인 [E6-IMI-진입-09]. 자사주 매입 기간이면 기타법인 연속 순매수를 근거로 갭하락 매수 [E6-IMI-진입-10].\n\n## 2단계 보강. 매수 전 예수금 시뮬레이션\n- 보유분 매도 시 생길 현금 + 남은 현금으로 목표 종목을 분할 매수했을 때 **원칙 현금 비중(20~30%)이 유지되는지** 계산한 뒤 실행 [F-IMI-리스크-18].\n- 종목당 최대 금액을 다 썼다면 그 자체가 **손절 준비 신호** [F-IMI-리스크-19].\n\n## 4단계 보강. 리포트 노트와 마인드\n- 매일 노트 5항목: ①당일 영향 요인 ②현재 시장의 특징 ③매크로·개별 이슈 ④일정 ⑤**그래서 나는 무엇을 할 것인가**. 장중에 계속 다시 읽고 실행 여부를 체크 [G-IMI-멘탈-30].\n- 인물 리스크가 있는 재료(전쟁·재건·대북)는 오버나잇 금지 [F-IMI-리스크-21].\n- 명절 연휴 전에는 현금 비중을 올린다 [A-IMI-진입-08].\n- 상승장의 \"버티면 된다\" 학습을 경계하고, 상승장/하락장 구분 없이 항상 비중·계좌·현금을 관리한다. 수익금은 출금해 원금으로만 매매 [G-IMI-멘탈-28].\n- 공부 시간은 가용 시간을 계산해 분 단위로 쪼개 매일 [G-IMI-멘탈-27]. 비교 대상은 어제의 나 [G-IMI-멘탈-29].\n\n## 최종 원칙 — 매매 결정을 차트만 보고 내리지 않는다 [IMI 0831]\n1. 세계 시황·지수 흐름·주요 경제지표(큰 그림)를 먼저 체크하고 메모·업데이트\n2. 자금이 몰린 섹터·종목의 **개별 요인값**을 체크해 최신 상태로 유지\n3. 그 상태에서 차트상 살 만한 자리에 진입 → 느린 단타든 빠른 단타든 확률이 높아진다\n\n\n# 〔IMI강의 2·3·5·6강 보강〕 하루 전체 루틴의 표준형 [IMI강의]\n\n> 8강 구조화 강의에서 정리된 **표준 루틴**. 앞의 날짜별 시황 보강들이 \"그날의 대응\"이라면, 이건 매일 반복하는 뼈대다.\n\n## 1단계. 아침 (장 시작 전)\n1. 전일 시장정리 요약 → 유목민 멘트 → 투데이픽 → 오전 강의 [IMI강의 3강].\n2. 장전 기사 체크에서 **시리 섹터의 우선순위를 지정**한다 [B-IMI강의-세팅-01].\n3. 오늘 매매할 종목은 **어제 준비한 것 안에서만** 고른다. 장중 유혹이 와도 예외 없음 [G-IMI강의-멘탈-01].\n4. 오늘이 상승장인지 하락장인지에 따라 **판단 가중치를 바꾼다** — 상승장 차트 60~70%, 하락장 차트 30~40% + 재료 60~70% [F-IMI강의-리스크-04].\n5. 진입 전 **5가지(총 투자금·종목 수·종목당 비중·분할 회차·손절가)를 확정**한다 [F-IMI강의-리스크-01].\n\n## 2단계. 장중 (모니터링과 진입)\n- 화면 5개를 순환한다: 억봉·시리종목(등락률 순, 분봉 우상향은 눌림목 공략 / **음봉 하락 중은 천천히 관찰**) → 시세 알림 → `0198` → `0181` → `0186` [B-IMI강의-세팅-03].\n- ③~⑤에서 움직임을 발견하면 **개별 호재인지 섹터 반등인지** 구분하고 뉴스·공시·동일 섹터 종목까지 본다 [B-IMI강의-세팅-03].\n- 진입 판단 순서:\n  1. **분봉이 3국면 중 어디인가** — 상승파동/횡보/하락파동 [D-IMI강의-진입-03].\n  2. **몇 파인가** — 1파 후 조정만 진입, 2파는 재료가 아주 좋을 때만, **3파 조정은 하지 않는다** [D-IMI강의-진입-02].\n  3. **지지·저항의 강도 채점** — 횡보 시간 / 거래대금 / 최근성 / 추세 전환 자리 [D-IMI강의-진입-01].\n  4. **지수 상황 반영** — 약세장이면 지지를 한 번 더 깰 수 있다는 전제로 1차 비중 축소 [D-IMI강의-판단-01].\n- 돌파를 노린다면 **3개 진입 시점 중 하나를 정하고 그에 맞춰 비중·손절을 조정**한다 [E4-IMI강의-진입-01].\n- 시세 알림은 **직전 고점**(오면 조정을 기다려 공략)과 **손절 라인**(오면 손절 여부 결정) 두 종류로 건다 [IMI강의 5강].\n\n## 3단계. 청산\n- 상승 1파 눌림에서 샀다면 **2파 = 1파 상승폭**으로 목표가를 잡아 **미리 매도 주문**을 걸어둔다 [D-IMI강의-청산-01].\n- 조정 깊이로 목표를 조정한다: **40% 미만 조정이면 1파 고점 돌파 기대, 60% 이하로 깊으면 1파 고점 부근 익절** [D-IMI강의-판단-02].\n- 길게 가져가려면 **50% 익절 후 나머지는 매입단가 조금 위에 전량 매도**를 걸어 최악에도 본전 [D-IMI강의-청산-01].\n- 파동 이탈 신호는 **직전 저점 이탈**. 단타는 1·3분봉의 5·10분선 이탈, 스윙은 일봉 5일선 [D-IMI강의-손절-01].\n- 하루 손실이 **일평균 수익의 2일치**에 도달하면 그날은 멈춘다 [F-IMI강의-리스크-03].\n\n## 4단계. 장 종료 후\n- **28%종목·억봉종목 업데이트** → 어느 섹터가 많은지로 **당일 주도 섹터 선정** → 이브닝과 매치. 장이 안 좋으면 기준을 150억까지 낮춘다 [B-IMI강의-세팅-02].\n- 관종 생존 점검: **15일선 유지 + 직전 저점 미이탈** 중 하나라도 깨지면 컷(재료가 강하면 관찰로) [C-IMI강의-선정-05].\n\n## 5단계. 퇴근 후 (다음 날 준비)\n- **섹터로드맵 업데이트** — 기사 우선순위·지속가능성·직접 요약·섹터 키워드 추가 [B-IMI강의-세팅-01].\n- **억봉종목 최신화** → 차트를 돌려 **매매할 만한 자리에 온 종목만 `당일 놀이터`로** [B-IMI강의-세팅-01].\n- 당일 놀이터 종목은 **기업 실사 4종**(홈페이지·재무·공시·최신뉴스)을 통과시킨다 [C-IMI강의-선정-04].\n- 재료는 **신선함·연관성·지속성·확장성**으로 채점해 서열을 매긴다 [C-IMI강의-선정-02].\n- **기록은 선택적으로** — 시간이 부족하면 포기할 페이지를 정한다(섹터1은 기록 포기 권장) [G-IMI강의-세팅-01].\n\n\n# 〔IMI강의 1~8강 PDF 보강〕 강의 원본이 추가한 것 [IMI강의]\n\n> 앞의 \"하루 전체 루틴의 표준형\"이 docx 요약 기준이라면, 여기는 **PDF 원본 8강에서만 나온 판단 기준**을 모은 것이다.\n\n## 진입 전 — 3단 게이트\n1. **거차재시 게이트** — 거래대금·차트·재료·시황 중 **하나라도 무너지면 진입하지 않는다.** 특히 **재료 소멸**은 차트가 아무리 좋아도 즉시 관종 제외 사유 [C-IMI강의-선정-11].\n2. **파동 게이트** — 지금이 **상승 3파 구간이면 매수 금지.** 1파 후 첫 조정이 최우선, 2파는 재료가 아주 좋을 때만 [D-IMI강의-진입-07].\n3. **콜라보 게이트** — 지지·저항 / 캔들·거래대금 / 이평선 / 추세선·파동·피보나치 중 **2개 이상이 같은 가격대에서 겹치는가**. 겹칠수록 확률이 올라간다 [D-IMI강의-진입-09].\n\n## 매수 버튼 직전 — 3초 규칙\n- **\"지금 이 자리는 지지구간인가요, 아니면 저항구간인가요?\"** 를 자문한다 [D-IMI강의-멘탈-01].\n- 동시에 **\"왜 이 가격에 사고, 하락하면 어디서 손절할 것인가\"**를 한 문장으로 말할 수 있어야 한다 [G-IMI강의-멘탈-02].\n- 지금 이 충동이 **실시간 뉴스 / 분봉 슈팅 / 특징주 기사 / 조회 순위 / 유튜브 추천** 중 무엇에서 왔는지 점검 [G-IMI강의-멘탈-09].\n\n## 비중 — 계좌 상태에 따라 규칙이 다르다\n| 계좌 상태 | 규칙 |\n|---|---|\n| **월별 손해 > 수익** | 종목당 최대 **예수금의 20% 이내** / 종목당 일별 최대 **그 20%의 30% 내외** / **현금 최소 40% 유지** [F-IMI강의-리스크-06] |\n| **3개월 이상 수익 > 손해** | ①기존 비중 유지하며 누적 or ②거차재시 좋은 종목에 비중 베팅. 강사 방식은 **수익금 일부만 남기고 출금 → 남긴 금액이 손절금이 되게 매수액 역산** [F-IMI강의-리스크-07] |\n| **공통** | 비중을 키워도 되는 조건 = **대응 가능한 환경 + 감당 가능한 금액 + 무리 없는 심리 상태** [G-IMI강의-멘탈-10] |\n\n- **손절보다 계좌관리가 먼저다.** 비중이 잘못되면 손절 기준 자체가 무의미해진다 [F-IMI강의-리스크-08].\n- 단타로 비중을 지켰다면 **지지 구간을 칼같이**, 스윙이면 **안전한 비중으로 분할하며 2차 상승을 기다린다** [F-IMI강의-리스크-08].\n\n## 청산 — 국면별 기준\n- **상승 파동 매수 시**: 1파 상승폭만큼 도달하면 1차 익절. 길게 가려면 **반만 익절, 반은 홀딩**. 되돌아오면 **매입 단가 조금 위에서 전량 매도** [D-IMI강의-청산-01].\n- **분봉 이평선 기준**: 5일선 이탈 50% / 10일선 이탈 전량. **지수 약세면 5일선 이탈 시 전량** [D-IMI강의-청산-02].\n- **파동 이탈**: 직전 저점을 깨면 추세 전환 신호로 보고 매도 [D-IMI강의-손절-01].\n- **하루 최대 손실**(일평균 수익의 2일치)에 닿으면 그날 종료 [F-IMI강의-리스크-03].\n\n## 시간이 없는 날의 압축 운용\n- 전날 준비한 **거차재가 완성된 종목** 안에서만 본다.\n- **매매 횟수를 줄이고 시세 알림을 적극 활용**한다 — 상승 노림은 전일 고점·분봉 저항대에, 하락 중이면 1·2차 지지 구간에 알림 [D-IMI강의-진입-10].\n- **살(팔)만한 자리에서만 집중적으로** 매매한다 [IMI강의 5강].\n\n## 공부 — 무엇을 하느냐\n- 쉬운 것(거래대금·상한가 조회, 차트 학습)에 시간을 다 쓰지 말 것. **어려운 것은 재료 강도 판단과 시황을 매매로 연결하는 과정**이다 [IMI강의 2강].\n- **상한가·500억봉 종목 차트를 매일 보고 직접 선을 긋는다** — 차트 실력을 가장 빠르게 올리는 방법 [IMI강의 5강].\n- **키워드만 보고 종목을 떠올리는 복습**으로 직관적 연결 능력을 만든다 [G-IMI강의-멘탈-07].\n- 지표는 정답이 아니라 **직관을 키우기 위한 훈련 도구**다 [IMI강의 5강].\n\n\n---\n\n# 〔월독프 보강〕 익절·손절을 문장으로 고정한다 [월독프 1·5·8주차]\n\n> 월독프가 다른 출처와 다른 점은 **판단을 원칙 문장으로 박제해두고 그대로 실행**한다는 것이다. 아래 두 세트는 매매 중에 다시 생각하지 않기 위한 것이다.\n\n## 0단계 보강. 내 조건을 숫자로 고정한다 (최초 1회, 분기마다 갱신)\n- **확보 가능한 시간대**(예: ~10시), **도구**(예: MTS만), **하루 최대 시간**(예: 3시간), **공부 시간대**(예: 기상~6:15 / 17:00~18:30)를 적는다.\n- **\"어떤 매매를 했을 때 가장 심리적으로 안정되었고, 수익이 잘 났는가?\"**에 답하고, 그 매매만 남긴다.\n- 직장인 스윙이라면 **전일 저녁 연합뉴스를 확인해 시리 전에 미리 정리**해둔다.\n\n## 3단계 보강. 수익실현 5원칙 [월독프 5주차]\n> 전제: **욕심이 난다면 고점이다. 자신의 감정이 가장 유용한 경고 신호.**\n1. **시황 + 재료의 힘 + 거래대금**으로 추가 상승 가능성을 파악한 후 대응한다.\n2. 고점에서 **큰 거래량을 동반해 저항을 뚫으려다 실패하고 하락하면 분할 매도**한다.\n3. 급등 시 **1분봉 5/10분선 이탈, 3분봉 5/20분선 이탈에 매도**한다.\n4. **가야 할 자리에서 못 가면 전량 수익 실현 후 지켜본다.**\n5. **수익금에 욕심이 생기면 절반을 실현한다.**\n\n## 3단계 보강. 손절 5원칙 [월독프 5주차]\n1. **손절은 기회다** — 지금 손절해야 다음 기회를 잡는다.\n2. **아니다 싶은 것은 아니다.** 희망을 갖지 마라.\n3. **잘못됐다 싶으면 잘못된 것이다.**\n4. **손절해야겠다는 생각이 드는 그때가 최고가 손절이다.**\n5. **아쉬워서 버티면 큰 고통이 따른다.**\n\n## 4단계 보강. 복기 6항목 [월독프 1·8주차]\n①시장(주도 테마·순환매와 그때의 분봉) → ②재료 및 시나리오 → ③종목의 끼 → ④일봉·분봉 자리 → ⑤내가 접근했다면 어떻게 했어야 했나 → ⑥한줄평 / 더 좋은 매매는.\n**일봉·분봉을 당겨보면서, 거래량을 보면서, 나의 심리를 함께 고려**해 한다.\n\n## 4단계 보강. 시그널 이브닝 7단계 [월독프 8주차]\n상승 종목 특징·트렌드 → 상승이 잘 나오는 일봉 자리 → 일봉·분봉 패턴 → **재료 강도와 끼(하루짜리냐 일주일짜리냐)** → 재료·종목 디테일 → **내가 매매했다면 어떻게 타점을 잡았을지** → **관련주를 어떻게 찾았어야 했는지 역추적**.\n\n\n---\n\n# 〔월독프 PDF 보강〕 전업·직장인 하루 시간표 전체 [월독프 8·9주차]\n\n> 지금까지의 루틴이 \"무엇을 보는가\"였다면, 여기는 **몇 시에 무엇을 하는가**를 시간 단위로 박아둔 실물 시간표다. 두 가지 버전(멘토 전업형 / 직장인 압축형)을 함께 둔다.\n\n## A. 멘토 전업형 — 장 마감부터 다음날 개장까지 [월독프 8주차]\n\n| 시간 | 할 일 |\n|---|---|\n| **15:30~17:00** | **Signal Evening 작성(최우선)** — 당일 주도주 / 당일 특징주 / 당일 특이종목 / 일정주 4가지 기준으로 정리 |\n| 17:00 | 퇴근 |\n| 17:30~18:30 | 저녁식사 및 휴식 |\n| **18:30~19:30** | **매매·시장 복기, 강세 종목 정리** — 자동일지차트[0606]로 내 타점 확인, 주식시세복기[0609]로 호가 흐름 재생 |\n| **19:30~20:00** | **150/500억봉 종목 차트 확인, 차트 관심주 선정** — 주도주 중 조정 후 다음 거래일 반등 가능성이 높은 종목만 압축 |\n| **20:00~20:20** | **시간외 특징주 정리** — 전일 시간외 강세는 다음날에도 강할 가능성이 있어 기사까지 확인 |\n| **20:20~22:00** | **뉴스 Check** — 고정 17개 매체(네이버·디일렉·의협신문·연합뉴스·연합인포맥스·매일경제·국민일보·뉴시스·머니투데이·디지털데일리·지디넷·테크M·한국경제·로이터·블룸버그·애플인사이더·엔비디아) |\n| 22:00~22:30 | 개인 정비 |\n| **22:30~01:00** | **뉴스 정리 및 공부** — 그날 뉴스를 **관련주와 묶어서** 기록(예: \"갤럭시 S24 출시 → 이오테크닉스·파크시스템스…\"). 매일 재료 후보 DB를 쌓는 작업 |\n| 05:30~06:00 | 기상 및 출근 |\n| **06:40~07:20** | **미국·유럽 증시 및 장전 뉴스 Check** (Investing.com으로 미국 관심종목 확인) |\n| 07:30~07:45 | 트레이딩뷰 등 차트 툴 점검 |\n| **07:45~08:30** | **증권사 리포트 및 장전 뉴스 Check** (리포트 서머리로 당일 발간분 스캔) |\n| **08:40~08:45** | **명상·마인드셋** — 매수 전 4자문(왜 선택했나/어떻게 매매하나/언제 관심 가졌나/변화를 감지했나) 되새김 |\n| **08:55** | **장 전 예상 체결 Check** (예상체결등락률상위[0183]) |\n| 09:00 | 한국 증시 개장 |\n\n## B. 직장인 압축형 — 낮에 차트 공부 시간을 확보하는 형태 [월독프 9주차]\n\n| 시간 | 할 일 |\n|---|---|\n| 01:00 | 수면 |\n| 05:00 | 기상 |\n| 06:00 | 출근 |\n| 06:00~07:50 | 리포트·시황 공부 |\n| 07:50~09:00 | 뉴스 탐색, 리포트 공부 및 정리 |\n| **09:00~09:30** | **트레이딩, 스윙 정리** (장 초반 30분에 집중) |\n| **12:00~14:00** | **전 종목을 관심 섹터별로 '차트' 위주 공부** — [상승봉 0/1/2일차] [5~8일선] [15일선] [33~45일선] [120일선] [바닥] [급락] [단기과열 예고] [단기과열] [투자경고] [투자위험] 태그로 분류 |\n| **17:00~18:00** | **시그널이브닝 & 하루 정리** |\n| 22:00~01:00 | 뉴스 검색 & 개인 공부 |\n\n- **\"루틴의 장점은 고민이 필요 없다는 것\"** — 매일 쌓이는 루틴이 결국 나를 변화시킨다.\n- 하루의 흐름은 결국 하나다: **재료를 찾고 → 이 재료와 일정이 얼마나 갈지 판단하고 → 종목을 선택해 얼마나·언제부터·얼마큼 살지 정하고 → 거차재시로 확인해 진행 → 일정이 다가오거나 재료가 나오면 수익 실현 → 그 와중에 다음 재료·일정·종목을 준비.**\n\n---\n\n# 〔월독프 PDF 보강〕 이평선 국면 판정표 [월독프 5주차]\n\n| 이평선 | 상승추세에서 | 하락추세에서 |\n|---|---|---|\n| **3일선** | 정말 강한 급등주는 5일선이 아니라 3일선 조정으로 끝난다 | — |\n| **5일선** | 모든 시세의 시작. 5일선을 얼마 안 가 깨면 갈 종목이 아니었다 | **역전의 발판** — 5일선 위로 올라섰다 = 5일간 물린 물량 소화 |\n| **8일선** | 5일선 지지 실패로 손절한 단기 매물을 받아주는 자리 | — |\n| **15일선** | 20일선 조정을 기다리는 매수세가 있어 강한 종목은 여기서 반등 | — |\n| **20일선** | **단기매매 생명선.** 반등 실패 시 단기 물량 투매로 급락 | **작은 관문이지만 못 뚫으면 나락** |\n| **33·45일선** | 60일선 반등을 기다리는 쪽이 미리 반등 주는 자리 | — |\n| **60일선** | **최후 보루.** 여기서도 반등 없으면 주도주 수명 종료 | **가장 강력한 첫 관문** (깰 때 대규모 거래량 동반) |\n| **120일선** | 6개월 물량 대기, 매도벽이 듬성듬성해 돌파 자체는 어렵지 않음. 과거 반등 이력 있으면 확률↑ | **까다롭지만 엉성한 관문** — 60일선 지지부터 확인 |\n| **100·224일선** | **100일선 위 + 224일선 아래 = 중기 상향·장기 하향.** 224일선 돌파 시 전 구간 정배열 전환(150억~500억봉 동반) | 224일선 돌파 실패 시 횡보성 우하향으로 물량 소화 |\n\n> **정배열 판정의 핵심**: 정배열이면 조정마다 저가 매수세가 붙는 것이 정상이다. **예상되는 저가 매수세가 안 나오면 그 자체가 리스크 신호** — 나보다 빠른 참여자가 먼저 감지한 것으로 본다.\n\n\n---\n\n# 〔소와곰 보강〕 120분선 하나로 하루를 운용하는 법 [소와곰 2023~2024]\n\n> 소와곰 시리즈는 **분봉 120분 이동평균선(120분선)** 하나를 진입·보유·손절의 공통 기준선으로 쓴다. 기존 루틴에 이 선을 얹는 방식으로 정리한다.\n\n## 진입 — 120분선이 만들어주는 세 가지 자리\n| 상황 | 진입 방식 | 컷 |\n|---|---|---|\n| **추세 유지 확인** | 급등 중인 종목이 **120분선을 안 깨고 지지**하는 것을 확인하고 진입 | 120분선 이탈 |\n| **돌파 전환** | **120분선이 하향 → 가격 횡보 → 120분선 돌파**(선행 조건: 전전일 억봉 + 전일 긴 음봉 + 재료·시황 생존) | 120분선 재이탈 |\n| **단일가·VI 해제일** | **시가와 120분선만 보고** 매매. 상한가 종목이 갭 없이 횡보하면 1분봉 120분선 타점 | 시가 또는 120분선 |\n\n- **급등 후 조정에서 120분선과 만날 때마다 분할 매수**하고 **갭 구간 상단에서 매도**하는 운용도 가능하다.\n- **디마크는 상단을 기준으로 함께 본다.** **디마크 지지도 못 하고 120분선까지 깨지면 투매**가 나올 수 있으니 즉시 정리.\n\n## 보유 중 — 매도 판단의 우선순위\n1. **거래량 우선**: 저항선에서 거래량이 터지는데 못 가면 축소. 고점에서 거래량이 줄며 질질 빠지면 축소.\n2. **급락이 나오면 본절.**\n3. **급등 국면**: 1분봉 5분선 이탈 1차 → 10분선 이탈 2차 → 20분선 이탈 전량.\n4. **추세가 깨지면 매도**(재료가 애매하면 더 빨리).\n\n## 급락 종목을 볼 때 — 3단 구간과 1회 제한\n- 반등 후보 구간은 **-15% / -30% / -50%**(끼 있는 종목 한정). 3연상 종목은 **-15% / 전일 종가 / -30%**.\n- **첫 하락 구간에서만 매매**한다. 그 이후는 **3번째 하락**까지 기다린다.\n- 진입 판정은 **\"하락의 첫 파동 고점을 뚫는가\"** — 급락 구간은 매물이 비어 쉽게 오른다.\n\n## 하루 순서 요약 (소와곰 버전)\n**전날 밤**: 상천·억봉 정리(이유+거래대금) → 차트 분석(일봉·분봉·호가·**거래량**) → 내일 반응할 기사 찾기(\"있다가 없어진 것 / 없다가 생긴 것\") → 대장·2~3등주 차트 확인 → **관종 10종목 이하로 압축 + 종목별 시나리오 작성**\n**장 전**: 0700 기사(03:00~08:20) → 0183 예상체결(08:40~08:57)\n**장 초**: 0148 순간체결량으로 돈의 흐름 확인 → 선정 섹터가 가는지 확인 → **안 가면 판단 착오를 인정하고 순위분석으로 재탐색**\n**14:00~14:30**: 종배 후보·500억봉·거래량 터진 종목 재점검 → **막판에 올려주는 종목 = 기대감 생존**\n**금지**: 텔레그램 기사와 체결창만 따라가는 뇌동매매. 준비한 매매가 끝났고 장중 대응 실력이 부족하면 그날은 종료.\n\n\n---\n\n# 〔차읽남 강의자료 보강〕 장세 판정과 시간대 운용 [차읽남 24·25년 강의]\n\n## 0단계. 오늘의 장세를 4가지 중 하나로 규정한다\n| 장세 | 특징 | 대응 |\n|---|---|---|\n| **테마주 장세** | 거래량 폭발 · 2~3개월 시세 지속 · 뉴스/정책 촉매 · 눌림마다 매수세 · 파생테마 생성 | **관련주 상한가 유무로 강·약 판별.** 강하면 눌림 2·3파까지 노림 |\n| **대형주 장세** | 외인·기관 수급 중심 · 등락 완만 · 중소형주 소외 | 비중을 실을 수 있는 장. 중소형주는 접는다 |\n| **개별주 장세** | 지수는 횡보인데 개별 종목만 강세 · 수급 쏠림 · 재료성 이슈(M&A·기술수출) | 당일 테마가 없을 때 나타남. 이슈 종목 압축 |\n| **실적주 장세** | 1·4·7·10월 실적 시즌 전후 | **발표 전 차트가 고점이면 선반영(하락), 저점이면 상승 여력** |\n\n## 0단계. 지수는 공식으로 판정한다\n- **거래대금 10조 이상 + 지수 20일선 위 + 저점·고점 상승 = 상승장**\n- **거래대금 10조 이하 + 지수 20일선 아래 + 저점·고점 하락 = 하락장**\n- **-1~-2% 하락은 무시. -3% 이상일 때만** 내 종목과 지수 흐름의 일치 여부를 본다.\n- ⚠️ **상승장에서 몸에 밴 \"기다리면 반등한다\"를 하락장에 적용하면 손절 타이밍을 놓친다.**\n\n## 2단계. 시간대별 운용 원칙\n| 시각 | 행동 |\n|---|---|\n| **~11:00** | **관망.** 이 시점에 지수가 하락 중이면 손절 고려 |\n| **14:00** | 장이 좋을 때의 8일선 매매 매수 타이밍 |\n| **14:40** | 장이 안 좋을 때의 8일선 매매 매수 타이밍 (하락추세면 종가) |\n| **장 막판** | 종가배팅 후 2~3% 애매한 상승이면 — 비중 크면 절반 실현 / 확신 크면 오버나잇(전량 매도는 안 함) |\n\n- **단타는 동시 2~3종목**, **5거래일 이상 보유하지 않는다.**\n- 장이 안 좋으면 **종가배팅보다 시가배팅**이 나을 때가 있다.\n- **갭상승했는데 물량이 안 터지면 밀릴 확률이 크다.**\n- **외인 프로그램 매도 지속 → 회피 / 기타법인 매도 지속 → 판단 오류 인정하고 즉시 손절**(좋은 종목이면 종가 재진입).\n"}, {"label": "[거차재시] 거래대금", "file": "1_거차재시/거_거래대금.md", "md": "# 3차 거차재시 — 거: 거래대금·거래량·상한가\n\n> **문서 성격**: 거차재시 4축 중 **거래대금** 판단을 저자별로 흩어진 상태에서 주제별로 통합한 문서.\n> 공통되는 부분은 합치되 출처를 병기했고, 저자마다 결론이 갈리는 부분은 `⚠️ 관점 차이`로 나란히 적었다(00_운영규칙 §6).\n> **캔들 안에서의 거래량 해석**(거감음봉, 음봉의 질, 양봉 vs 음봉 거래량)은 `1_거차재시/차_차트.md` §4에서 다룬다. 여기서는 **종목을 걸러내고 서열을 매기는 기준으로서의 거래대금**을 다룬다.\n> **시장 전체 거래대금**(코스피 7조·10조 등 유동성 판정)은 `1_거차재시/시_시황.md` §2에서 다룬다.\n\n---\n\n## 0. 왜 거래대금부터 보는가\n\n- **거래량·거래대금이 많다 = 시장 참여자들이 그 종목을 주목하고 있다**는 의미다 [IMI강의 2강 p.14].\n- **상한가 종목 = 단기 매매 투자자들에게 가장 관심을 많이 받은 종목.** 그래서 매매를 조금이라도 해본 사람이 **장 마감 후 가장 먼저 확인하는 것이 '당일 상한가 종목'과 '거래대금 상위 종목'**이다.\n- **단기 매매의 종목 선정은 밸류에이션이 아니라 거차재시로 한다** — 강의에서 제시한 종목은 PER 1.43, PBR 0.18로 지표상 극단적 저평가인데도 **매수 대상이 아니었다** [IMI강의 2강 p.10~11].\n- **지지가 나오는 진짜 이유도 거래대금이다**: \"최근에 돈이 많이 들어온 종목은 많은 사람이 보고 있고, 그 사람들이 지지·저항 구간을 다 안다. **그 사람들이 보고 있기 때문에 지지가 나오는 것**\" [상천유니온 240514].\n- **거래대금·거래량이 크게 발생한 종목 위주로 매매해야 성공 확률이 높다** [IMI강의 4강 p.37~40].\n\n> **초보가 흔히 하는 실수** [IMI강의 2강 p.8]: **\"어제 봐놨던 건데 벌써 올랐잖아? 아깝다, 놓쳤네\"** 하고 더 이상 보지 않는 것. **단기 매매의 시작은 그때부터다.** 상한가를 갔거나 거래대금이 크게 발생한 종목은 **지속적으로 모니터링**해야 한다.\n\n---\n\n## 1. 기준봉의 정의 — 무엇을 \"돈이 들어온 봉\"으로 볼 것인가\n\n> ⚠️ **관점 차이 — 기준봉의 문턱이 저자마다 다르다**\n\n| 출처 | 명칭 | 기준 |\n|---|---|---|\n| **제시스페라** | **제시봉(JB)** | **대형주** 전일 대비 **+10% 이상 + 거래대금 500억 이상 + 양봉 마감** / **급등주** **+15% 이상 + 500억 이상 + 양봉 마감** [2강 §8] |\n| **제시스페라(분봉)** | **분봉 JB** | **1분봉 약 30억 / 3분봉 약 90억**(편의상 100억으로 세팅) + 양봉 + 최근 20개 분봉 중 최대 거래량 |\n| **IMI강의** | **억봉** | **500억 이상 & 상승률 15% 이상** → OK / **150억 이상 & 상승률 15% 이상** → OK. **장이 안 좋을 때는 150억까지 범위를 넓힌다** [2강 p.17, 3강] |\n| **차읽남** | **150억봉·500억봉** | 4조건을 **전부** 충족: ① 당일 거래대금 150억/500억 이상 ② **종가가 시가 대비 +9% 이상**(VI 1회 이상) ③ **전일 대비 오늘 고가 +15% 이상** ④ **오늘 고가가 저가 대비 +15% 이상** [25년 강의] |\n| **상천** | **상천 = 상한가 + 천만주** | 상한가 종목과 천만주 종목을 매일 정리(\"상천정리\")하는 것이 체계의 기반 |\n| **월독프** | **억봉** | **150억봉은 약하다**(에스티큐브). 억봉 이후는 **갭이 방향을 정한다** [6주차] |\n\n> **해석**: 문턱 자체(150억/500억)는 대체로 같고, **차읽남만 4조건을 요구해 가장 엄격**하다. 차읽남의 추가 3조건(시가 대비 +9%, 전일 대비 고가 +15%, 당일 고저 +15%)은 결국 **\"장중에 실제로 크게 움직였는가\"**를 확인하는 장치다 — 거래대금만 크고 등락이 밋밋한 봉을 걸러낸다.\n>\n> 실전 조합: **IMI강의·제시스페라 기준으로 후보를 뽑고, 차읽남 4조건으로 서열을 매기는 방식**이 자연스럽다. 상천은 여기에 **천만주(거래량 기준)**를 별도 축으로 추가한다.\n\n### 1.1 JB의 활용 [2강 §8]\n- **JB가 연속 발생하는 종목은 강한 종목**으로 판단하는 근거.\n- 종목 선정 시 **JB 발생 여부·빈도**를 주요 판단 기준으로 활용.\n- **고점에서 약세 패턴(파란색 JB) 발생 시 매도 시그널.**\n- **제시봉의 시가를 이탈하면 즉시 손절.** 이 아래 구간은 매매하지 않으며 관심종목에도 넣지 않는다 [C-손절-01].\n- **새 제시봉 갱신 시 기준 재정립** — 동일 종목에 새 상한가(JB)가 발생하면 **기존 기준은 폐기하고 새 제시봉을 기준으로 재설정** [C-손절-02].\n- 같은 취지 [차읽남]: **억봉의 시가를 깨면 좋지 않은 신호** — 대량거래봉이 발생한 그날의 **시가 자체가 지지선 역할**을 한다.\n\n### 1.2 기준값은 고정값이 아니다 [7강 §4.4]\n\n> **이 문서에서 가장 중요한 단서.** 500억/15%/10%는 절대 기준이 아니다.\n\n- **시장 상황에 따라 조정한다**: 코로나 장세처럼 관심종목이 과도하게 많아지면 **거래대금 기준을 1,000억까지 상향**, **장 침체 시 300억까지 하향**.\n- **상승률 기준(15%/10%)도 상한가 제한율이 바뀌면(예: 50%로 확대) 비례 조정**이 필요하다.\n- 같은 원칙 [C-멘탈-03, B-세팅-04]: 관심종목이 너무 많아지면 1,000억까지 올리고, **장이 침체되면 300억까지 내린다.**\n- **장이 안 좋으면 기준을 150억까지 낮춘다** [B-IMI강의-세팅-02].\n\n---\n\n## 2. 거래대금을 채점하는 법 — 절대값이 아니라 상대값\n\n> ⚠️ 이 절의 상세 근거와 사례는 `차_차트.md` §4.1에 있다. 여기서는 종목 선별 기준으로 요약한다.\n\n- **절대 수치보다 상대 비교** — 그 종목의 **평소 대비** 얼마나 발생했는가 [IMI강의 4강].\n- **\"500억봉이 터졌다고 무조건 좋은 게 아니라, 과거 거래대금과 비교해 어느 정도 수준인가를 확인해야 한다.\"** 그 종목의 **이전 거래대금보다 많이 터졌을 때** 큰 의미를 부여한다 [상천유니온 240713].\n- **유동주식수 대비 거래량으로 손바뀜을 잰다** — 돈이 크게 들어온 날의 거래량이 **유동주식수와 비슷하거나 그보다 크면** 손바뀜이 어느 정도 일어난 것으로 보고 **차트에 더 높은 점수**를 준다 [상천유니온 240713].\n\n**가점 3종 세트** [상천유니온 240713]:\n1. 그 종목의 **과거 가장 큰 거래대금 대비 이번에 더 큰 거래대금**이 터진 종목\n2. **그날 유동주식수보다 큰 거래량**이 발생한 종목\n3. **과거에 못 뚫던 저항구간을 강하게 뚫은** 종목\n\n→ **관종 상단에 올려놓고**, 재료가 일회성이 아니고 테마가 형성됐다면 **반드시 눌림 매매**를 한다.\n\n- **돌파는 앞 매물의 거래량을 잡아먹는지로 판단한다** — 앞에 있는 매물의 거래량 이상으로 터지는지 확인하고 접근 [상천유니온 240702].\n- **신고가·저항 돌파에 필요한 거래대금**: 직전 고점을 만들 때의 거래대금이 2,000억이었으면 **1,500억 정도는 나오거나 넘어야** 하고, **눌림 구간에 1,000억은 쌓여 있어야** 한다 [월독프 5주차].\n- **대량거래 발생 구간 위로 올라가려면 다시 대량거래가 필요하다** [차읽남 0926].\n\n---\n\n## 3. 상한가 — 등급과 신뢰도\n\n### 3.1 재료 기준 등급 [4강 §5]\n| 등급 | 기준 | 대응 |\n|---|---|---|\n| **S급** | HTS 호재 뉴스 + 강한 재료 + 테마 대장주 + 당일 주도주 + 후발주 동반 급등 또는 **바닥권 첫 상한가** + 신선한 재료 + **오전 강한 상한가** | 적극 진입 |\n| **A급** | HTS 호재 뉴스 있음, 단체 테마는 아니지만 **명확한 개별 재료**로 급등 | 진입 가능 |\n| **B급** | 대장 놓친 2등주, HTS 뉴스는 없고 **인터넷 뉴스로는 검색**되는 경우 | 대장 위주만. 2·3등주는 확률 저하 |\n| **C급** | **직행(로켓파동)형** 상한가, **거래대금 부족(천억 미만)**, 테마 3등주 이하, 뉴스가 어디에도 없음 | 회피(섹터 전체 동반 상승이면 \"단체 수급\"으로 예외 해석 가능) |\n\n> **300% 상한가(스펙주)는 일반 30% 상한가와 차원이 다른 높은 자리**이므로 이 등급표를 그대로 적용하지 말고 **진입 난이도를 별도로 평가**한다 [8강 §8].\n\n### 3.2 차트 위치 기준 등급 [4강 §6]\n| 등급 | 차트 패턴 |\n|---|---|\n| **S급** | **바닥권 첫 상한가**, 박스권 돌파 후 신고가 진입 |\n| **A급** | 바닥권 **이연상(2일째)** 상한가, **긴 N자형**(6개월 이상 횡보 후 돌파) |\n| **B급** | **짧은 N자형**(매물대가 가까워 소화 부담), 박스권 미돌파 짧은 N자형(쌍봉 가능성) |\n\n### 3.3 시간대별 신뢰도 [4강 §8]\n| 시간대 | 신뢰도 | 특징 |\n|---|---|---|\n| **오전 상한가**(11시 이전, 특히 10:30 이전) | **가장 높음(S급 신호)** | **익일 갭이 가장 크게** 형성 |\n| **오후 상한가** | 낮음 | 오전 상승 후 밀렸다 재상승. 역배열·매물대 多면 차익실현으로 풀리고 횡보 빈번 |\n| **장후반 상한가**(15시 이후 동시호가까지 공방) | **가장 낮음(위험)** | **주포 자금력 부족** 시사. 익일 상승 후 하락 가능성 높고 갭이 낮거나 없음 |\n\n### 3.4 안착 방식이 다음날을 결정한다\n- **공방하며 안착(거래량 多) = 지지 강 / 급격하게 안착(거래량 少) = 지지 약** [차읽남 221223·0911].\n- **오전에 급격히 상한가** → 매물 소화 부족 → 다음날 3일선이 아니라 **5·8일선**을 준비 [차읽남].\n- **롱바디 상한가**(시가~종가 사이에서 충분히 움직이다 상한가 마감)가 **지지·저항·매물대가 풍부해 매매하기 가장 쉽다** [4강 §7].\n- **점상한가**는 신뢰도는 최고지만 **매물 소화 없이 30% 직행한 \"허공\" 구조**라 지지 자리를 특정할 수 없어 **눌림 매매에는 부적합** [D-손절-02].\n- **거래대금 기준을 충족하지 못해도 상한가를 기록한 종목은 전부 별도로 등록**해둔다 [B-선정-03].\n\n---\n\n## 4. 유동성 필터 — 거래대금이 부족하면 거른다\n\n- **거래대금이 작은 종목, 시총 1000억 미만** — 호가가 얇은 종목도 제외. 단 시총 1000억 미만이라도 **끼가 있는 종목은 비중으로 관리** [IMI강의 2강].\n- **회피 필터(진입 전 체크 1순위)** [C-IMI-선정-13·14·19]: **시총 2~3천억 미만 / 분봉 거래대금 500억 미만 / 호가 두께 얇음 / 3개년 연속 적자 / 캔들 1~2개로 10%+ 급등** → 전부 제외.\n- **시총 1000억 미만, 분봉 거래대금 4~5억 종목은 제외** [C-IMI-선정-22·23].\n- **호가창 물량 확인**: 매수 후 시장가 손절 시 받아줄 물량이 충분한지. **호가가 얇으면 매수·매도 모두 어렵다.** 단 매우 강한 호재로 곧바로 상한가 직행이면 예외 [3강 §7].\n- **수익금 절대값 관점** [F-소와곰-리스크-01]: **\"수익률이 중요한 게 아니라 수익금 절대값이 중요하다. 배팅할 수 있느냐 없느냐가 중요하다.\"** → **거래량이 충분해 비중을 실을 수 있는 종목**을 고른다.\n- **ML 매매는 거래량이 적은 비주력 종목에는 적용하지 않는다**(중간 휩소 위험) — 대장급 종목에만 [B-선정-04].\n- **저지바는 거래대금 큰 종목만** [D-IMI-진입-13].\n- **품절주**(대주주 지분 60~75%)는 관심 소외주가 아닌 이상 **매매 부적합** [월독프 2주차].\n\n---\n\n## 5. 관심종목 등록·관리\n\n### 5.1 등록 기준과 갱신 주기\n- **상승률 기준(JB) 관심종목은 최근 5거래일(주말 제외)치만 유지하며 매일 갱신**한다. **테마별 관심종목(로봇·바이오 등)과는 별도로 관리하고 혼용하지 않는다** [B-선정-01·02].\n- **500억봉 0~5일차 종목을 등락률 순으로 돌려** 살 만한 자리의 종목을 **관종 상단에 배치** [B-IMI-세팅-02].\n- **28%종목·억봉종목 업데이트 → 어느 섹터가 많은지로 당일 주도 섹터 선정** [B-IMI강의-세팅-02]. **(마감 후 작업)**\n- **억봉종목 최신화 → 차트를 돌려 매매할 만한 자리에 온 종목만 `당일 놀이터`로** [B-IMI강의-세팅-01]. **(퇴근 후 작업)**\n\n### 5.2 경과 일차로 매매 근거가 바뀐다\n\n**종목선택 3단계** [상천 7월]:\n1. **당일 거래대금 또는 등락률 상위 종목** 매매\n2. **상천정리 0~4일차 종목** 매매 — **10일선이 깨지면 3번으로 이동**\n3. **상천정리 5일차 이후**는 **일봉상 지지구간**에서 매매(재료가 강한 경우)\n\n> **경과 일차에 따라 매매 근거가 \"모멘텀\"에서 \"지지구간\"으로 바뀐다.**\n\n**0/1/2일차 프레임** [차읽남 220726]:\n- **0일차**: 바닥권에서 150억봉·500억봉이 **처음 뜨는 날** → 투심이 남아있다는 신호\n- **1일차**: **갭 상승 또는 강한 시세**가 이어질 가능성\n- **2일차**: **조정 시작 또는 추가 시세 여부 확인**\n- → **0일차 대량거래가 얼마나 투심을 남겼는지가 1·2일차 흐름을 결정**하며, 이것이 **3일선 매매의 이론적 근거**다.\n\n### 5.3 관종 3중 구조 [B-IMI-세팅-06·08]\n① **섹터 관종**(분위기 측정용, 매매 대상 아님) ② **매매 관종**(대장·1·2등주만 상단) ③ **S급 관종**(재료+시황+차트 모두 좋은 종목, 지수 하락일 매수용)\n\n- **관종 3페이지 운용** [B-IMI-세팅-12]: **1p 고정값 / 2p 시장정리 종목(0~5일차) / 3p 섹터별**로 두고 상승률·하락률 상위와 함께 등락률 순으로 계속 돌려본다.\n- **관종 그룹명 칸에 아침 자료 기사 제목을 그대로 복사**해 장중 이슈를 잊지 않는다 [B-IMI-세팅-07].\n- **관종 상단 = 각 핫섹터에서 가장 강하고 잘 버티는 종목.** 차트 반등 자리는 **핫한 섹터·재료일 때만** 상단 등록 [C-IMI-선정-04].\n- **대장주가 아닌 잡주는 관종에 넣지 않는다** — 잡주들에 물려버릴 수 있다. **관종의 종목들은 어떤 강사든 비슷한 종목을 보고 있다** — 그래서 지지·저항이 실제로 작동한다 [IMI 241213].\n- **관심종목 구성 4갈래**: **주도섹터 / 눌림 / 억봉종목 / 기사 추가** [상천 8월].\n- **지금 자리가 아닌 종목은 어차피 지나갈 자리**(상승은 전일 고점·분봉 저항대, 하락은 지지 예상가)에 **시세 알림**을 걸어둔다. 알림이 와도 **바로 사지 말고 돈이 들어오는지 확인** [B-IMI-세팅-13].\n\n---\n\n## 6. 거래대금과 직결된 특수 상황\n\n### 6.1 보호예수 해제 [7강 §12.3]\n> **영업일이 아닌 달력상의 일자(주말 포함)로 카운트한다.**\n\n- 예: 11/3 상장 + 보호예수 15일 → 11/17이 15일째 → **11/18이 해제일.** 1개월(30일) 기준 → 12/2가 30일째 → **12/3이 해제일.**\n- **노타(2025.12.3)**: 1개월 해제 직전 차트가 양호해 보여도 회피 대상 — 실제 시초가 -6.43%, 최저 -15.67%(400만 주 이상 출회).\n- **TMC(2025.12.30)**: 15일 해제 직전 3음봉 거래량 감소만 보면 종가배팅 후보였으나, **해제 임박을 체크하지 못하면 익일 큰 손실**로 이어지는 전형적 사례.\n- **보호예수 해제일이 임박하면 타점에 도달했어도 패스** [C-선정-07].\n\n### 6.2 신규주의 유통물량 [월독프 6주차 / 소와곰 241026]\n- **신규 상장주의 억봉**은 **유통물량·공모자금·보호예수 안 걸린 금액을 파악해, 그 금액을 거래대금이 넘었을 때** 오를 확률이 높다.\n- **연달아 신규주가 상장하면 두 번째 날은 약해진다.**\n- **유통주식수 25% 이하가 이상적, 30%까지 허용. 구주 물량이 많으면 매도세가 강해 위험.**\n- **신규주는 공모주 물량이 다 나갔는지 확인**한다 [월독프 8주차].\n\n### 6.3 실적 발표 시즌 [3강 §10]\n- 분기 실적은 법적으로 **분기 마지막 날로부터 45일 이내 의무 발표**, 동일 기업은 **매년 비슷한 시기(±3~4일)**에 발표 → **사전 예측 가능**하다. 실적 발표 예정 종목은 **종가배팅 시 특히 주의**.\n- 차트 위치별 반응 차이: **저점 호실적 = 선반영 안 됨 → 급등 가능 / 고점 평이한 호실적 = 선반영됨 → 하락 가능.**\n\n### 6.4 단기과열·투자경고\n- **단기과열 \"예고\" 단계에서는 잘 밀어 올리지 않는다 → 실망 매물**이 나온다. 지정 직전 쭉 빼는 패턴도 있어 **수익 중이면 튀는 것이 낫다** [소와곰 240229·230616].\n- **투자경고는 재료와 무관하게 투심을 죽인다** [상천유니온 240412].\n- **단기과열 지정 후 2일째까지 투음봉 + 5일선 위 종가마감**이면 **둘째 날 매수**(첫날보다 안전), 3일째도 하락하면 분할추매 후 4일째 매도 [F-손절-06].\n\n---\n\n## 7. 화면·도구\n\n| 용도 | HTS | MTS |\n|---|---|---|\n| 실시간 조회순위 | `0198` | 실시간 조회순위 |\n| 상한가·상승률 상위 | `0181` | 순위검색 → 전일 대비 등락률 상위 |\n| **거래대금 상위** | **`0186`** | 순위검색 → 거래대금 상위 |\n| 종목별 투자자별 매매 추이(잠정) | `1051` | 종목투자자잠정 |\n| 투자자별 매매 동향 | `0796` | 종목투자자 |\n| 종목일별 프로그램매매 추이 | `0778` | 프로그램-종목별 추이 |\n| 해외 지수·지수선물 | `0728` | 글로벌전광판 |\n| 투자자별매매종합(선물 확인) | `0780` | — |\n\n- **세력 주도주 포착 4화면 조합**: `0659`(섹터) + `0198`(실시간순위) + `0147`(상한가포착) + `0177`(과거대장변천사) [B-진입-07].\n- **장중 3종 스캔**(전 화면 X, 대장주 위주만) [IMI]: ① 실시간 조회순위 → 섹터 연결 → 개별/섹터 호재 구분 ② 상한가·상승률 상하위 → 1등 상한가 시 섹터 동반 여부 ③ **거래대금 상위 → 자금 흐름 파악**\n- **화면 5개 순환** [B-IMI강의-세팅-03]: 억봉·시리종목(등락률 순) → 시세 알림 → `0198` → `0181` → `0186`\n\n---\n\n## 8. 실행 순서 요약\n\n### 마감 후 (가장 중요한 시간)\n1. **당일 상한가 종목 + 거래대금 상위 종목**을 가장 먼저 확인 [IMI강의 2강]\n2. **억봉·상한가 종목 정리** → 어느 섹터가 많은지로 **당일 주도 섹터 선정** [B-IMI강의-세팅-02]\n3. 각 종목의 거래대금을 **그 종목의 과거 최대 대비** 채점해 서열 [상천유니온 240713]\n4. **상한가 등급**(재료·차트위치·시간대) 판정 [4강 §5·6·8]\n5. **관종 갱신** — JB 관종은 최근 5거래일치만, 테마 관종과 분리 [B-선정-01·02]\n6. 관종 종목의 차트를 돌려 **매매할 만한 자리에 온 종목만** 당일 놀이터로 [B-IMI강의-세팅-01]\n\n### 장전\n1. **오늘의 문턱을 조정한다** — 관종이 너무 많으면 1,000억까지 상향, 장이 침체면 300억까지 하향 [7강 §4.4]\n2. **500억봉 0~5일차 종목을 등락률 순으로** 돌려 관종 상단 배치 [B-IMI-세팅-02]\n3. **경과 일차별로 매매 근거를 확인** — 0~4일차는 모멘텀, 5일차 이후는 일봉 지지구간 [상천 7월]\n4. **보호예수 해제일·실적 발표일**을 달력으로 체크 [7강 §12.3, 3강 §10]\n\n### 장중\n1. **3종 스캔**(조회순위 / 상한가·상승률 / 거래대금 상위)을 대장주 위주로 순환 [IMI]\n2. 상한가 발견 시 **섹터·재료 연결 → 끼 있는 2·3등주** 확인 [C-IMI-선정-02]\n3. **회피 필터** 통과 여부 확인(시총·분봉 거래대금·호가 두께·연속 적자·급등 캔들) [C-IMI-선정-13·14·19]\n4. 돌파를 노린다면 **앞 매물의 거래량을 잡아먹는지** 확인 [상천유니온 240702]\n\n---\n\n## 부록 — 참조 원문 위치\n\n| 저자 | 원문 블록 |\n|---|---|\n| 제시스페라(베이스) | `C_종목선정.md` C2(상한가 등급)·C4(제시봉)·C5(거래대금 분석) 57~172행 |\n| IMI(날짜별) | `C_종목선정.md` 233~560행 (관종 관리·회피 필터) |\n| IMI강의 | `C_종목선정.md` 584~695행 (거차재시 정의, 문턱 가변성) |\n| 상천·상천유니온 | `C_종목선정.md` 697~1,000행 / `D_차트·파동.md` 1,113~1,155행 (거래대금 채점) |\n| 월독프 | `C_종목선정.md` 1,176~1,262행 / `D_차트·파동.md` 1,250~1,258행 (억봉 이후 갭) |\n| 소와곰 | `C_종목선정.md` 1,262~1,305행 (신규주 수치 필터, 단기과열) |\n| 차읽남 | `D_차트·파동.md` 387~400행(0/1/2일차) / `E12_이동평균선매매.md`(150·500억봉 4조건) |\n\n---\n\n## 변경 이력\n- 2026-09-06: 최초 작성. `C_종목선정.md`·`D_차트·파동.md`·`B_매매인프라·HTS.md`에서 거래대금 관련 내용을 8개 주제로 통합. 관점 차이 1건 병기(기준봉 문턱).\n"}, {"label": "[거차재시] 차트", "file": "1_거차재시/차_차트.md", "md": "# 3차 거차재시 — 차: 차트\n\n> **문서 성격**: 거차재시 4축 중 **차트** 판단을 저자별로 흩어진 상태에서 주제별로 통합한 문서.\n> 공통되는 부분은 합치되 출처를 병기했고, 저자마다 결론이 갈리는 부분은 삭제하지 않고 `⚠️ 관점 차이`로 나란히 적었다(00_운영규칙 §6).\n> **전략 고유의 차트 조건**(밥그릇차트, 양음양 패턴, 신규주 차트 특성 등)은 각 전략별 3차 가이드에서 다룬다.\n> 원문: `2차 종합/D_차트·파동.md`(1,438행) + `2.5차 규칙카드/cards_D`.\n\n---\n\n## 0. 전제 — 차트는 마지막 5%다\n\n전 저자가 같은 말을 한다. **차트는 단독으로 쓰는 도구가 아니다.**\n\n- **\"차트에서 시작해서 끝나는 매매는 1%도 채 되지 않는다. 그 1%도 알고 보면 재료·거래량·시황이 함께 있다.\"** 재료·거래량·시황이 함께 있을 때, **마지막 5%의 퍼즐을 맞추기 위해 차트가 존재한다** [차읽남 24년 차트인사이트 3강].\n- 같은 차트·같은 자리·같은 이벤트라도 **시황에 따라 매매 여부가 달라진다.** 지지구간도 시황이 안 맞으면 그냥 깨진다 — 매수 버튼 누를 사람이 다른 종목에 가 있기 때문 [D-IMI3].\n- **지표는 정답이 아니라 확률을 높이는 수단이다.** 진짜 중요한 것은 거차재시다 [IMI강의 4강 p.62~64].\n- **\"이 방법이 무조건 되는 거면 인공지능으로 프로그램 짜서 돈 다 벌어갔겠죠?\"** [상천유니온 240703].\n\n> **실증 사례 — 한솔테크닉스** [IMI 0622]: 전날 일봉 저지바 + 시총 6천억 + 재료(반도체 소부장 인수)로 관종 상단 등록. 아침에 다른 소부장은 9~10% 오르는데 한솔만 4% → 따라갈 것으로 보고 진입, 약 7% 수익. **매매 결정의 핵심은 일봉 차트가 아니라 \"오늘이 명확히 소부장 장\"이라는 시황이었다.** 소부장 장이 아니었으면 분봉 흐름도 안 나왔고 매매도 안 했을 것.\n\n---\n\n## 1. 지지·저항 — 모든 차트 판단의 상위 개념\n\n### 1.1 숲과 나무 [IMI강의 4강]\n- **숲 = 지지와 저항** (모든 기술적 분석의 중심, 가장 먼저 찾을 기준점)\n- **나무 = 캔들·거래대금·이평선·추세선·파동·피보나치** (지지·저항을 찾아내기 위한 하위 도구) — 축약어 **캔거이 / 추파피**\n- 급등주가 5일선에서 반등이 잘 나오는 이유는 **그 이평선이 \"지지구간\"으로 인식되기 때문**이다. 이평선 자체에 힘이 있는 게 아니다.\n- **차트를 열자마자 가장 먼저 지지·저항 구간부터 찾는다.**\n- 정의: **지지 가격대 = 매수의 기준이자 손절의 기준 / 저항 가격대 = 매도의 기준.** 월봉·주봉·일봉·분봉 모두 공통.\n- **단타의 정의 자체가 이것이다** — 거차재시가 조합된 종목을 모니터링하다가 **지지구간에서 매수하고 저항구간에서 매도**하는 것. 매수는 지지구간에서 **더 이상 하락하지 않고 버텨주는 모습이 확인될 때**, 매도는 저항구간에서 **더 이상 오르지 못하고 밀리는 모습이 나올 때** [IMI강의 4강].\n\n### 1.2 선이 아니라 구간이다 (전 저자 공통)\n- **정확히 그 선에서 반등하는 경우는 드물다.** 선보다 약간 위에서 지지가 나오기도 하고 조금 더 아래에서 나오기도 한다 → **'구간'의 개념**으로 접근한다 [IMI강의 4강 p.4~5].\n- 5,000원이 지지라면 실제로는 **위아래 2~3틱**, **급락·급등에서는 2~3%까지도** 움직인다 [월독프 5주차].\n- 지지 여부는 **그 순간 호가창의 매수세가 받쳐주는지**로 확인한다 — 매수세가 들어오며 받치는지, 자잘하게 왔다갔다 하며 받치는지를 구분 [월독프 5주차].\n- 이평선도 마찬가지다. **5일선에 정확히 닿아야 매매한다는 개념이 아니라 구간으로 본다** [상천유니온 240703].\n\n### 1.3 저항↔지지 전환의 심리 [IMI강의 4강 p.15~18]\n**저항 돌파 → 지지로 전환**: 저항을 뚫었다는 건 매수세가 매우 강해졌다는 증거. 두 갈래 심리가 새 매수세를 만든다 — ① 과거에 못 샀던 투자자들의 **대기 매수** ② 과거 저항에서 팔았던 투자자들의 **재매수**.\n\n**지지 이탈 → 저항으로 전환**: 그 구간에서 매수한 투자자들이 손실 상태가 되고, 반등해 그 구간에 오면 **\"본전 왔을 때 탈출하자\"는 심리**로 매도 물량이 나온다.\n\n- 4~5번 지지받던 곳을 깨면 **그 자리가 저항으로 바뀐다** [D-IMI2].\n- **지지가 나오는 진짜 이유**: \"최근에 돈이 많이 들어온 종목은 많은 사람이 보고 있고, 차트 볼 줄 아는 사람들은 그 지지·저항 구간을 다 안다. **그 사람들이 보고 있기 때문에 지지가 나오는 것**\" [상천유니온 240514]. → 그래서 늘 **주도섹터 내 주도주, 돈 많이 들어간 종목**으로 매매해야 한다.\n- **지지 = 매수 버튼.** 이평선 때문에 지지가 나오는 게 아니라 **그 자리에서 사람이 매수 버튼을 누르기 때문**이다 [D-IMI2].\n\n### 1.4 강도를 결정하는 요소\n\n> ⚠️ **관점 차이 — 채점 항목이 저자마다 다르다 (배타적이지 않고 누적적)**\n\n| 저자 | 채점 요소 |\n|---|---|\n| **IMI강의 4강 (5가지 요약본)** | ① 횡보한 거래 시간(길수록 강함) ② 거래대금·거래량(클수록 강함) ③ 최근일수록 중요 ④ 추세가 크게 바뀌는 구간 ⑤ 종목마다 다르게 작용 |\n| **IMI강의 4강 PDF (7가지 정본)** | 위 5가지 + ⑥ **종목의 성격(패턴 반복성)** + ⑦ **주가의 상승폭**(많이 올랐을수록 지지가 쉽게 깨짐) |\n| **차읽남 (분봉 우선순위)** | ① 큰 거래대금 발생 구간 ② 라운드피겨 ③ 상한가 종가 ④ 전일 종가 ⑤ 시가 |\n| **IMI (실전)** | 최근일수록 잘 맞고 오래될수록 안 맞음 + **항상 거래량 터진 위치만 본다** |\n\n**모두 합치면 실전 채점표는 다음과 같다:**\n1. **거래 시간** — 그 가격대에 오래 머물렀는가 (A구간 1시간 vs B구간 5시간 30분이면 B가 5배 강함) [p.19~20]\n2. **거래대금** — 현재가가 과거 거래대금 집중 가격보다 **아래면 강한 저항, 위면 강한 지지** [p.21~22]\n3. **최근성** — **주식 시장은 기억이 짧다.** 최근에 거래한 투자자일수록 본전·재매수 심리가 강함 [p.23]\n4. **추세 전환 자리** — 눈에 잘 보이는 \"꼭지·바닥\" 자리일수록 많은 사람이 의식 [p.24]\n5. **시장 분위기** — 아래 1.5 참조\n6. **종목의 성격** — 윗꼬리 달고 하락했던 종목은 그 패턴이 반복된다. 과거 특정 이평선에서 자주 지지받았으면 이번에도 확률이 높다. **매수 전 반드시 그 종목의 과거 패턴을 분석한다** [p.28~31]\n7. **상승폭** — 많이 올랐을수록 차익실현 욕구가 커져 지지가 쉽게 깨지고 조정도 깊어진다. 고점 근처에서는 **기준 지지구간을 조금 더 아래로** 잡는다 [p.32~33]\n\n### 1.5 시장 분위기가 신뢰도를 바꾼다 [IMI강의 4강]\n| 장세 | 지지 | 저항 | 대응 |\n|---|---|---|---|\n| **강세장** | 잘 나온다 | 잘 뚫는다 | 매수 비중 조금 더 크게, 매도 타점 조금 더 길게 |\n| **약세장·하락장** | 안 지킨다 | 잘 맞는다 | **지지를 한 번 더 깰 수 있다는 전제**로 1차 비중 축소, 목표 주가 낮게, 매도 타점 짧게 |\n\n> **초보자가 자주 하는 실수**: 코스닥 지수 분봉이 우하향하는데도 관심 종목이 단기 이평선 근처에 왔다는 이유만으로 **공식처럼 무조건 매수**하는 것. **종목보다 우선하는 것이 전체 지수 흐름과 시장 거래대금이다** [p.25~27].\n\n### 1.6 콜라보 자리 — 가장 확률 높은 포인트\n\n**콜라보 = 여러 지표가 비슷한 가격대에서 겹치는 구간.** 지표 2개 이상이 겹치면 신뢰도가 상승하며 단기 매매에서 가장 확률 높은 타이밍이 된다 [IMI강의 4강 p.62~64].\n\n**찾는 실무 절차** [상천유니온 240513]:\n1. 일봉상 지지구간을 확인해 라인을 긋는다\n2. **바로 분봉에도 같은 라인을 긋는다**\n3. 분봉 자체의 지지·저항 구간도 따로 긋는다\n4. **겹치는 구간이 콜라보 구간**\n\n- 지지 근거는 **겹칠수록 확률이 높다**. 이평선 + 저지바 + 분봉 지지구간이 겹칠수록 좋다. 단 **음봉 거래량이 크면 받지 않는다** [D-IMI-진입-24].\n- 세 군데가 겹치면 강력하다 [IMI 0624].\n- **콜라보 자리를 발견해도 반드시 시황과 재료(거차재시)를 함께 체크**한다.\n\n### 1.7 반복 횟수 — 몇 번째 시도인가\n\n> ⚠️ **관점 차이 — 반복될수록 강해지는가, 약해지는가**\n>\n> 지지와 저항이 정반대로 작동한다는 점을 구분해야 한다.\n\n| 상황 | 판정 | 출처 |\n|---|---|---|\n| **같은 지지선에 3번 이상 내려옴** | **깨질 확률이 높다** (1~2번은 반등 가능) | [차읽남 24년 강의, 오킨스전자] |\n| **같은 저항선에 2~3번 돌파 시도** | **3번째는 돌파할 확률이 높다** | [차읽남 24년 강의] |\n| **저항선 첫 돌파 vs 두 번째 돌파** | **두 번째가 신뢰도가 높다** — 첫 돌파 때는 양쪽(아래 매수자의 \"한 번만 살려주세요\" + 위쪽 매수자의 본전 심리)에서 매물이 나오지만, 두 번째는 한 차례 정리된 뒤라 상승 욕망이 더 크다 | [상천 7월] |\n| **밑에서 돌파를 3번 트라이** | **실망 매물이 나온다** | [월독프 5주차] |\n\n> **해석**: 차읽남·상천은 \"저항은 반복 시도할수록 뚫린다\", 월독프는 \"3번 트라이하면 실망 매물\"로 정반대로 보인다. 실제로는 **거래대금이 함께 늘어나느냐**가 갈림길이다 — 상천유니온은 **\"돌파는 앞 매물의 거래량 이상으로 터지는지를 확인하고 접근한다\"** [240702], 월독프는 **\"직전 고점 거래대금이 2,000억이었으면 1,500억 이상은 나와야 뚫는다\"** [5주차]고 못박는다. **시도 횟수가 아니라 시도할 때의 거래대금이 판정 기준이다.**\n\n- **저항을 못 뚫을 것 같다는 판단**: 앞의 저항구간 거래량이 어마어마한데 이번 시도의 거래량이 택도 없으면 \"여기까지구나\" 하고 보내준다 [상천유니온 240513].\n- **가장 좋아하는 자리**: 앞에 윗꼬리가 3개 — 세 번이나 실패한 자리를 이번에 **강하게 돌파**했다면 그 구간은 저항→지지로 바뀐 자리. 주가가 그 구간에 오면 분봉을 열어 반등 지점을 예측하고 매매 [상천유니온 240704].\n\n### 1.8 갭 구간에는 지지·저항이 없다 [상천유니온 240703]\n- **지지·저항은 그 구간에서 거래가 있어야 생기는 개념**이다. 갭을 띄우면 그 구간에 거래가 없었으므로 **쉽게 깨지고 쉽게 뚫린다.**\n  - **주가가 갭 위에서 하락을 시작하면 갭을 메우러 가기 때문에 크게 빠진다.**\n  - **주가가 갭 아래에 있으면** 위쪽 갭 구간의 매물이 약해 **뚫고 올라가기 쉽다.**\n- 신규주도 동일 — **갭 구간은 공방이 없어 지지·저항이 약하다** [차읽남 0911].\n- **점상한가는 매물 소화 없이 30% 직행 → \"허공\" 구조**라 지지 자리를 특정할 수 없어 원칙적으로 관종에서 제외 [D-손절-02].\n\n### 1.9 매물대\n- **매물대 = 매수·매도 물량이 많아 거래가 활발했던 가격대.** 일봉 위 긴 매물대 막대 = 저항이 심한 구간 [차읽남 24년 강의].\n- **매물대 판단법**: 시가·종가·고가·저가에 거래가 몰린다 — 특히 **시가·종가는 동시호가에 대량 체결**되므로 지지·저항이 자주 발생 [IMI 0824, IMI강의 4강].\n- **역배열 상승 시 매물대 돌파 여부**: 횡보 기간·거래대금을 보는 이유는 \"매물대를 뚫을 힘이 있는가\"를 확인하기 위함. **3개월 이하 = 짧음, 6개월 이상 = 좋음** [차읽남 24년 강의].\n- **소화의 정의**: 가까운 시점에 터진 물량을 **넘거나 동등한 수준의 거래량이 나올 때까지 횡보**하는 것 [소와곰 230623]. → 거래량이 이미 소화된 종목이 먼저 가고, 물량이 쌓인 종목은 소화 후 뒤늦게 간다.\n- **물량 소화의 심리 구조**: 목표가가 높았던 물량은 저항선을 만날 때마다 일부만 매도하며 목표가를 낮춰간다. 이 과정이 반복되며 **상승 → 흔들기 → 재상승** 형태가 된다. **\"흔드는 구간이 고점인 경우가 많다\"** [소와곰 230331].\n\n### 1.10 라운드피겨\n- **0으로 끝나는 가격대**(1,000원·1만원·10만원)는 심리적 요인에 의한 강력한 지지·저항선. 강사 표현 **\"밑줄 쫙 별표 3개\"** [2강 §7].\n- 검증 사례: SK하이닉스(50만원 + ML0), 삼성전자(10만원 + ML1 + 10일선), 에코프로(10만원 + 일봉 지지선) — **모두 다른 근거와 겹친 자리**였다.\n- 최근 호가 단위 제도 변경으로 의미가 다소 약화됐다는 단서가 붙는다 [2강 §7].\n\n---\n\n## 2. 이동평균선\n\n### 2.1 본질 = 평균 매입가 [IMI강의 4강 p.41~47]\n- 3일선 = 최근 3일 매수자들의 평균 매입가, 5일선 = 최근 5일. **주가가 5일선 위에 있으면 최근 5일 투자자 대부분이 수익권**이라 매물 압력이 작다 → 단기 매매자들이 5일선을 중요하게 본다.\n- **주가가 이평선 위에 있으면 그 이평선은 지지선, 아래에 있으면 저항선.**\n- **기간이 길수록 더 강력하다** — 3일선 아래일 때보다 **120일선 아래일 때 뚫기가 훨씬 어렵다**(더 많은 투자자의 평균 매입 단가가 모여 있으므로).\n\n### 2.2 이평선은 공식이 아니다 [상천유니온 240703·240710]\n3~8일선 매매의 전제 조건:\n- **① 거차재시를 다 확인했을 것**\n- **② 주가지수가 1분봉상 하락 추세가 아닐 것**\n- 거래대금만 많은 게 아니라 **재료의 신선함·확장성·연관성**이 있어야 하고,\n- **이평선 단독이 아니라 \"저항이 지지로 바뀌는 일봉·분봉 자리\"와 겹치는 자리**여야 확률이 높다.\n\n> **현실적 한계**: **\"금액이 적을 때 잘 되는 매매다.\"** 비중을 크게 넣으면 \"더 빠지면 어떡하지\"라는 생각부터 들어 실행이 어렵다 [상천유니온 240710].\n\n> **작동 조건 — 많은 사람이 같이 봐야 한다** [상천유니온 240703]: 솔루스첨단소재 사례(거래대금 5,400억 = 그 종목 역사상 최대 + 5일선 부근 + 엔비디아 공급 재료 + 코스피·코스닥 둘 다 플러스) → **\"안 할 이유가 없던 종목\"**이라 정석적인 5일선 반등이 그대로 나왔다. **\"나만 좋다고 생각하는 종목이 아니라 많은 사람이 좋다고 생각해야 5일선에서 매수세가 들어온다.\"**\n\n### 2.3 상승추세에서 각 이평선의 의미 [월독프 5주차 — 이평선 전투 체계]\n| 이평선 | 의미 |\n|---|---|\n| **5일선** | **모든 시세의 시작.** 상승 추세에서는 5일선을 깨지 않고 타고 오른다. **얼마 안 가 깬다면 처음부터 갈 종목이 아니었다** |\n| **20일선** | **단기매매의 생명선.** 급등 종목이 20일선 조정에서 반등을 못 주면 20일선 이내 물린 단기 물량이 **한꺼번에 손절 투매**로 나오며 급락 |\n| **60일선** | **마지막 남은 반등 자리(최후 보루).** 3개월 물린 사람들이 \"본전만 오면 판다\"고 대기 중이라 기술적 반등이 잘 나옴. **60일선까지 깨고 반등이 없으면 테마·주도주 수명은 다한 것** |\n| **120일선** | 6개월 물량이 대기하지만 **매도벽이 두껍지 않고 듬성듬성**해 돌파는 의외로 어렵지 않다. 60일선 지지를 먼저 확인한 뒤 재도전 |\n\n### 2.4 하락추세에서 각 이평선의 의미 [월독프 5주차]\n| 이평선 | 의미 |\n|---|---|\n| **5일선** | **역전의 발판.** 5일선 위로 올라섰다는 건 최소한 5일간 물린 물량은 소화했다는 뜻 → 관심 종목이면 **5일선 위로 올라가는지부터** 본다 |\n| **20일선** | 아주 작은 관문이지만 **못 뚫으면 나락.** 반등해도 20일선을 못 뚫으면 관심권 밖 |\n| **60일선** | **가장 강력한 첫 관문.** 3개월이 안 된 물린 사람들의 저항이 거세 뚫기 정말 어렵다. 뚫었다가 못 지키면 20일선 지지를 확인. 하향 추세에서 60일선을 깰 때는 **대규모 거래량 동반** |\n| **120일선** | 까다롭지만 엉성한 관문. 매도벽이 뭉쳐 있지 않아 전투는 상대적으로 쉽다 |\n\n### 2.5 파생 이평선의 존재 이유 [월독프 5주차]\n> 모두가 같은 이평선(5·20·60·120)을 보면 초과수익이 어렵다 → **남보다 빨리 사고 빨리 파는 자리**가 파생 이평선이다.\n\n| 선 | 역할 |\n|---|---|\n| **3일선** | 5일선보다 빠르다. **정말 강한 급등주는 5일선 조정은커녕 3일선 조정으로 끝난다** |\n| **8일선** | **5일선 지지를 못 보고 손절한 단기 매물을 받아주고 반등하는 자리** |\n| **15일선** | 20일선 조정을 기다리는 매수 세력이 있어 **강한 종목은 15일선에서 반등** |\n| **33·45일선** | 20일선과 60일선 사이. **60일선 반등을 기다리는 쪽이 미리 반등을 주는 자리** |\n| **100·224일선** | 120일선에서 파생. **224일선 = 40주·200일(장기 추세) / 100일선 = 20주(중기 추세)** |\n\n**100-224 조합 해석** [월독프 5주차]: 역배열에서 **\"100일선 위 + 224일선 아래\"**는 단기·중기는 상향 전환됐지만 장기는 아직 하향이라는 뜻. 여기서 **224일선을 돌파하면 단기·중기·장기가 모두 정배열**로 바뀌며 크게 오를 여건이 마련된다. **224일선 돌파는 150~500억봉급 대량 거래대금을 동반**하는 경우가 많다.\n\n### 2.6 어느 이평선을 기준으로 삼을 것인가\n\n> ⚠️ **관점 차이 — 기준 이평선이 저자마다 다르다**\n\n| 저자 | 기준 | 판정 근거 |\n|---|---|---|\n| **차읽남** | **시장 강도별로 바꾼다** — 강한 장 3일선 / 보통 장 5일선 / 약한 장 8일선 [220919·220925]. 거래대금 감소 국면에서는 5일선 반등이 3일선보다 잘 나옴 [1104] | 시장 유동성 |\n| **IMI강의** | 일봉 **3~8일선**, **15일선 깨지면 컷**. 분봉 **120분선** | 고정 프레임 |\n| **주간매매** | **10일선** — 깨면 단기 추세 종료. **강한 종목일수록 10일선을 안 깬다**(진짜 강하면 5·3일선도). 단 **공식 아님, 계속 보며 체감** [0625] | 단일 기준 |\n| **월독프** | 국면별 전투 체계(위 2.3~2.5) | 다층 구조 |\n| **소와곰** | **분봉 120분선 단일 기준** — \"갈 놈은 120분선을 깨지 않는다\" | 단일 기준 |\n| **차읽남(급등주)** | **급등주는 5일선 위에서 논다** → 5일선 이탈 = 추세 이탈 [220919] | 종목 유형별 |\n\n> **해석**: 충돌이 아니라 **적용 대상이 다르다.** 차읽남은 시장 강도에 따라 기준선을 옮기고, 주간매매·소와곰은 하나로 고정한다. **공통점은 \"강한 종목일수록 더 짧은 이평선에서 반등한다\"**는 것 — 3일선 반등 = 최강, 8·15일선까지 밀리면 힘이 빠진 것으로 본다.\n>\n> 단, **바닥권 상한가(역배열)는 예외**다 — 5일선이 강한 지지 역할을 못 하므로 **5일선 이탈 시 반등보다 추가 하락 가능성이 높다** [차읽남 1122].\n\n### 2.7 정배열·역배열의 심리 구조 [월독프 5주차]\n- **정배열 = 상승추세 = 시장의 관심이 크다 → 저가 매수세가 있다 → 3~8일선 반등**이 나온다.\n- **역배열 = 하락추세 = 물린 사람이 많다 → 5일선 부근만 와도 원금 회복 심리로 매도**가 나와 5일선 위로 가기 쉽지 않다. **거래량도 작아 작은 매도세만으로 주가가 망가진다.**\n- **역발상 신호**: **\"정배열인데 예상되는 저가 매수세가 나타나지 않는다면, 나보다 똑똑한 참여자들이 먼저 리스크 시그널을 감지했다는 뜻\"** — 반등을 기대한 자리에서 반등이 없으면 즉시 경계한다. (차읽남도 같은 취지: **\"강한 지지선이 깨지면 내가 모르는 악재가 있는 것\"** [월독프 6주차])\n- **정배열 종목이 상승 탄력이 높다** — 위에 매물이 없기 때문. 역배열은 고점까지 힘겹게 상승(윗꼬리 多)하다가 전고점 돌파해 정배열 전환 후 탄력이 뚜렷해진다 → **종목 선정 시 역배열보다 정배열 우선** [차읽남 24년 강의, 엔켐].\n- **역배열 단타 조건**: ① 횡보기간 충분(3개월 이상) **or** ② 대량거래량 상승 — **둘 다 없으면 진입 금지** [차읽남 221012].\n- **첫 억봉 후 첫 눌림** = 역배열→정배열 전환 자리. 순서: **역배열 → 긴 하락 → 이평선 수렴 → 첫 상승 → 첫 눌림(진입)**. 분봉에서도 동일 [상천 7월].\n- **이격이 큰 자리는 서열 정리를 기다린다** — 이평선이 다 벌어진 상태에서 지지됐다고 매수하는 건 초보 실수. **\"서열 정리가 다 됐는데도 더 밑으로 안 빠지네?\" 할 때** 매수 [상천유니온 240717].\n\n---\n\n## 3. 파동\n\n### 3.1 엘리어트 단순화 [IMI강의 4강 p.50~57]\n- 한 사이클: **상승1파 – 조정1파 – 상승2파 – 조정2파 – 상승3파 – 하락1파 – 반등1파 – 하락2파** (상승 5파 + 하락 3파 = 8개 파동)\n- **상승 파동**: 전 저점을 깨지 않고 상승 / 저점이 점점 높아짐 / 목표 = 전 고점 돌파\n- **하락 파동**: 고점이 점점 낮아짐 / 전 고점을 넘지 못함 / 목표 = 전 저점 이탈\n- 가장 중요한 것은 **파동의 시작·끝·방향을 짐작하는 것**이며, **직전 고점·저점이 판정의 핵심 기준**이다. **주가의 절대적 위치보다 직전 고점·저점과의 상대적 위치**로 흐름을 파악한다 [p.52].\n\n### 3.2 몇 파인가 — 이 문서에서 가장 중요한 판정\n\n**결론: 1차 상승 파동의 조정이 가장 좋다. 2차 상승 이후는 재료가 아주 좋은 경우에만. 3차 상승 파동의 조정에서는 매매하지 않는다** [IMI강의 4강].\n\n- 이유: **1차 상승 이후에는 얕은 조정에서 반등**하지만, **2차 상승 이후에는 이전보다 더 아래까지 눌린다** — 상승이 크면 수익실현 욕구가 커지기 때문(토니모리 사례).\n- **매수 전 현재 자리가 상승 2~3파의 고점이 아닌지 반드시 체크. 일봉이든 분봉이든 상승 3파 구간이면 매수 금지** [p.53].\n- **3파가 위험한 심리적 이유**: \"3파가 생기고 나면 그간 '더 가려나' 하며 재고 있던 사람들의 **욕심 주머니가 폭발**한다. 1·2파 조정 때는 보고만 있다가 3파 조정에 '에라이' 하고 달려들다 물리면 답이 없다\" [상천유니온 240507].\n- **상승 3파동 + 역대급 거래대금 = 마지막 피날레** — 그 뒤 눌림은 하지 않는다. 실패 경험: \"3파동인데 거래대금이 제일 많이 터졌다고 좋다고 눌림매매하다가 며칠 주르륵 흘러내린 경우가 꽤 있었다\" [상천유니온 240515].\n\n> ⚠️ **관점 차이 — 2파 눌림을 허용하는 조건**\n>\n> | 저자 | 2파 허용 조건 |\n> |---|---|\n> | **IMI강의** | **재료가 아주 좋을 때만** [D-IMI강의-진입-02] |\n> | **상천유니온** | **없다가 생긴 것이고 전 세계 정부·기업이 같이 좋게 보며 동시에 움직이는 재료**(인공지능·로봇·전력 등)라면 2파 눌림까지 [240515] |\n> | **IMI (실전)** | 분봉을 전날부터 이어 붙여 상승 시작점 확인 — **1파 첫 조정이면 가능, 2파 이후면 하지 않는다** [D-IMI-진입-27] |\n>\n> 실전 기준은 **IMI가 가장 보수적(2파도 금지), 상천유니온이 가장 유연(대형 테마면 2파 허용)**이다. **\"한미반도체나 에코프로처럼 4·5파를 넘어가는 종목도 있지만 1년에 몇 개 나오겠는가. 수천 개 종목 중 한두 개이니 철저히 확률에 근거한다\"** [상천유니온 240515].\n\n### 3.3 되돌림 깊이로 강도를 채점한다 [IMI강의 4강·5강 / p.58~61]\n| 되돌림 | 판정 | 대응 |\n|---|---|---|\n| **40%(0.382) 미만** | **얕은 눌림 = 강한 것** | **1파 고점을 뚫는다**고 보고 접근 |\n| **50%(0.5)** | 심리적 기준점, 절반 반납 | 반등이 잘 나오는 구간 |\n| **60%(0.618) 이하로 깊게** | 깊은 눌림 | **1파 고점을 못 뚫을 가능성**이 높다 → **1파 고점 부근에서 익절** |\n\n- **\"오히려 40% 정도까지만 조정받고 오르는 것이 더 강한 것이다.\"**\n- **눈대중으로 충분하다** — HTS 도구를 꼭 쓸 필요 없다. 저점과 고점의 중간이 0.5, 조금 위가 0.382, 조금 아래가 0.618.\n- **하락 파동에서는 고점→저점 기준으로 반대 적용**하되, **하락 중의 반등은 대부분 한시적**이며 이후 더 큰 하락이 나올 수 있다.\n- 실전 표현으로는 **되돌림 폭의 비율로 눌림인지 매도인지 판단** — 절반 넘게 반납하면 매도세, 조정 폭이 작으면 눌림 [D-IMI-판단-02].\n- **강약 판단**: 강한 종목 = **많이 오르고 조정 적게 받음**(매수세>매도세). **\"더 싸 보인다\"고 깊게 빠진 종목을 좋게 보는 건 초보 실수** [IMI 0622].\n\n### 3.4 추세 판정 — 직전 저점·고점\n- **고점·저점 둘 다 낮아지면 하락, 둘 다 높아지면 상승, 유지면 횡보. 직전 저점을 안 깨면 상승 추세 지속**(분봉·일봉·주봉 공통) [IMI 0622].\n- **상승추세 = 직전 저점을 깨지 않는 상태로 우상향.** 이때 저점은 **하루하루의 저점이 아니라 큰 파동에서의 저점**을 본다 [상천 7월].\n- 관점 전환: **상승하는 것은 매수세, 하락하는 것은 매도세** → **매도세가 약해야 상승이 좋다** = **눌림이 적어야 좋은 것** [상천 7월].\n- **상승추세 이탈 확인** = 직전 저점(일봉·분봉) **+** 이동평균선. 이평선에서
