는 데드크로스·역배열 전환이 먼저 발견된다 [주간 0625].\n- **분봉에서 시가 회복 실패 + 직전 저점 이탈 = 하락 추세 시작** [D-IMI-진입-28].\n\n### 3.5 목표가 산출\n- **상승 파동 길이로 가늠한다** — 조정 후 반등 시 **직전 상승폭만큼** 보고, 그 길이가 직전 고점이면 저항 매도, 조정이 짧으면 고점 돌파 가능 [D-IMI5].\n- **단기 목표가 = 직전 고점 또는 상승 1파 길이**만큼 → **미리 매도 예약**을 걸어둔다 [D-IMI-청산-01].\n- **하락 파동도 길이가 비슷하다** → **지지구간 + 하락 파동 길이가 겹치면 양호한 매수 자리** [IMI 0624].\n- **길게 가져가려면** 1파 상승폭 도달 시 **반만 익절, 반은 홀딩**. 되돌아오면 **매입 단가 조금 위에 전량 매도**를 걸어 최악에도 본전 [D-IMI강의-청산-01].\n- **하락 파동 활용**: \"하락 3파까지 나왔고 하락 1파보다 3파의 길이·하락폭이 더 기니까 충분히 조정받았구나\" → **반등 시그널 = 긴 하락파동 + 지지구간 거래량 감소 + 횡보** [p.56].\n\n> **파동만 보고 매매하지 않는다** [p.54]: 파동만 보고 추측으로 매매하면 실패 확률이 높다. 반드시 **지지·저항 / 거래량·거래대금 / 이평선 위치 / 재료 강도 / 피보나치**를 함께 고려한다.\n\n---\n\n## 4. 캔들·거래량\n\n> 거래대금 자체의 기준(150억봉·500억봉 문턱 등)은 **거차재시의 \"거\"** 문서에서 다룬다. 여기서는 **캔들 해석과 지지·저항 판정에 쓰이는 거래량 읽기**만 다룬다.\n\n### 4.1 억봉을 채점하는 법\n\n> ⚠️ **관점 차이 — 500억봉이면 다 같은 500억봉인가**\n\n| 저자 | 입장 |\n|---|---|\n| **제시스페라·차읽남** | 거래대금 500억 또는 150억 발생 자체를 기준봉으로 인정 |\n| **상천유니온 240713** | **\"500억봉이 터졌다고 무조건 좋은 게 아니라, 과거 거래대금과 비교해 어느 정도 수준인가를 확인해야 한다.\"** 그 종목의 **이전 거래대금보다 많이 터졌을 때** 큰 의미 |\n| **월독프 6주차** | **\"150억봉은 약하다\"**(에스티큐브) |\n\n> **해석**: 절대 수치 기준은 스크리닝용이고 **상대 비교가 실전 채점**이다. 두 단계로 쓰는 것이 맞다 — ① 절대 문턱으로 후보를 거른 뒤 ② **과거 최대 거래대금 대비 얼마나 큰가**로 서열을 매긴다.\n\n**차트상 가점을 크게 주는 3종 세트** [상천유니온 240713]:\n1. 그 종목의 **과거 가장 큰 거래대금 대비 이번에 더 큰 거래대금**이 터진 종목\n2. **그날 유동주식수보다 큰 거래량**이 발생한 종목 (손바뀜이 일어났다는 증거)\n3. **과거에 못 뚫던 저항구간을 강하게 뚫은** 종목\n\n→ 이런 종목은 **관종 상단에 올려놓고**, 재료가 일회성이 아니고 테마가 형성됐다면 **반드시 눌림 매매**를 한다.\n\n### 4.2 거래량으로 상승·하락의 성격을 읽는다\n- **상승 시 거래량이 많고 하락 시 거래량이 확 줄어들 때 좋다 = 거감음봉** [IMI강의 4강].\n- **양봉일 때 거래량이 많다 = 산 사람이 엄청 많다 / 음봉일 때 거래량이 적다 = 파는 사람이 적다** → **\"산 사람은 많은데 나간 사람은 없다\"**는 느낌이 들면 좋다 [상천유니온 240502].\n- **장대 음봉이면서 거래대금이 작을수록 좋다** [IMI강의 4강].\n- **모니터링 종목 선정 공식**: 매일 정리하는 상한가·500억봉 종목 중 **① 강한 양봉 후 ② 거래량이 감소한 음봉**이 나온 종목 [IMI강의 4강 p.37~40].\n- **거래량이 실리면서 떨어지고 거래량이 작은 상태로 조금씩 오르는 것** — 팔 놈은 다 팔아서 **사려면 올려서 사야 하기 때문** [월독프 4주차].\n- **적은 거래량으로 저항선이 뚫리는 경우**는 둘 중 하나 — ① 앞에서 한 번 트라이하며 물량을 소화했거나 ② 재료가 강해서 급등 [소와곰 240223].\n\n### 4.3 음봉의 질을 채점한다\n\n| 유형 | 판정 기준 | 결과 |\n|---|---|---|\n| **속임수 음봉** | 하락 시 거래대금 **<** 상승 시 거래대금 | **기술적 반등 잘 나옴** [차읽남 0825] |\n| **차익실현 음봉** | 하락 시 거래대금 **>** 상승 시 거래대금 | **반등 약함** [차읽남 0825] |\n\n- **음봉 개수로도 본다**: 1음봉보다 **2음봉이 안전**(낙폭이 이미 크고 추가 하락 폭도 작음). 2음봉에서 발견하면 **3음봉까지 분할 매수 허용**. 통상 2~3음봉에서 반등이 나오므로 **4음봉은 종목 재평가 신호** [차읽남 1104].\n- **조정봉 완성 신호**: **도지봉 + 거래량 급감 = 매물 소화 완성** [차읽남 0901].\n- **양음양 패턴**: 전날 강한 양봉 → 다음날 거래량 감소 음봉 → 다시 양봉 = 속임수 음봉의 대표형. 전날 **고점(상한가 종가)을 지지하는 음봉**이면 다음날 시세 확률이 높다 [차읽남 220824].\n\n> ⚠️ **관점 차이 — 음봉 거래량이 크면 무조건 피하는가**\n\n| 상황 | 판정 | 출처 |\n|---|---|---|\n| **원칙** | 음봉 거래량이 크면 받지 않는다 | [D-IMI-진입-24] |\n| **예외** | 음봉 거래량이 커도 **돈 들어온 캔들의 1/3도 안 빠지고 중요 지지를 지키면** 재반등 확률이 높다. **\"차트는 거들 뿐, 판단 비중은 시황·재료\"** | [D-IMI-진입-31, IMI 0831] |\n| **고가권 한정** | **상승 2파 고점의 대량 음봉 = 도망 신호**(대형주 한정) → 비중 5~10% 축소 + 칼손절 | [D-IMI-진입-11] |\n\n> **정리**: 같은 \"대량 음봉\"도 **위치**가 판정을 뒤집는다. 1파 조정 구간의 대량 음봉은 지지만 지키면 기회, **2파 고점의 대량 음봉은 도망 신호**다.\n\n### 4.4 상한가 캔들의 유형과 안착 방식\n| 유형 | 설명 | 신뢰도 |\n|---|---|---|\n| **점상한가** | 상한가로 시작해 그대로 마감, 안 풀림 | 최고. 단 **매물 소화가 없어 \"허공\" 구조**라 눌림 매매는 부적합 |\n| **T자형 점상** | 점상 시작 후 중간에 풀림 | 점상보다 낮음 |\n| **롱바디 상한가** | 시가~종가 사이에서 충분히 움직이다 상한가 마감 | **지지·저항·매물대가 풍부해 매매하기 가장 쉬움** |\n\n- **안착 방식이 다음날 지지를 결정한다**: **공방하며 안착(거래량 多) = 지지 강 / 급격하게 안착(거래량 少) = 지지 약** [차읽남 221223·0911].\n- **일자 상승**(조정 없이 상한가) = 매물 소화 없음 → 지지 약함, 급락 가능 [차읽남 0424].\n- **오전에 급격히 상한가** → 매물 소화 부족 → 다음날 3일선이 아니라 **5·8일선**을 준비한다 [차읽남].\n- **억봉의 시가를 깨면 좋지 않은 신호** — 대량거래봉이 발생한 그날의 **시가 자체가 지지선 역할**을 하며, 이후 하락 시 이 가격을 지키는지가 핵심 판단 기준 [차읽남 눌림 정리].\n- 억봉 캔들의 **고가·종가·시가·저가**, 그중에서도 **대량 체결된 부분**의 지지·저항이 잘 작동한다 [IMI강의 4강].\n\n### 4.5 꼬리\n- **밑꼬리를 잡히면서 거래량이 줄어드는 것은 좋은 의미** — 밑꼬리 가격에서 물린 물량이 많은데도 매도가 안 나온다는 것은 **사람들이 팔지 않고 버텨준다**는 뜻 [월독프 6주차].\n- **윗꼬리를 달고 하락했던 종목은 그 패턴이 반복된다** → **저항 구간에 미리 매도 주문을 걸어두는 전략**이 유효 [IMI강의 4강 p.28~31].\n- **1·2일차에 주요 저항선(224일선 등)을 맞고 떨어지며 윗꼬리** → 높은 확률로 장기 하락 [차읽남 25년 강의].\n\n### 4.6 갭 해석\n- **갭이 뜬다 = 시장의 관심이 있다.** **얼마나 떴는지, 어느 위치에서 떴는지**가 중요하다 [월독프 5주차].\n- **가장 좋은 형태 = 갭 뜨고 지지하고 다시 오르는 것.** 다시 오르며 **시초가를 거래량 실리며 뚫을 때 매수하면 컷라인이 시초가**가 되므로 좋다 [월독프 5주차].\n- **거래량 없이 갭만 뜨면 위험하다** [월독프 5주차].\n- **억봉 이후는 갭이 방향을 정한다** [월독프 6주차]: **억봉 후 갭상승이면 좋고, 억봉의 종가를 지켜주면 더 좋다.** 반대로 **억봉 후 갭하락은 리스크 시그널** → **비중을 1/10로 줄이거나 매매하지 않는다.**\n- **갭 상승 시 지지 확인 순서** [차읽남 0204]: ① 시가 지지 여부(지지 시 홀딩) → ② 시가 붕괴 시 전일 종가 → ③ 전일 종가 붕괴 시 거래대금 많이 발생한 자리\n- **갭 하락 시 지지 확인 순서** [차읽남 0204]: ① 거래대금 많이 발생한 자리 → ② 상한가 종가 → ③ 그 다음 주요 지지선\n- **갭 뜬 다음 날의 정석 대응** [상천유니온 240510]: 전날 급등 후 갭이 뜬 종목은 보통 **시가를 깨고 내려갔다가 다시 올라오는 경우가 많다** → **시가를 손절선으로 잡고 시가를 돌파할 때 매수.** 이후 추격 시에는 **분봉상 직전 저점을 무조건 손절선**으로.\n- **갭이 20% 넘게 뜨는 종목은 따라잡지 않는다** — 그건 **보유자의 영역**이다 [상천유니온 240718].\n- **갭이 뜨고 빠지는 종목이 지지에서 더 크게 튄다** — 전일 상한가 몸통 안에서 갭하락으로 시작한 종목보다 반등 확률이 높다(\"높은 곳에서 떨어진 공이 더 크게 튄다\") [IMI 0821].\n- **대형주(시총 조 단위)가 갭 5% 이상 띄우면 매도세가 심하다** — 무리하지 말고 대안을 찾는다. 반대로 **지지하며 살살 올리면 매수 가능** [소와곰 230609].\n\n---\n\n## 5. 일봉 — 자리 판정\n\n### 5.1 위치별 안전성-수익성 트레이드오프 [5강 §7.1]\n| 위치 | 안전성 | 잠재 수익 | 비중 |\n|---|---|---|---|\n| **A — 바닥권 첫 상승 후 눌림** | **가장 안전**(하락폭 최소) | 상대적으로 낮음 | **비중 확대 가능** |\n| **B — 두 번째 자리** | 확률 하락 | 중간 | 비중 축소 |\n| **C·D — 고가권** | 위험(하락폭 큼) | **가장 높음**(신고가 시) | 추가 축소. 단 **거래대금 5천억 이상 + 주도 테마 대장**이면 예외적 비중 베팅 |\n\n> A 자리는 실패해도 손실 폭이 작아 스윙 전환으로 버티기가 가능한 반면, **D 자리는 실패 시 손실이 커 물타기·미손절이 큰 손실로 이어진다.**\n\n- **익일 무반등 시 대응이 위치에 따라 갈린다**: 낮은 자리(바닥권) + A급 이상이면 **자동 스윙 전환**(물타기 없이 원물량 3~4일 대기) / 높은 자리(고가권)면 **즉시 손절** [D-손절-03]. → 상세는 `2_공통운용/손절.md` §4 참조.\n- **박스권을 막 돌파한 첫 자리**는 상대적으로 안전하다(특히 뉴 테마면 며칠 더 버틸 여력) [5강 §7.2].\n- **고가권 주포 이탈 판단**: 음봉이 나와도 거래량이 크게 안 터지면 주포 미이탈 가능성. **거래량이 크게 터지며 밀리는 음봉**이면 경계 [5강 §7.3].\n\n### 5.2 대시세 차트 vs 단기시세 차트 [6강 §7]\n| 구분 | 특징 | 평가 |\n|---|---|---|\n| **대시세 차트** | 바닥권에서 대량 거래량으로 매물 소화 후 박스권 돌파, **최소 6개월 이상의 박스권 돌파 장대양봉** | 계속 상승할 가능성 높음 → **관심종목 등록** |\n| **단기시세 차트** | **역배열 상태**에서 박스권 돌파, 위에 매물대 多 | 매물에 부딪혀 **재하락 가능성 높음** |\n\n> 단발성 테마(개별 종목 단독 호재)에 의한 상승은 집단 테마 대비 힘이 약해 재하락 가능성이 높다.\n\n### 5.3 0/1/2일차 — 억봉 이후 경과일 프레임 [차읽남 220726]\n- **0일차**: 바닥권에서 150억봉·500억봉이 **처음 뜨는 날** → 투심이 시장에 남아있다는 신호\n- **1일차**: 다음날 → **갭 상승 또는 강한 시세가 이어질 가능성** 높음\n- **2일차**: 다다음날 → **조정 시작 또는 추가 시세 여부 확인**\n- 핵심: **0일차 대량거래가 얼마나 투심을 남겼는지가 1·2일차 흐름을 결정** → 이것이 **3일선 매매의 이론적 근거**(150억봉 발생 다음날 = 1일차 = 3일선 눌림 자리)\n\n**일차별 분석 프레임** [IMI강의 5강 p.10~19]: 상한가·500억봉 종목을 경과 일차별로 **같은 3단계 틀**로 분석한다 — ① 캔들과 거래대금 ② 이동평균선 ③ 추세선/파동/피보나치 → 결론은 항상 **\"여러 지표가 겹치는 콜라보 지지 구간에 주가가 위치하는가.\"** 지금 당장 자리가 아니어도 **추후 같은 가격대에 접근할 때를 대비해 시세 알림을 등록**한다.\n\n### 5.4 매물 소화 판정 (일봉 기준)\n- **횡보 기간이 길수록** 매물 소화 완성에 가깝다. **3개월 이하 = 짧음 / 6개월 이상 = 좋음** [차읽남 0204·24년 강의].\n- **역배열 상승 시 큰 거래대금 = 매물 소화 완성의 증거**. 거래량이 적으면 소화 안 됨 → 재하락 [차읽남 0204·220803].\n- 이전 시도(윗꼬리)와 비교해 **횡보 기간·거래대금 모두 증가해야** 신뢰가 올라간다 [차읽남 0204].\n- **대량거래 발생 구간 위로 올라가려면 다시 대량거래가 필요하다** [차읽남 0926].\n- **신고가·저항 돌파에 필요한 거래대금** [월독프 5주차]: 직전 고점을 만들 때의 거래대금을 **어느 정도 소화**해줘야 한다 — 2,000억이었으면 **1,500억 정도는 나오거나 넘어야** 하고, **눌림 구간에 1,000억은 쌓여 있어야** 뚫는다.\n- **120일선·240일선 동시 돌파 상한가 = 강한 바닥권 탈출 신호** [차읽남 0123].\n\n---\n\n## 6. 분봉 — 실행\n\n### 6.1 분봉 3국면 — 먼저 어느 국면인지 판정한다 [IMI강의 5강]\n| 국면 | 전략 |\n|---|---|\n| **상승 파동** | **몇 파인지 보고 눌림목.** 빠른 결과값을 추구하는 단기매매에 적합하며, **분봉상 저항이 지지로 바뀐 자리에서 진입하면 손익비가 매우 좋다** |\n| **횡보 구간** | **관망 또는 박스권 운용**(하단 모아가기·상단 알림 후 돌파매매). **장중 시세 확인이 어렵거나 / 일정이 있는 종목 / 오버나잇 전략**에 적합 |\n| **하락 파동** | 몇 파인지 파악하고 **하락 마무리 신호까지 기다린 뒤** 주요 지지에서 분할. 또는 **하락 추세선을 긋고 돌파할 때·돌파 후 첫 조정**에서 매수. **시세 알림으로 1·2차 지지 도달 알람**을 걸어둔다 |\n\n### 6.2 시간 단위가 길수록 신뢰도가 높다 [상천유니온 240513]\n- **1분봉 < 3분봉 < 5분봉 < 분봉 < 일봉 < 주봉** 순으로 신뢰도 상승.\n- **1분봉의 지지·저항은 너무 쉽게 깨지고 뚫려 신뢰도가 낮아 잘 안 본다.**\n- 실무: **최소 3분봉~30분봉까지 돌려보며** 저항이 지지로 바뀐 자리를 찾는다.\n- **단기 분봉 지지·저항은 단기 관점용**이고, 스윙·장기는 **일봉에서 기간을 길게 보고** 설정한다 [차읽남 0204].\n\n### 6.3 일봉 → 분봉 이식 (매매의 기본 순서)\n**① 일봉 차트에서 먼저 \"매매할 만한 자리인지\"를 본다 → ② 그 구간에 주가가 진입했을 때 분봉을 열어 구체적인 지지구간을 찾아 매매한다** [상천유니온 240705].\n\n- **1차 매수는 분봉상 지지선, 2차 매수는 일봉상 지지선**으로 생각하고, 1차 매수 후 2차 주문을 미리 걸어둔다. 시장이 괜찮고 재료가 좋으면 1차에 비중을 좀 싣기도 한다 [상천유니온 240502].\n- **일봉 지지가격을 분봉에 그대로 옮겨 긋는다** [B-IMI-세팅-10, IMI 0825].\n- 미국 반도체가 약세로 마감했으면 **전날 밤에 일봉·중기 분봉에 지지선을 미리 그어둔다 — 다음 날은 실행만** [E6-IMI-진입-08]. **(장전 작업)**\n- **분봉은 전날부터 이어 붙여** 상승 시작점을 확인한다. 화면에 보이는 구간만 보지 않는다 [D-IMI-진입-27].\n\n### 6.4 시가 — 당일 강도의 기준선\n- **모든 종목·지수는 당일 시가(노란선)를 지키느냐 훼손하느냐가 관건.** 시가를 깨면 하락 신호로 보고 익절·관찰 [IMI 0624].\n- **시가 위/아래로 지수와 종목의 강도를 판단**한다. 시가 이탈은 매도 신호, 갭하락 시작 종목은 **시가 회복 여부**를 본다 [D-IMI-진입-17].\n- **당일 단타는 시가 위에서만** 한다 [D-IMI-진입-14].\n- **이평선이 밀집한 구간에서 시가가 시작되면 좋다** — 여러 이평선의 지지를 동시에 받는 자리 [소와곰 230421].\n\n### 6.5 120분선 — 소와곰 체계 [소와곰 2023~2024]\n> 34개 파일 전체를 관통하는 단일 기준선. **\"갈 놈은 120분선을 깨지 않는다.\"**\n\n- **급등 종목은 120분선을 잘 깨지 않는다.** 반대로 **깨면 회복에 시간이 오래 걸린다.**\n- **120분선을 깨고 다시 뚫어주는 지점도 매수 자리**가 된다.\n- **돌파 패턴**: 120분선이 하향인 상태에서 가격이 횡보하다 뚫으며 오르는 형태. 전제 조건 **전전일 억봉 + 전일 긴 음봉 + 시황·재료 생존** [230407].\n- **손절 컷이 명확해진다** — 120분선 부근 매수 시 컷 라인이 120분선이라 손실이 작다.\n- **단일가(VI) 풀리는 날에는 시가와 120분선만 보고 매매**한다.\n- **상한가 종목이 갭을 안 띄우고 횡보하면 1분봉 기준 120분선에서 타점**이 나온다 [241018].\n- **급등 후 조정에서 120분선과 만날 때마다 분할 매수하고 갭 구간 상단에서 매도**하는 운용도 가능 [241004].\n- 참고: IMI강의도 **분봉 기준선으로 120분선을 지정**한다(1분봉·3분봉 모두) [IMI강의 4강] — 두 출처가 독립적으로 같은 선에 도달했다.\n\n**VI 라인 규칙** [소와곰 230915]: **VI 발동 시의 종가와 VI 시가를 지켜주는지 본다. 둘 다 뚫리면 즉시 도망친다.** 하락하더라도 VI 시가·직전 종가를 찍고 반등하는 경우가 많다. **\"갈 놈은 VI 라인을 깨지 않는다.\"**\n\n### 6.6 돌파 직전에 확인하는 분봉 신호 [상천유니온 240719]\n- 저항구간인데 **주가를 크게 빼지 않고 몇 분간 횡보하면서 물량을 받고 있고**, 장 초에 큰 돈도 들어왔다면 **분봉상 고점을 뚫겠다**고 판단한다.\n- **돌파 전에 큰 물량을 소화하면서 분봉 거래대금이 막대그래프처럼 쭉쭉 올라와 앞 고점의 거래대금을 넘어설 것처럼 보이면** 매수.\n- **\"그 저항의 맥점에서 큰 물량을 빠바바박 빠르게 잡아먹느냐가 중요합니다.\"**\n- **야금야금 올라가는 분봉이 지지가 잘 나온다** [IMI 0824·0826].\n- **분봉 꼭지를 피하는 습관이 수익률을 가른다** [IMI 0826].\n\n### 6.7 분봉의 진짜 용도 — 매도 타점\n> **\"분봉이 특별한 의미를 갖는 순간은 '여기서 시세가 더 나올까?', '저항선을 돌파할 수 있을까?'를 고민할 때뿐이다. 분봉 공부의 목적은 매도 타점 정교화다.\"** [월독프 6주차 / 차읽남 24년 강의 — 두 출처가 같은 취지의 문장을 쓴다]\n\n- **급등 종목은 분봉 5·10일선을 타고 오르는 경우가 많다** → **5일선 이탈 50% 매도 / 10일선 이탈 전량**. 지수가 약세면 **5일선 이탈 시 전량** [IMI강의 4강 p.41~47].\n- **갭 뜬 보유 종목의 매도법** [상천유니온 240718]: 9시부터 1분봉을 켜놓고 **3일선 이탈 시 절반, 5일선 이탈 시 나머지 절반**. 또는 **현재가가 직전 양봉 캔들의 절반까지 빠지는 분위기면 다 던진다.**\n- **매도 기준을 정하는 3가지 방법** [상천유니온 240513]: ① 추세선을 긋고 이탈하면 매도 ② 그 종목이 과거에 계속 안 깨고 올라온 이평선 기준 ③ 고점 찍고 눌렀다 다시 올라갔다가 **직전 저점을 깨고 이탈할 때.** 분봉 단타도 마찬가지로 **\"여기 깨면 매도해야지\"를 계속 올려친다.**\n\n### 6.8 NXT 차트 왜곡 주의\n- **KRX 일봉 기준으로 지지·저항을 설정**하고, **NXT + KRX 통합 분봉**으로 확인한다 [차읽남 0523·0617].\n\n---\n\n## 7. 실행 순서 요약\n\n### 장전\n1. 관심종목의 **일봉에서 매매할 만한 자리인지** 먼저 판정 [상천유니온 240705]\n2. 지지·저항 구간에 **라인을 긋고, 같은 라인을 분봉에도 이식** [상천유니온 240513, IMI 0825]\n3. 겹치는 **콜라보 구간**을 표시하고, 지금 자리가 아니면 **시세 알림 등록** [IMI강의 5강]\n4. **몇 파인지 확인** — 3파 구간이면 후보에서 제외 [IMI강의 4강 p.53]\n5. 억봉 종목은 **과거 최대 거래대금 대비 이번 거래대금**으로 서열 [상천유니온 240713]\n6. **그 종목의 과거 패턴** 확인(윗꼬리 반복? 특정 이평선에서 반복 지지?) [IMI강의 4강 p.28~31]\n\n### 장중\n1. **분봉 3국면** 중 어디인지 먼저 판정 [IMI강의 5강]\n2. **시가를 지키는지**로 당일 강도 판단 [IMI 0624·0826]\n3. 지지구간 도달 시 **호가창 매수세가 받쳐주는지** 확인 — 예측이 아니라 **지지 확인 후 진입** [월독프 5주차]\n4. **매수 버튼 직전 3초 자문: \"지금 이 자리는 지지구간인가, 저항구간인가?\"** [IMI강의 4강 p.13~14]\n5. 지수가 약세면 **지지를 한 번 더 깰 수 있다는 전제**로 1차 비중 축소 [IMI강의 4강]\n6. 보유 중에는 **직전 저점을 계속 갱신**하며 이탈 여부 감시 [D-IMI강의-손절-01]\n\n> **왜 실전에서는 반대로 하게 되는가** [IMI강의 4강 p.13~14]\n> 장 마감 후의 이성은 \"지지에서 사야지, 저항에서 팔아야지\"인데, 장중의 감정은 \"저항 구간이긴 한데… 더 오를 것 같아\", \"지금 안 사면 놓칠 것 같아!\"로 바뀐다. 결과적으로 **저항에서 사고 지지에서 파는 실수**를 반복한다. → **3초 자문**이 유일한 해결책.\n\n---\n\n## 8. 차트 실력을 올리는 법\n\n- **상한가·거래대금 500억 종목의 차트를 매일 보고 직접 선을 긋는다** — 차트 실력을 가장 빠르게 올리는 방법 [IMI강의 5강 p.4].\n- 일봉·분봉에서 **지지·저항 구간을 직접 찾아보고 선을 그어보는 연습**을 장중이든 장 종료 후든 무조건 많이 한다 [IMI강의 4강 p.9~11].\n- **지표 활용은 공식이 아니라 직관을 키우기 위한 훈련이다.** 지표를 쓰는 목적은 정답을 찾는 게 아니라 **매수·매도할 만한 자리인지 판단할 근거를 찾는 과정** [IMI강의 5강 p.27].\n- **차트 공부용 태그 분류 체계** [월독프 9주차]: **[상승봉](500·150억봉 0/1/2일차) · [5~8일선] · [15일선] · [33~45일선] · [120일선] · [바닥] · [급락] · [단기과열 예고] · [단기과열] · [투자경고] · [투자위험]**. 하루 중 일정 시간(예: 12~14시)을 이 분류에 고정 배정하면 **\"분류와 기준이 정해진 뒤로는 관점이 생겨 눈에 들어오기 시작\"**한다.\n- **시간이 부족하면**: 전날 준비한 **거차재가 완성된 종목** 중에서만, **지지·저항 + 캔거이 추파피** 조합으로 판단하고, **매매 횟수를 줄이고 시세 알림을 적극 활용**하며 **살(팔) 만한 자리에서만** 매매 [IMI강의 5강 p.22].\n\n---\n\n## 부록 — 참조 원문 위치\n\n| 저자 | 원문 블록 (`2차 종합/D_차트·파동.md`) |\n|---|---|\n| 제시스페라(베이스) | D1~D5 (10~135행) — 파동 3종, 매물대·지지저항, 봉 위치별 전략 |\n| IMI(날짜별) | D-IMI1~6 및 날짜별 추가 (151~660행) |\n| 차읽남(개별 복기) | 지지·저항 자리 ~ 섹터눌림 (220~410행) |\n| IMI강의 4·5강 | 665~1,002행 (지지·저항 정본, 분봉 3국면, 일차별 프레임) |\n| 상천·상천유니온 | 984~1,218행 (돌파 심리, 거래대금 채점, 콜라보 절차) |\n| 월독프 | 1,219~1,317행 (이평선 전투 체계, 갭·억봉, 호가창) |\n| 소와곰 | 1,318~1,377행 (120분선, 디마크, 급락 3단계, VI 라인) |\n| 차읽남(정식 강의) | 1,378~1,438행 (차트만으로는 안 된다, 매물대, 지지선 설정 원칙) |\n\n---\n\n## 변경 이력\n- 2026-09-06: 최초 작성. `2차 종합/D_차트·파동.md`(1,438행) + `cards_D`를 8개 주제로 통합. 관점 차이 7건 병기.\n"}, {"label": "[거차재시] 재료", "file": "1_거차재시/재_재료.md", "md": "# 3차 거차재시 — 재: 재료\n\n> **문서 성격**: 거차재시 4축 중 **재료** 판단을 저자별로 흩어진 상태에서 주제별로 통합한 문서.\n> 공통되는 부분은 합치되 출처를 병기했고, 저자마다 결론이 갈리는 부분은 삭제하지 않고 `⚠️ 관점 차이`로 나란히 적었다(00_운영규칙 §6).\n> 원문: `2차 종합/C_종목선정.md`(1,386행) + `E5_뉴스매매.md`(259행) + `2.5차 규칙카드/cards_C·E5`.\n> **뉴스 매매 전략 자체**(뉴스 돌파·리바운드 진입 타이밍)는 `3차 활용/E5_뉴스매매_가이드.md`에서 다룬다. 여기서는 **재료를 판별·채점하는 기준**만 다룬다.\n\n---\n\n## 1. 재료란 무엇인가\n\n- **\"재료란 주식을 상승시키는 뉴스 및 이유이며, 재료의 핵심은 '있다가 없어지거나 없다가 생긴 것' — 즉 기대감이다\"** [월독프 4·5주차].\n- **\"상승 전에 찾으면 재료, 상승 후에 찾으면 상승의 이유\"** — 재료 자체보다 **매매 이전에 포착했는지**가 갈린다 [월독프 5주차].\n- 인과 순서: **재료 하나 부각 → 같은 재료 종목군 단체 급등 → '테마' 형성 → 시황이 맞아떨어질 때 강도·기간이 커진다** [월독프 5주차].\n- **\"쉬운 것은 거래대금·상한가 조회와 차트 학습이고, 어려운 것은 재료가 얼마나 강한지 판단하는 능력과 시황을 매매로 연결하는 과정이다.\"** → **공부 시간을 어디에 써야 하는지**를 알려주는 대목. 차트에 시간을 다 쓰지 말 것 [IMI강의 2강 p.20].\n\n> ⚠️ **관점 차이 — 재료가 먼저인가 차트가 먼저인가**\n>\n> | 저자 | 입장 |\n> |---|---|\n> | **상천 8월** | **\"재료가 가장 중요하다. 거래대금은 평소보다 확 높으면 가점을 준다.\"** → 재료가 본체, 거래대금은 가산점 |\n> | **월독프 5주차** | **재료는 차트 컨디션에 좌우된다** — 같은 재료라도 **차트상 매도세가 적은 자리, 잘 조정받은 자리**일 때 훨씬 잘 부각된다. 단기 투자에서는 **실적보다 \"차트의 위치 + 재료\"가 우선** |\n> | **차읽남 24년 강의** | **재료·거래량·시황이 함께 있을 때, 마지막 5%의 퍼즐을 맞추기 위해 차트가 존재한다** |\n>\n> **해석**: 순서가 아니라 **역할**이 다르다. 재료는 **\"오르는 이유\"를 만들고**, 차트는 **\"어디서 살지\"를 정한다.** 세 저자 모두 재료 없이 차트만으로는 안 된다는 데는 일치하며, 월독프만 **\"재료가 부각되는 정도 자체가 차트 위치에 달렸다\"**는 한 단계 더 나아간 주장을 한다.\n\n---\n\n## 2. 재료 판별 축 — 무엇을 보고 채점하는가\n\n> ⚠️ **관점 차이 — 4축의 마지막 한 자리가 다르다**\n\n| 출처 | 4축 |\n|---|---|\n| **IMI강의 2강** | **신선함 · 연관성 · 지속성 · 확장성** |\n| **상천 6월·8월** | **신선함 · 연관성 · 확장성 · 펀더멘털 변화** |\n\n> 공통은 **신선함·연관성·확장성** 3개이고, 나머지 한 자리를 **\"얼마나 오래 가는가(지속성)\"**로 볼지 **\"실적을 바꾸는가(펀더멘털)\"**로 볼지가 다르다. **단기 매매는 지속성, 스윙 이상은 펀더멘털** 관점으로 이해하면 충돌이 아니다.\n\n### 2.1 신선함 — 없다가 생긴 것인가\n- 신선한 재료 예: **\"중국, 한류 금지령 해제\"**, **\"트럼프 대통령이 알래스카 LNG 프로젝트를 추진한다\"** [IMI강의 2강 p.24~29].\n- **재료가 신선한가, 식상한가, 소멸인가**를 먼저 판정한다 [월독프 4주차].\n\n> ⚠️ **관점 차이 — 재탕 재료는 무조건 죽은 재료인가**\n>\n> - **제시스페라 [3강 §7]**: **재탕 뉴스 확인** — 동일·유사 뉴스가 과거, 특히 **직전일에 이미 보도된 적 있는지** 점검. 재탕임을 시장이 인지하면 **매물이 쏟아져 급락**한다.\n> - **상천 6월**: **\"상했다가도 시간이 흐르고 잊혀지면 다시 신선해질 수 있다.\"**\n> - **IMI 0622 (실제 사례)**: LG그룹주 — 경영진 NVIDIA 본사 방문으로 **\"단기 재료 소멸\"이라며 빠졌던 협업이 진행 과정 후속 기사로 재반등**한 실제 사례.\n>\n> **해석**: **경과 시간**이 갈림길이다. **직전일~며칠 내 재탕은 급락 재료**, **충분히 잊힌 뒤의 재등장은 신선도 회복**. 판정 기준은 §4의 \"재료가 아직 살아있는지 판정하는 3가지\"를 쓴다.\n\n### 2.2 연관성 — 실제로 수혜인가\n- **해당 기업이 실제로 수혜인가**를 본다. 예: 중국 한류 금지령 해제 시 → **중국 매출이 있는 화장품 기업 vs 없는 기업**을 구분 [IMI강의 2강].\n- **직접 수혜**인지 본다. **자회사는 좀 더 약하다** [상천 6월].\n- **관련주 안에서도 재료의 결을 나눈다** — 같은 테마라도 실체가 다르다(오픈엣지테크놀로지는 CXL **IP**, 퀄리타스는 실제 CXL **개발**) [월독프 5주차].\n- **호재 주체가 비상장이면 지분 구조를 확인해 실제 움직일 상장사를 특정**한다 [C-IMI-선정-26].\n\n> **⚠️ 연관성의 예외 — 정치 테마주**\n> **정치 테마주는 연관성을 따지지 않는다(\"그냥 오르면 답이다\")** [IMI강의 2강]. 인맥·학연 같은 단순 연관성만으로도 오른다 — 같은 대학 출신이라는 이유, 과거에 한 번 만난 기록만으로 관련주로 묶이는 경우.\n> 차읽남도 같은 취지: **\"관련주로 엮인 이유보다는 시장의 반응이 중요\"** — 오리엔트정공은 이재명 대표 근무처와 **사명이 비슷하다는 이유만으로** 인맥주로 분류됐지만 실제 시장 반응이 중요했다 [차읽남 25년 강의].\n\n### 2.3 지속성 — 앞으로도 이어지는가\n- **지속성 없는 이슈**: **기업의 호실적 발표**(발표로 끝, 향후 일정 없음) [IMI강의 2강].\n- **지속성 있는 이슈**: **대왕고래 프로젝트**(정부가 석유 시추 가능성 높은 곳을 찾는 사업 — 진행 단계가 계속 남아 있음) [IMI강의 2강].\n- **단발성 재료 vs 지속 재료**를 구분한다 [상천유니온 240501].\n- **스윙 가능/불가 구분** [IMI강의 2강 p.39]: **스윙 패스** = 질병(코로나 등) 테마 — 이벤트성이라 사그라들면 끝 / **스윙 가능** = 보안 테마 — 구조적으로 반복 부각.\n\n### 2.4 확장성 — 규모가 커지는가\n- **확장성이 있는 이슈는 더 강한 상승을 만든다**: **LA 산불**(다음 날 옆 지역까지 번짐), **코로나**(중국 환자 1명 → 일주일 뒤 국내 확진자 발생, 환자 수 급증) [IMI강의 2강 p.24~29].\n- **내수냐 수출이냐**로 확장 가능성을 본다 [상천 6월].\n\n### 2.5 펀더멘털 변화 — 실적·이미지를 바꾸는가 [월독프 4주차 / 상천 6월]\n자문 3가지:\n1. **실적을 바꿀 수 있는 재료인가**\n2. **회사의 이미지를 바꿀 수 있는가**\n3. **회사의 숫자(실적·시총)를 바꾸거나 회사를 포장할 수 있는가**\n\n> **이미지 전환의 대표 사례**: **레인보우로보틱스는 잡주였다가 삼성이 붙으면서 대장이 됐다.** 같은 구조로 뉴로메카·대동(포스코), 이랜시스(삼성), 에스피지(현대)를 본다 [월독프 4주차].\n\n---\n\n## 3. 재료의 크기를 재는 법\n\n### 3.1 정책 재료 — 키워드·금액·발표자 급 [상천 8월]\n같은 정부 정책 재료라도 크기가 다르다. **댐 vs 대왕고래** 비교 기준:\n- **키워드의 힘** — \"댐\"이 \"대왕고래\"보다 약하다\n- **금액 규모** — 대왕고래 쪽이 컸다\n- **발표 주체의 급** — **대왕고래는 대통령, 댐은 장관급**\n- 실제 결과: **댐은 주가가 간 적도 없다.**\n→ 정책 재료는 **키워드·금액·발표자 급**으로 **미리** 크기를 가늠할 수 있다.\n\n### 3.2 키워드 조합으로 채점한다 [IMI 241010]\n- KTcs 사례: \"KT, 마소와 손잡고 한국형 AI 만든다. 5년간 수조 원대 파트너십\" → **\"MS, AI, 수조원. 키워드 모두 좋음.\"**\n- 재료 문장에서 **핵심 키워드를 뽑아 각각의 힘을 평가**하고, **좋은 키워드가 여러 개 겹치면 강한 재료**로 본다.\n- **확정형 강력 키워드**의 예: \"보스턴다이내믹스\"(우림PTS, 상한가 직행), \"삼성전자\"(노타) [E5 케이스].\n\n### 3.3 수치를 시가총액과 비교한다 [3강 §15]\n- **뉴스 수치 vs 시가총액 비교** — 계약 규모의 **상대적** 임팩트를 본다.\n- 정석 사례: **ABL바이오 — 시총 5.3조 대비 계약 3.8조 → 2분 만에 상한가** [E5 케이스, 2025.11.12].\n\n### 3.4 기대감의 크기로 잰다 [월독프 4주차]\n- **재료의 크기 = 기대감의 크기**이며, **대장주가 몇 개의 종목을 끌어올리느냐**로 측정한다.\n- 기대감은 **구체적인 숫자가 나올 때**, 혹은 **상상할 수 없을 정도로 클 때** 강하다.\n\n### 3.5 제목의 자극성 [3강 §6]\n- 가장 중요한 단일 요소 — **식상하지 않고 신선하며 자극적인 제목**일수록 시장 반응이 강력하다. **\"읽는 순간 '헉' 하는 느낌이 들어야 좋은 제목.\"**\n\n> ⚠️ **관점 차이 — 제목의 자극성 vs 시황·테마 우위**\n> 제시스페라는 제목의 자극성을 **가장 중요한 단일 요소**로 두지만, 같은 강의의 실증 사례가 이를 뒤집는다 — **지투지바이오(2025.11.13)**: ABL바이오發 \"바이오의 날\" 환경에서 **밋밋한 제목(\"목표가 38만원 상향\")**의 호재도 거래량 폭증 + 신고가 + VI로 이어졌다(거래대금 3,700억). → **제목의 자극성보다 시황·테마 우위가 우선**한다는 것이 강의 자체의 결론 [8강 §15.6].\n> 같은 취지: **\"그날 가장 강한 테마와 관련된 뉴스로 매매해야 확률이 가장 높다\"** [3강 §6.2].\n\n### 3.6 재료 세기를 상승률로 정형화한다 [3강 §8.3]\n- 매수 전 **\"이 재료는 몇 %까지 상승 가능한가\"**를 본인 기준으로 미리 설정한다(예: 상한가 재료, 20% 재료).\n- 이 기준이 있으면 **일시적 흔들림(평단 이하 포함)에도 홀딩 가능** — 일반 돌파매매와 차별화되는 핵심 장점.\n- 후보 종목들의 **재료 세기에 서열을 매겨** 둔다 [IMI강의 2강].\n- 재료는 **신선함·연관성·지속성·확장성으로 채점해 서열**을 매긴다 [C-IMI강의-선정-02]. **(장전/퇴근 후 작업)**\n\n---\n\n## 4. 재료의 수명 — 아직 살아있는가\n\n### 4.1 유효성 판정 3가지 [IMI 241014]\n1. **시간이 얼마나 지났는지**\n2. **다른 주도주가 나왔는지**\n3. 차트 조건: **전 저점을 깨면 안 본다. 15일선이 깨지면 안 본다.**\n\n### 4.2 하락 모양으로 판별한다 [IMI 241213]\n- **재료가 끝났으면 쭉 빼버린다.** 그런데 **저점을 올리면서 횡보하는 모습**이면 재료가 아직 살아있는 것(대성창투).\n- 같은 판정: 갭이 뜨고 빠지는데도 **주가가 계속 버텨주고, 디마크 상단과 3분봉 120분선을 지켜주면** 재료가 살아있는 것(일신석재).\n\n### 4.3 신선도 하락의 메커니즘 [D-IMI4]\n- **테마는 생긴 날부터 신선도가 하락한다.** 한 번도 없던 테마(스페이스X)는 지속성이 길다.\n- **테마가 실제로 이루어지면 재료 소멸로 제자리 회귀**한다(안 돌아가려면 실적이 뒷받침돼야 한다).\n- **상장 = 기대감 소멸 = 재료 소멸.** 상장날 사는 건 반대 행동이다.\n- 실전 관찰: **유리기판은 좋은 기사가 지속되나 반응이 미미** → 재료 신선도 하락(식상) [IMI 0622].\n- **이벤트·발표 일정은 가까울수록 재료가 식상**해진다 → **미리 익절, 당일 당시각 매수 금지** [A-IMI-진입-05].\n\n### 4.4 재료 소멸 = 거차재시 4조건 중 하나가 무너진 것 [IMI강의 3강 p.26~27]\n- 사례: **'퓨리오사AI 인수'** 재료로 급등하고 500억봉도 발생해 관종에 등록됐던 종목. 전일 큰 음봉 + 일봉상 지지 구간이라 \"내일 반등이 나올 수도\" 싶은 자리였다.\n- 그러나 확인해보니 **메타의 퓨리오사AI 인수 재료가 이미 소멸**된 상태 → **거차재시 네 조건 중 하나가 무너진 상황.**\n- 판단: **차트상 기술적 반등은 나올 수 있지만, 단기 매매 기준에 따라 관심종목에서 바로 제외**한다.\n- **원칙: 상승 이유였던 기존 재료가 유효한지, 악재는 없는지 확인하는 과정이 매수 판단보다 먼저다.**\n\n**15일선 이탈 후 대응 — 기계적으로 자르지 않는다** [IMI강의 3강 p.28~31]\n\n| 사례 | 15일선 | 판단 | 이유 |\n|---|---|---|---|\n| **YG PLUS** | 이탈 | **관종 유지** | '한한령 해제' 기사가 최근까지 자주 등장하고 기대감 유효. 게다가 **일봉상 직전 저점은 지켜주고** 있음 |\n| **클로봇** | 이탈 | **즉시 삭제** | 소속된 **로봇 테마가 이미 3개월 이상 상승해 바닥 대비 약 3배**. 재료·테마는 시간이 지날수록 신선도가 떨어져 **좋은 기사가 나와도 시장 반응이 둔해진다** |\n\n> 결론: **기계적 제외가 아닌 유연한 판단.** 차트 기준(15일선·직전 저점)이 깨져도 **재료가 유효하고 기대감이 살아 있으면 관찰로 전환**한다.\n\n### 4.5 재료의 반응 시한 [소와곰 240322]\n- **좋은 기사가 나오면 갭이 떠야 한다.** 갭이 뜬 후 눌림에서 사고, **눌린 뒤 재료가 좋다면 10시 전후에는 살아나야 한다.**\n- **전일에 나온 기사라면 당일 11시까지는 시세가 나와야 한다.** 안 나오면 **갭 뜨고 하락한 뒤 다시 돌리는 모양**이라도 나와야 유효하다.\n- 같은 취지 [3강 §8.2]: 뉴스로 매수했는데 **후속 매수세가 안 들어오고 빠지면 즉시 손절.** **\"내 생각이 좋아 보여도 시장이 동의하지 않으면 주가는 빠진다.\"**\n\n### 4.6 재료가 나온 지 며칠 지났으면 [C-IMI-선정-21]\n- **첫날 이유만으로 판단하지 말고 회의론까지 포함해 최신 시황을 재확인**한다.\n- **첫날 재료로 끝내지 말고 시황을 계속 업데이트한다** [IMI 0826].\n- **관리 섹터별 요인값 키워드로 검색**해 시황을 갱신한다. 3층 구조로 관리: **시장 전체 / 섹터 / 개별 종목** [A-IMI-판단-02]. **(매일 저녁·장전 작업)**\n\n---\n\n## 5. 뉴스·공시를 읽는 법\n\n### 5.1 제목과 내용은 다르다 [소와곰 230526]\n- **\"특징주는 제목과 내용이 미묘하게 다른 경우가 있다.\"** 예: 제목은 **\"협업\"**인데 내용은 **\"협의\"**(아직 확정 아님) → 상승 후 급락.\n- **특징주 기사인지, 회사 IR 자료인지, IR을 가장한 특징주인지**를 구분해서 읽는다.\n- **뉴스는 첫 문단만 읽어도 세기를 판별할 수 있다** [상천유니온 240516].\n- **같은 뉴스가 처음이 아닐 수 있다** — 반복 여부를 확인한다 [상천유니온 240516].\n\n### 5.2 실체 없는 공시를 거른다\n- **제목만 화려하고 알맹이 없는 경우**(\"검토 중\", \"예정\" 등) 주의 — 삼천당제약 사례 [3강 §7].\n- 강한 키워드 공시였으나 본문에 **계약금액이 \"유보\"·\"추후 공시\"** 처리 → 소량 매수했더라도 즉시 손절하고, 익일 추가 뉴스가 나와도 그 종목은 **\"위험 종목\"으로 재평가** [C-손절-03, 노타 2025.12.29].\n- **공시는 숫자를 직접 확인한다** [IMI강의(구) 4강].\n- **글로벌 기업과의 직접·확정적 계약**(공시 기반, 규모 명시)이면 강한 상승 가능성 — ABL바이오-일라이릴리 3.8조 기술이전, 보스턴다이내믹스 부품공급 계약 [3강 §8.1].\n\n### 5.3 선취매 흔적을 본다\n- 일부 종목은 **뉴스 공표 전 이미 매수세가 유입된(선취매) 흔적이 분봉에 나타난다** → 매수 자제, 뒤늦게 인지 시 동반 이탈 [3강 §8.4].\n- **기사가 나오기 전에 이미 올라 있었다면 선취매가 있었던 것** → 기사 후 오히려 하락할 수 있으니 사지 않는다. **기사 후에 오르기 시작하면 선취매가 없었던 것** → 더 갈 여지가 있다 [소와곰 230602].\n- **진짜 좋은 IR은 눌리지 않고 바로 날아간다. 애매하면 다 던져진다.** 기사 전 가격을 깨지 않고 **1~3% 인접했다가 상승하는 패턴**이면 진짜로 본다 [소와곰 230609].\n\n### 5.4 매체·시점을 본다 [3강 §15]\n- **매체별 반영속도 차이** — HTS뉴스 / 인터넷뉴스 / 단독뉴스 / 특징주뉴스 / 보도자료. **동일일 다수 뉴스는 보도자료 배포 가능성**을 시사한다.\n- **상승 이유를 찾는 검색법: `특징주 + 종목명`** [IMI강의 3강].\n- **하락 이유가 이상한 뉴스**(\"가족 내부의 오해\" 등)라면 **노이즈로 판단**하고 반등을 기대한다 [소와곰 230407].\n\n### 5.5 재료 노출 여부로 발표 후 방향을 가른다 [A-IMI-판단-05]\n- 오늘 예정된 발표·이벤트가 **이미 기사로 돌고 있는가**를 확인한다. 돌고 있다면 **노출된 재료** → **시장 예상을 압도적으로 넘지 않으면 발표 후 급락**으로 전제하고 진입 계획을 짧게 잡는다.\n- **가이던스 개념**: 실적은 절대값이 아니라 **증권사 예상치를 압도적으로 상회하는지**가 관건. 잘 나와도 **가이던스 하회 시 셀온** [주간 0625].\n- **선반영 뉴스 매매**는 발표가 기대에 미달하면 급락 위험이 크다 [3강 §4].\n\n### 5.6 \"관련주\" 세 글자 [3강 §5]\n> **\"새로운 뉴스를 봤을 때 머릿속에 '관련주'라는 세 글자를 무조건 떠올려야 한다.\"**\n\n뉴스를 접한 사람은 둘로 나뉜다 — ① 단순 정보로 받아들이고 끝내는 사람 ② **즉시 관련주를 찾는 사람.**\n\n**숙달을 위한 3가지 습관** [3강 §5.3]:\n1. 매일 장 마감 후 기록 — 당일 특징주·주요뉴스를 **신규/재탕 여부·상승률**과 함께 정리\n2. 섹터·종목 분석 — 수혜 섹터·종목, **대장주·후발주 구분**\n3. 과거 이슈·히스토리 정리 — 동일·유사 종목의 **과거 유사 이슈 발생 시 상승률 데이터 축적**\n\n- 발굴 훈련: 매일 장 종료 후~다음날 아침까지 나온 기사를 확인하고, **기사 하나에서 관련주를 역추적**하는 연습을 반복 [월독프 5주차].\n- 공부의 도달점: **뉴스를 안 보고 종목으로 뉴스를 예측한다** [상천유니온 240521].\n\n---\n\n## 6. 재료가 퍼지는 방식 — 관련주와 서열\n\n### 6.1 대장주와 2등주의 역학 [월독프 4·6주차]\n- **대장주가 높다고 겁먹으면 안 된다.** 대장주가 상승해야 2등주가 상승하고, **대장주가 2% 하락하면 2등주는 4% 하락한다.**\n- **대장주 = 각 테마에서 가장 많이 거래되는 종목.** **상승폭은 2·3등주보다 크고, 하락폭은 2·3등주보다 작다**(방어력).\n- **대장주가 3~5연상·단기과열 등 강한 상승 후 역사적 고점에 위치하면, 대장주는 횡보하며 코어주로 변한다.** 이후 **대장은 횡보하고 2~5등주가 강세**를 보인다.\n- **히든(후발주)이 가는 조건**: 대장주가 **상한가에 들어 있고 + 시장에 돈이 많고 + 장 초반에 움직일 때.**\n- **2등주 매매는 대장주를 보면서 해야 한다.**\n- **복기 원칙: \"거차재시가 맞았더라도 섹터의 주도주·대장주가 아니면 깔끔한 매매라고 볼 수 없다. 대장주를 매매하자\"** [월독프 5주차, 오픈엣지 vs 퀄리타스 사례].\n\n### 6.2 동일 재료의 확산 신호 [IMI 241008·241113·241114]\n- 대장이 **시간외 상한가**를 만들어주면 그 테마로 다른 종목이 오를 수 있다고 판단(펩트론 → 대봉엘에스).\n- **같은 재료로 다른 종목이 상한가(쩜상)면** 아직 살아있는 것으로 보고 후속주를 매매(아주IB ↔ 미래에셋벤처투자).\n- **실시간 조건검색에 특정 종목이 상위권으로 오르고 섹터에 돈이 들어가면** 그 섹터에서 **가장 강하게 오른 종목**을 본다(한화오션 → 일승).\n- 대장이 반등을 시작하면 같은 섹터 2등주도 지지구간을 체크해 진입(**짝꿍 매매**) [C-IMI-선정-20].\n\n### 6.3 뉴 테마 3타순 법칙 [8강, 2025.12월]\n- **새 테마는 3번째 종목까지 강하게 작용하고, 4번째부터 약화**된다(삼성에피스홀딩스 → ABL바이오 → 에임드바이오).\n- 같은 취지: **동일 호재로 동시 상한가가 떴다면 1~2번째 종목은 강하고 그 이후는 약해지는 경향**이 있다 [짝짓기 매매].\n- **테마는 1·2등주만** [C-IMI-선정-09].\n\n### 6.4 키맞추기 — 피어그룹 비교 [소와곰 230714]\n- 같은 업종의 **시총과 영업이익을 비교해 저평가된 종목**을 찾는다(PCB: 이수페타시스·코리아써키트·대덕전자 / 디자인하우스: 가온칩스·에이디테크놀로지).\n- **키맞추기가 성립하려면 대장이 먼저 광기로 들어가 돈을 퍼뜨려야 한다.** **대장이 미지근하면 후발주 키맞추기도 안 온다.**\n- **모회사-자회사 연쇄**: 자회사가 쩜상이면 모회사를 따라 산다(이수스페셜티케미컬 → 이수화학).\n- **후발주 추종 시 대장의 상태를 계속 본다** — **대장의 상한가가 풀리고 하락하면 후발주도 무조건 정리**한다.\n- **1등이 안 가고 후발주가 가면 보내줄 것** [C-IMI-선정-11·12].\n\n### 6.5 시세를 주는 종목의 4가지 조건 [월독프 9주차]\n시세를 주는 종목은 ① **최근에 강했거나** ② **전날에 강했거나** ③ **새로 나오거나** ④ **일정이 있거나** 넷 중 하나다.\n→ 테마를 쭉 적어놓고 각각 **고점 / 바닥 / 관심 소외 / 일정**의 어디에 있는지 적어본다.\n\n---\n\n## 7. 유형별 특수 규칙\n\n### 7.1 FDA·바이오 [월독프 6주차]\n- FDA 의료기기는 **Class 1(일반 규제: 의료용 장갑·붕대) < Class 2(특별 규제: 콘택트렌즈) < Class 3(시판 전 허가 PMA 필요: 심장 밸브·혈관 스텐트)** 순으로 임팩트가 커진다.\n- **Class 3는 FDA 승인(PMA)을 받아야만 시장 진입이 가능**하므로 재료로서 가장 확실하고 크다.\n- **미국과의 '시간차'를 이용한다** — 해외 임상·허가 뉴스가 국내 관련주에 반영되기까지 시차가 있다.\n- **바이오 신규주 이슈 우선순위**: ① 기술이전(금액 큰 것) ② FDA 승인·임상 3상 통과 ③ 항암 ④ 탈모 ⑤ 비만 [차읽남 25년 강의].\n- **바이오도 개발에 성공해도 기대감이 이미 0으로 수렴했으면 주가는 무반응**이다(SK바이오사이언스) [월독프 1주차].\n\n### 7.2 실적 [월독프 1주차 / 차읽남 25년 강의]\n- **주가는 (유동성 + 실적) × 기대감**이다. **유동성과 실적이 아무리 좋아도 기대감이 0이거나 마이너스면 주가는 움직이지 않거나 빠진다.** 곱셈이기 때문이다.\n- **실적 발표 시즌 전 주가 위치가 중요** — 발표 전 **차트가 고점이면 이미 선반영돼 발표 시 하락**, **저점이면 이슈로 상승 가능**.\n- **기대감 소멸의 전형**: 게임주는 **신작 출시 직전까지만** 좋다. 출시 후 냉정한 평가가 시작되면 기대감이 마이너스로 돌아선다(엔씨소프트).\n- **2025년 정기보고서 일정**: 1분기 5/15 / 반기 8/14 / 3분기 11/14 / 사업보고서 3/31.\n\n### 7.3 증자·공시 재료\n- **채무상환용 유상증자는 바로 버린다. 규모 50억 미만도 버린다**(재료로서 의미 없음). 단 **예정 발행가가 현재 주가보다 높으면** 유증 성사를 위해 주가를 올려야 하므로 **오히려 상승 재료**가 될 수 있다 [소와곰 230915·230421].\n- **K셀온**: 최대주주 변경·유상증자 공시 = **매도 신호** [차읽남 25년 강의].\n- **액면분할은 유동성 재료다** [IMI 0821].\n- **권리락**은 신주의 싼 가격과 맞추기 위한 인위적 조정이며 **그 자체가 악재는 아니다** [월독프 2주차].\n- **거래정지 예정 이벤트**(인적분할 등)는 **정지일이 다가올수록 관련주가 미리 상승**하는 경향이 있다 [월독프 7주차, STX 사례].\n- **투자경고는 재료와 무관하게 투심을 죽인다** [상천유니온 240412].\n\n### 7.4 신규주 [소와곰 241026]\n- **실적이 적자면 제외**(상장 후 빠진다).\n- 재료는 **기대감이 들어갈 만한 것**이거나 **고객사가 테슬라·엔비디아·삼성급**이어야 한다.\n- **유통주식수 25% 이하가 이상적, 30%까지 허용.** **구주 물량이 많으면 매도세가 강해 위험.**\n- **적정 시총 1,500억~2,000억대**(대형주도 실적·재료가 좋으면 예외).\n- **상장일 직전 신규주들의 추세**(신규주가 잘 가는 장인지)를 먼저 확인.\n- **신규주는 공모주 물량이 다 나갔는지 확인**한다 [월독프 8주차].\n\n### 7.5 재료 발굴의 관점 4가지 [월독프 보너스 8주차]\n- **없다가 생긴 것이 라이프스타일을 바꿀 수 있는가**를 본다.\n- **삼성이 새롭게 한다고 한 것은 언젠가 오른다.**\n- 보험 처리: **발견됐는데 2년 이상 생존하면서 보험료가 많이 드는 것은 빨리 허가**해준다.\n- **선거 기간이 다가오면** 새로 뭔가를 하려는 움직임을 **정치자금 모으기**와 연결해서 본다.\n\n---\n\n## 8. 재무·공시로 거르는 최소 기준 [월독프 2주차]\n\n> 재료가 좋아도 이 필터에 걸리면 비중을 줄이거나 뺀다. **단타형 기업분석은 \"주주현황·재무제표·부채비율·유보율\"로 범위를 한정**한다. PER/PBR/EBITDA는 장투 영역이다.\n\n- **부채비율 400% 이상은 그냥 컷** [월독프]. (참고: IMI강의 3강은 **부채비율 200% 이상 주의 / 3년 연속 적자 주의 / 자본잠식 주의**로 더 보수적)\n- **감사보고서가 '부적정'·'의견거절'이면 즉시 거래정지 + 상장폐지 실질심사.** 반면 **분기·반기의 \"검토의견\"은 부적정이어도 즉시 실질심사로 가지 않는다.**\n- **2022년 말 법 개정**으로 5년 연속 적자 상장폐지 규정은 삭제됐다 → 이제 **자본잠식 여부가 핵심**이다.\n- **부채비율·유보율은 모두 자본금 대비 금액**이다 → 자본금이 작으면 유보율이 비정상적으로 높게 나올 수 있다.\n- **정관이 중요하다** — 정관에 쓰인 사업을 해야 '영업이익'이고, 정관에 없는 사업으로 번 돈은 **영업외수익·기타수익**이 된다.\n- **품절주**(대주주 지분 60~75%)는 관심 소외주가 아닌 이상 **매매 부적합**(신라섬유·양지사).\n- **매매 전 기업 실사 4종** [IMI강의 3강]: **홈페이지(핵심 사업) · 재무 · 공시(상폐 경고·유증·CB·횡령배임) · 최신 뉴스**(재료가 상하지 않았는지). **-5% 이상의 장대음봉은 이유가 있을 수 있다.**\n\n---\n\n## 9. 실행 순서 요약\n\n### 장전 (전날 저녁 포함)\n1. 장 종료 후~다음날 아침 기사를 확인하고 **기사 하나에서 관련주를 역추적** [월독프 5주차]\n2. 재료를 **신선함·연관성·지속성(펀더멘털)·확장성**으로 채점해 **서열**을 매긴다 [IMI강의 2강]\n3. 오늘 예정된 발표가 **이미 노출된 재료인지** 확인 → 노출됐으면 진입 계획을 짧게 [A-IMI-판단-05]\n4. 관심종목의 **재료가 아직 살아있는지** 재확인(시간 경과 / 다른 주도주 등장 / 전 저점·15일선) [IMI 241014]\n5. **기업 실사 4종**(홈페이지·재무·공시·최신뉴스) 통과 [IMI강의 3강]\n6. **관종 그룹명 칸에 아침 자료 기사 제목을 그대로 복사**해 장중 이슈를 잊지 않는다 [B-IMI-세팅-07]\n\n### 장중\n1. 새 뉴스를 보면 **즉시 \"관련주\"를 떠올린다** [3강 §5]\n2. **제목이 아니라 첫 문단**으로 세기를 판별하고, **협업/협의·검토중/예정** 같은 실체 없는 표현을 거른다 [소와곰·3강]\n3. **선취매 흔적**(기사 전 이미 상승)이 있으면 사지 않는다 [소와곰 230602]\n4. **오늘 가장 강한 테마와 연결된 뉴스**인지 확인 — 시황·테마 우위가 제목의 자극성보다 우선 [8강 §15.6]\n5. 진입 후 **후속 매수세**를 모니터링 — 안 들어오면 즉시 손절 [3강 §8.2]\n6. **반응 시한** 점검: 당일 기사면 10시 전후, 전일 기사면 11시까지 시세가 나와야 한다 [소와곰 240322]\n\n### 마감 후\n1. 당일 특징주·주요뉴스를 **신규/재탕 여부·상승률**과 함께 기록 → 누적되면 학습 효과 [G-멘탈-04]\n2. **새 이슈는 한곳에 모아 계속 업데이트**한다 [상천유니온 240725]\n3. 신규 종목은 요인값과 함께 **에버노트 + 키움 종목 메모장에 이중 저장** [B-IMI-세팅-09]\n\n---\n\n## 부록 — 참조 원문 위치\n\n| 저자 | 원문 블록 |\n|---|---|\n| 제시스페라(베이스) | `E5_뉴스매매.md` 전체 / `C_종목선정.md` 회피 필터 |\n| IMI(날짜별) | `C_종목선정.md` 485~560행, 775~810행 (재료 유효성·관종 관리) |\n| IMI강의 | `C_종목선정.md` 584~695행 (거차재시 정의, 재료 4축, 재료 소멸) |\n| 상천·상천유니온 | `C_종목선정.md` 697~1,000행 (재료 판별 4요소, 재료 크기 비교, 뉴스 읽는 법) |\n| 월독프 | `C_종목선정.md` 1,176~1,262행 (재료의 정의, 재무 필터, FDA 등급) |\n| 소와곰 | `C_종목선정.md` 1,262~1,305행 (기사 판독, 선취매, 반응 시한, 신규주 필터) |\n| 차읽남 | `C_종목선정.md` 1,306행~ / `A_시황·시장환경.md` 4대 장세 |\n\n---\n\n## 변경 이력\n- 2026-09-06: 최초 작성. `C_종목선정.md`·`E5_뉴스매매.md`를 9개 주제로 통합. 관점 차이 4건 병기.\n"}, {"label": "[거차재시] 시황", "file": "1_거차재시/시_시황.md", "md": "# 3차 거차재시 — 시: 시황\n\n> **문서 성격**: 거차재시 4축 중 **시황** 판단을 저자별로 흩어진 상태에서 주제별로 통합한 문서.\n> 공통되는 부분은 합치되 출처를 병기했고, 저자마다 결론이 갈리는 부분은 `⚠️ 관점 차이`로 나란히 적었다(00_운영규칙 §6).\n> **날짜별 시황 기록**(2026년 6~8월의 실제 장 해설)은 이 문서에 넣지 않았다 — 그것은 `2차 종합/A_시황·시장환경.md`에 사례로 보존돼 있고, 여기서는 **다음 달에도 그대로 쓸 수 있는 판정 프레임**만 추렸다.\n\n---\n\n## 0. 시황의 위상 — 왜 가장 먼저 보는가\n\n- **모든 분석은 시황 → 섹터 → 테마 → 종목 → 타점·기법 순으로 위에서 아래로 진행한다.** 기법을 먼저 정하고 아무 종목에나 끼워 맞추는 순서는 실패로 이어진다 [A-진입-01].\n- **\"나무가 아니라 숲\"** — 시황 우선의 원칙 [7강 17:41~18:37].\n- **종목보다 더 우선하는 것이 전체 지수의 흐름과 시장 거래대금이다** [IMI강의 4강 p.25~27].\n- 최종 결론: **매매 결정을 차트만 보고 내리지 않는다** [IMI 0831]\n  1. 세계 시황·지수 흐름·주요 경제지표(큰 그림)를 먼저 체크하고 메모·업데이트\n  2. 자금이 몰린 섹터·종목의 **개별 요인값**을 체크해 최신 상태로 유지\n  3. 그 상태에서 차트상 살 만한 자리에 진입 → 느린 단타든 빠른 단타든 확률이 높아진다\n- **같은 차트·같은 자리·같은 이벤트라도 시황에 따라 매매 여부가 달라진다.** 지지구간도 시황이 안 맞으면 그냥 깨진다 — 매수 버튼 누를 사람이 다른 종목에 가 있기 때문 [D-IMI3].\n\n---\n\n## 1. 시황을 구성하는 것\n\n### 1.1 시황의 6가지 구성 요소 [월독프 5주차]\n1. 시장을 **주도하는 섹터·테마**\n2. 시장을 **이끄는 주체**(개인 / 외인 / 기관)\n3. **최근 상승 패턴 트렌드** — 테마 패턴도 있고 차트 패턴 트렌드도 있다\n4. **강세 종목들의 힘과 특징**\n5. **당일 시장의 분위기**\n6. **투자자별 매매동향**\n\n### 1.2 실시간 시황 정의법 [IMI 0617]\n> 시황은 지표가 아니라 **지금 돈이 어디로 흐르는지**로 실시간 정의한다.\n\n- 보는 시점의 **주도 섹터·주도주가 어디인지**, 돈이 골고루 퍼지는지 한 곳에 몰리는지부터 파악.\n- **실시간 조회순위 → 섹터 연결**(예: 넥스틸→철강) → **동반 상승인지 단독 호재인지 뉴스 검색** → 섹터 진입해 확인.\n- **1등이 상한가 찍으면 2·3등주가 우르르 동반** → 섹터에 온기. **상한가 종목에서 섹터·재료를 연결한 뒤 끼 있는 2·3등주를 매매하는 것이 확률 높은 매매.**\n\n### 1.3 시황 = \"현재에 유동성이 좋은 상태\" [월독프 4주차]\n- 원래 있던 재료에 이슈가 겹쳐 **같은 재료의 종목군이 함께 급등하는 것**을 **\"주도섹터가 형성됐다\"**고 한다.\n\n### 1.4 시황을 한 줄로 정의한다 [A-IMI-선정-07]\n- 지수 방향 × 상승/하락 종목 수의 조합으로 **\"오늘은 어떤 장인가\"를 한 줄로 정의**한다 — **동료가 물으면 바로 답할 정도**로.\n- **이번 달 시장의 색깔도 한 줄로 정의**한다(예: \"삼전닉스에서 돈이 빠지며 업종 간 순환매\"). **패턴은 영구적이지 않다** [A-IMI-판단-12].\n\n---\n\n## 2. 지수 판정\n\n> ⚠️ **관점 차이 — 지수를 무엇으로 판정하는가 (세 가지 프레임)**\n\n### 프레임 ① 이평선 위치 [A-선정-01, 제시스페라]\n| 구간 | 판정 |\n|---|---|\n| **5일선 위** | 초강세장(강배팅 구간) |\n| **10일선 위** | 강한 상승장 |\n| **20일선 위** | 상승장 |\n| **20일선 아래~60일선 위** | 박스권(횡보) |\n| **60일선 아래** | 하락장 |\n\n- **정배열**(20>10>5일선 순서)이면 기법 매매·일반 매매 모두 효율이 높다. **역배열**(60·120일선이 20일선보다 위)이면 하락장으로 보고 베팅에 주의하며, **기법 매매 효율도 떨어진다**는 걸 인지한다 [A-진입-02].\n- 단, **이평선은 참고일 뿐**이니 추세·각도·글로벌 시황까지 종합적으로 본다 [A-멘탈-02]. 일봉만으로 애매하면 **월봉으로 전환**해 추세를 명확히 한다 [A-선정-02].\n- **지수도 지지·저항·이평선이 통한다** — 지수에도 일봉·중기 분봉에 지지·저항선을 긋는다 [IMI 0824·0825, D-IMI-진입-18].\n\n### 프레임 ② 거래대금 + 이평선 + 고저점 3조건 [차읽남 25년 강의]\n- **거래대금 10조 이상 + 지수 20일선 위 + 저점·고점 상승 = 상승장**\n- **거래대금 10조 이하 + 지수 20일선 아래 + 저점·고점 하락 = 하락장**\n- **-1~-2% 하락은 무시. -3% 이상일 때만** 내 종목과 지수 흐름의 일치 여부를 본다.\n\n### 프레임 ③ 유동성의 방향 [주간 0705·0712 / IMI 0828]\n- **예탁금·거래대금·주담대 증감**으로 **\"돈이 늘고 있나 줄고 있나\"**를 먼저 정한다 [A-주간-판단-03].\n- **거래대금이 7조 미만이면 지지가 잘 안 나오고 수익까지 오래 걸리는 장**으로 규정 → **분할 폭 확대 / 더 아래 지지 상정 / 비중 축소** [A-IMI-판단-09].\n- **거래대금 기준선**: **7조 이상**이면 정상 매매, **4~5조면 상승률 자체가 낮으므로 회전·비중 축소** [A-IMI-진입-07].\n- **시장 정리 종목 수가 급감**(하루 1개 등)하면 유동성이 마른 직접 증거 [IMI 0828].\n\n> **해석**: 세 프레임은 **측정 대상이 다르다** — ①은 **추세의 위치**, ②는 **추세 + 유동성의 결합 확인**, ③은 **유동성의 방향(증감)**. 실전에서는 ①로 위치를 잡고 ③으로 오늘의 강도를 조절하는 방식이 자연스럽다. ②는 그 둘을 하나의 문장으로 합친 형태다.\n>\n> 공통점은 **어느 저자도 지수 등락률만으로 판정하지 않는다**는 것이다. 세 프레임 모두 **거래대금 또는 이평선 위치**를 함께 요구한다.\n\n### 2.1 장 초반 판정 [월독프 9주차]\n- **지수는 장 초반 5~10분**을 보고 그날의 성격을 잡는다.\n- **시장체크용 관종**을 따로 두고 → **장 초반에는 지수 예상가, 장중에는 나머지**를 본다.\n- 개장 직후 **외인·기관 중 누가 매수하는지** 확인. 외인 매도 + 기관 매수면 대응 가능, 어중간한데 **대량 프로그램 매도면 바로 빠지고 10시 이후 수급 전환을 기다린다** [A-주간-판단-01].\n- **실시간 종목 조회 순위는 9시 1~2분에 확인**한다 [월독프 5주차].\n\n### 2.2 급락 중 반등 확인법\n- **급락 중 반등은 2~3회 확인**(조정 후 저점을 높이는지) 후 매수 준비 [D-IMI-진입-18·25].\n- 지수 1분봉이 살짝 돌리는 것을 보고 판단하지 말고, **되돌린 다음 처음 눌림을 줄 때 직전 저점을 깨느냐 안 깨느냐를 확인**하고 안 깨는 것을 본 뒤 판단한다 [상천유니온 240718].\n\n---\n\n## 3. 장세 유형 분류 — 오늘은 어떤 장인가\n\n> ⚠️ **관점 차이 — 장세를 몇 가지로 나누는가**\n\n### 차읽남의 4대 장세 [차읽남 25년 트레이딩클래스 2강]\n> \"왜 장세를 파악해야 할까?\" — **현재 시장의 돈이 어디에 있는지 파악해 매매 전략을 세우기 위함.** 장세 유형 파악이 종목선정·베팅비중의 출발점.\n\n| 장세 | 특징 | 대응 |\n|---|---|---|\n| **테마주 장세** | 거래량 폭발 · 2~3개월 시세 지속 · 뉴스/정책 촉매 · 눌림마다 매수세 · 파생테마 생성 | **관련주 상한가 유무로 강·약 판별.** 강하면 눌림 2·3파까지 노림 |\n| **대형주 장세** | 시총 상위 주도 · 외인·기관 수급 중심 · 매크로 민감 · **낮고 완만한 등락(비중 베팅 가능)** · 중소형주 소외 | 비중을 실을 수 있는 장. 중소형주는 접는다 |\n| **개별주 장세** | 지수는 횡보·약세인데 개별 종목만 강세 · 수급 쏠림 · **재료성 이슈**(M&A·기술수출) | 당일 테마가 없을 때 나타남. 이슈 종목 압축 |\n| **실적주 장세** | 1·4·7·10월 실적 시즌 전후 | **발표 전 차트가 고점이면 선반영(하락), 저점이면 상승 여력** |\n\n- **강한 테마 5가지 특징**: ① 거래량 폭발 ② 2~3개월 시세 지속 ③ 명확한 뉴스/정책 촉매 ④ 눌림목에 매수세 유입(1·2·3파) ⑤ **파생테마 생성**\n- **강약 실전 판별법**: **관련주에서 상한가가 나오면 강한 테마 / 상한가가 없으면 약한 테마**\n- **장세별 베팅 원칙**: 매수는 상승장=높은 타점 / 하락장=보수적 낮은 타점, 매도는 상승장=길게 / 하락장=짧게\n- **Q&A**: \"평소 잘하는 매매에서 반등이 안 나와요\" → **\"장세가 맞지 않아서다. 1년에 몇 달은 잘 맞는 시기가 오고, 이 시기를 기다릴 수 있어야 한다.\"**\n\n### 월독프의 시장 유형 6가지 [월독프 9주차]\n**개인 매수장 / 기관·외인 수급장 / 지수 상승장 / 지수 하락장 / 횡보장 / 테마장** — **\"지수가 오른다고 내 계좌가 오르는 게 아니다.\"**\n\n- **지수 상승장**: 주로 외인·기관·투신이 매수. **시총·실적·성장주 위주로 오르고 반도체·이차전지·바이오 등 섹터 종목이 대부분 상승** → 개별 테마 발굴보다 지수 관련 대형주가 유리.\n- **지수 하락장**: 외인·기관 매도세를 개인이 받아냄. **지수 하락 원인에 따라 헤지 성격의 테마가 만들어지고 그쪽으로 수급이 몰린다.**\n\n> **해석**: 차읽남은 **\"돈이 어느 성격의 종목군에 있는가\"**(테마/대형/개별/실적)로 나누고, 월독프는 **\"누가 사는가 + 지수가 어디로 가는가\"**를 섞어서 나눈다. 두 분류는 상당 부분 겹친다 — 차읽남의 대형주 장세 ≒ 월독프의 기관·외인 수급장, 차읽남의 테마주 장세 ≒ 월독프의 테마장·개인 매수장.\n>\n> 실전에서는 **차읽남 분류로 \"무엇을 살지\"를 정하고, 월독프 분류로 \"누가 사고 있는지\"를 확인**하는 2단 판정이 낫다. 소와곰도 같은 취지로 수급 주체를 판정에 쓴다 — **개인 매수세가 강하면 단기 트레이더에게 맞는 개별주 흐름, 외인·기관 매수세가 강하면 우상향 흐름이고 큰 주식이 오른다** [소와곰 240229].\n\n### 3.1 지수 상승장의 함정 [월독프 9주차]\n- 지수 상승장에는 **기관·외인 수급장**인 경우가 많고, 그런 장에서는 **테마주는 죽고 대형 시총주가 간다.**\n- **초반에 잡고 들어간 경우가 아니라면 쉬는 것도 좋다.**\n- 굳이 한다면 프로그램 매매를 보면서 대형 수급주로 접근한다.\n\n### 3.2 지수 국면별로 잘 가는 종목이 다르다 [소와곰 230616]\n| 지수 국면 | 잘 가는 종목 |\n|---|---|\n| **지수가 바닥에서 오를 때** | 바닥권에 있는 종목들 |\n| **지수가 고점을 뚫어줄 때** | **이미 가는 놈이 더 잘 간다** |\n| **기관 매수 시장** | 눌림 없이 쭉 올린다(따라잡기 어려움) |\n| **테마주 장세** | 위빙(등락)이 크다 |\n\n### 3.3 순환매 장세의 정의와 한계 [IMI 0828]\n- **새 섹터를 찾지 말고**, **기존에 돈이 크게 들어갔고 중기 시황이 살아 있는 섹터**를 우선 본다. 전날 약세였던 주도 섹터를 돌려보며 **대장주로 자금이 흘러가는지** 체크 [A-IMI-판단-11].\n- **순환매는 짧게, 주도주는 깊게 눌릴 때만** [클로징 0630·0702].\n\n---\n\n## 4. 쏠림 판정 — 지수가 플러스라고 다 좋은 게 아니다\n\n- **지수가 플러스인데 하락 종목 수가 월등히 많은 날** = 특정 대형주로 돈이 몰리고, **기존 주식을 팔아 그 돈으로 사는 장** [A-IMI1].\n- **하락 종목이 상승 종목의 3배면 대형주 쏠림** → **그 종목군 밖에서는 당일 단타로 수익 내기 어렵다.** 매일 **\"오늘 시장의 색깔\"과 돈의 흐름**을 해석한다 [A-IMI-판단-07].\n- 지수가 크게 빠진 날은 **상승/하락 종목 수를 비교해 전반 약세인지 특정 대형주발 조정인지** 구분한다 [A-IMI-판단-01].\n- **쏠림장이 확인되면**: 유니버스를 그 중심으로 좁힌다 — **\"거래대금 쏠림이 완화되기 전까지는 그 안에서만 매매\"** [주간 0705].\n\n> ⚠️ **관점 차이 — 쏠림장에서 소외 종목을 볼 것인가**\n>\n> | 시점·포지션 | 결론 | 출처 |\n> |---|---|---|\n> | **단타·데이** | 쏠림 중심(S급) 안에서만. 소부장은 가더라도 다음 날 떨어뜨리므로 **데이로만** | [주간 0705·0712] |\n> | **스윙·중장기** | 악재 소진·부정론 극대화·기관 유입이 확인되면 **소외 구간(코스닥)을 돌려볼 시점** | [주간 0712·0720] |\n> | **전저점 이탈 소외주** | **답이 없다.** 소외주는 싸서 빠진 게 아니라 **살 이유가 없어져** 빠진 것. \"순환 오겠지\"로 붙잡는 건 기다림이 아니라 방치 | [클로징 0622] |\n>\n> **번복이 아니라 포지션별 분리다.** 같은 시장이라도 **보유 기간이 다르면 결론이 달라진다.** 다만 어느 포지션이든 **전저점을 깬 비주도주**는 공통으로 제외한다.\n>\n> 진입 조건도 명시돼 있다 — **부정론과 조롱이 극에 달한 시장**은 스윙 스크리닝 대상으로 올려두되, **진입은 악재 소진·기관 유입 확인 후** [G-주간-멘탈-01].\n\n---\n\n## 5. 수급 판단\n\n### 5.1 금액 임계값 [월독프 5주차]\n- 화면 **0780 투자자별매매종합**에서 **8시 45분 선물**을 확인한다.\n- 개인이 사는 시장인지, 외인·기관이 사는 시장인지로 성격을 나눈다 — **개인 = 개별주(테마) 장 / 외인·기관 = 쭉 오르는 까다로운 장.**\n- **1,000억이 넘어가면 장이 열려도 방향이 잘 바뀌지 않는다. 100억 단위는 바뀔 수 있다.** **금액 규모 자체가 신뢰도다.**\n- 지수는 **오르면 뭘 살지, 내리면 뭘 살지, 횡보하면 뭘 살지를 미리 정해두거나**, 아니면 \"장중 대응하겠다\"고 결정해둔다.\n\n### 5.2 수급을 읽는 실무\n- **수급은 선그래프 모양으로 읽는다**(우상향=매수 지속, 우하향 중 횡보=반등 가능) [B-IMI-판단-01].\n- **외국인 + 기관 동시 매수 구간 = 최고 매수 신호.** 코스닥은 외인 매수 유입 시 지수 ETF 분할 고려 [IMI 0626].\n- **외인 순매수 1조 이상 유입 시 관심종목 편입**(외인 주도장 판단) [차읽남 25년 강의].\n- **대형주는 수급 확인 필수** — 외국인·기관 둘 다 매도면 미진입 [E6-IMI-진입-04·05]. **세력주(급등주)는 수급이 들어오면 가점 정도** — 개인 수급만으로도 상승 가능 [차읽남].\n- **외인 프로그램 매도 지속 → 회피 / 기타법인 매도 지속 → 판단 오류 인정하고 즉시 손절**(좋은 종목이면 종가 재진입) [차읽남 25년 강의].\n- 수급 확인 화면: **[0796]에서 최근 2~3개월** 기간을 설정해 순매수·이탈을 점검 [차읽남 25년 강의].\n\n### 5.3 특정 섹터에 자금이 들어가는 신호 [소와곰정리]\n- **큰 이슈가 없는데 특정 섹터의 종목들이 며칠에 걸쳐 조금씩 상승**하고, **지수가 빠지는 날에도 그 섹터만 오른다면** 그 섹터로 돈이 들어오고 있다는 신호.\n- **\"장중에 갈 날이 있고 안 갈 날이 있는데, 안 갈 날인데 가주면 뭔가 있다고 추정한다.\"**\n\n---\n\n## 6. 하락의 성격을 판별한다 [클로징 0702·0703·0706]\n\n> 급락장에서 **\"지금 들어가도 되는가\"**를 판단하는 절차. 이 문서에서 가장 실전적인 프레임이다.\n\n### 6.1 하락 원인 분류 — 기계적 청산인가, 판단 매도인가\n| 유형 | 성격 | 대응 |\n|---|---|---|\n| **기계적 청산** | 레버리지 ETF·신용의 강제 정리. **매물이 매물을 부름**(서킷). 사람이 판단해 판 게 아니라 **계좌가 강제 정리된 장** | **물량 소화 후 빠른 복귀 가능** |\n| **판단 매도** | 사람이 판단해서 판 것 | **시장이 소화할 시간이 필요** |\n\n> **실증**: 0702는 \"V자 반등 기대는 순진, 방어가 기본\"이었는데 **0703에 매수 사이드카 급등**이 나왔다. 모순이 아니라 **0702의 하락이 레버리지·신용의 기계적 청산이었기 때문**이다. **하락의 성격이 '판단에 의한 매도'인지 '기계적 청산'인지 구분하는 것이 반등 속도 판단의 핵심** [A-클로징-판단-04].\n\n### 6.2 악재의 실체를 검증한다 [A-클로징-판단-05]\n- **루머의 사실 여부 / 대체재의 실제 캐파 비중 / 수요를 줄이는 방향인지 늘리는 방향인지**를 항목별로 확인한다.\n- **실체가 없으면 급락은 되돌림 대상.**\n- 실증(0703): 0702를 눌렀던 악재 3종이 모두 소멸 — ① 메타 메모리 주문 축소 = 사실무근 ② 오픈AI 추론비용 절감 = 오히려 수요 폭증 요인 ③ 중국 CXMT = 글로벌 캐파 비중 미미해 실질 대체 불가.\n- **\"빠지니까 이런저런 이유를 붙여 공포감을 키우는 것\"** — 공급 과잉론 반박도 같은 방식(증설 리드타임 3~4년) [주간 0720].\n\n### 6.3 수급으로 공포의 끝을 확인한다 [A-클로징-판단-07]\n- **외국인이 현물을 던져도 선물 순매수 + 콜 매수·풋 매도 전환**이면 **공포 종료 신호**로 읽는다.\n- 이 패턴은 **과거 극단적 공포가 끝나고 반등할 때만** 나왔다 [클로징 0706].\n\n### 6.4 급반등 시나리오의 3조건 [A-클로징-진입-01]\n지수·섹터가 다음을 **동시에** 만족하면 급반등 자리로 보고 관종·현금을 준비한다:\n1. **역사적 낙폭 임계점** 도달\n2. **신용 반대매매 물량이 상당 부분 소화**된 상태\n3. **기계적 프로그램 매도 구조**에 밀린 것\n\n> **전제 조건이 깨지면 시나리오를 폐기한다** — 상위 지수가 크게 안 빠지고 옆으로 눌리는 조정이어야 한다.\n> 반대매매를 막으려고 더 넣은 돈은 **한 번 더 빠지면 못 버틴다** → **그 물량이 어디까지 나오는지**를 봐야 한다. 최악은 패닉셀 후 서킷이 걸리고 한 번 더 빠지는 것인데, **그 자리가 진짜 기회**다 [주간 0720].\n\n### 6.5 헤드라인에 계좌를 맡기지 않는다 [클로징 0619]\n- 지정학·헤드라인 뉴스는 **\"내가 든 주식의 가치·이익·수급의 큰 줄기를 실제로 바꿨는가\"**로만 판단한다. 못 바꿨으면 **가격은 흔들려도 판단은 흔들 이유가 없다.**\n- **공포에 던지는 것과 반등에 급히 달려드는 것 둘 다** 헤드라인이 결정을 대신 내린 것이다.\n- **\"지금 보는 게 가격의 흔들림인지 구조의 훼손인지\" 구분이 핵심** [클로징 0625].\n- **\"겁낼 재료인지, 이용할 변동성인지 구분\"** [클로징 0624].\n\n### 6.6 \"받아주는 손이 있는가\" [클로징 0630·0703]\n- 급락 후 핵심 질문은 **눌릴 때 받아주는 손이 있는가**이다(주도주가 이틀 밀리면 3일차에 매수가 유입되는지).\n- **주도주가 60일선 등 장기 이평선을 이탈**해도 그 자체를 매도 신호로 쓰지 말고, **원인이 기계적 청산인지 확인한 후** 저가매수 유입 지점으로 볼지 판단한다 [D-클로징-진입-02].\n\n---\n\n## 7. 지수 하락 시 헤지 테마 [월독프 9주차 / 소와곰]\n\n- **지수를 끌어내리는 매크로 악재가 있으면, 그 악재와 직접 관련된 업종은 반대로 급등한다.** 지수가 빠지는 날 그냥 쉬지 말고 **\"이 악재로 직접 수혜를 보는 업종이 뭘까\"를 먼저 찾는다.**\n\n| 악재 | 수혜 업종 |\n|---|---|\n| **전쟁(우크라이나-러시아)** | 천연가스·원유 공급 차질 → **에너지·자원** / 식량 수출 봉쇄 → **곡물·비료** |\n| **금리 인상** | **신용평가·채권추심** |\n| **이스라엘-하마스 전쟁** | **방산·천연가스·원유·물류** |\n\n- **고정 헤지 테마** [소와곰 230421·241026]: **식량 · 방산 · 희토류 · 품절주 · 원자재.** 지수가 원웨이로 하락하는 날은 이 헤지주부터 스캔한다.\n- **품절주 연쇄**: 시장이 심하게 하락할 때 품절주 대장(양지사)이 오르면 → 신라섬유 → 코데즈컴바인 순으로 연쇄 접근 가능.\n- **원자재는 지수가 하락할 때 시세를 잘 준다.**\n- **역방향 활용**: 금리가 오르면 **제약·바이오는 약세**(차입 운용 구조)로 연결해 둔다 [A-IMI-판단-06]. 이벤트 방향이 잡히면 **피해 업종을 특정해 회피**하고, 나아가 그 업종이 몰린 시장의 **인버스 ETF**까지 후보로 검토한다 [A-IMI-판단-10, E7-IMI-진입-01].\n\n> **인버스 헤지의 오해** [A-IMI8]: 지수 비중 1위 종목들이 곧 **하락장에 오히려 오르는 종목**이면, 그 종목 비중이 큰 지수의 인버스는 같이 빠진다 — 2,277개 종목이 빠지는 날 2배 인버스가 1.56%만 하락해 **헤지에 실패**한 실제 사례. **ETF는 구성 종목을 보고 들어가야 한다.** 인버스는 **당일 단타로만**, 예상과 다르면 즉시 손절 [F-IMI].\n\n---\n\n## 8. 매크로·이벤트 프레임\n\n### 8.1 일정은 미리, 항목까지 읽는다 [F-IMI-리스크-20]\n- 달력(시그널 리포트 등)에서 **잭슨홀·실적·연설 일정**을 확인하고, **항목을 클릭해 관련 기사까지 읽는다.**\n- **이벤트 2일 전부터** 포털 검색으로 요인값을 최신화해 **방향에 대한 나만의 기준**을 세운다.\n- 방향이 잡히면 → ① **이벤트 전 현금 확대** ② **오버나잇 금액 축소** ③ **피해 업종 특정 후 회피** [A-IMI-판단-10].\n- **일정 캘린더에 \"열릴 때마다 시장이 빠졌던 정례 이벤트\"는 별도 표시**해 그날 비중을 줄인다 [F-주간-리스크-02].\n- **명절 연휴 전에는 현금 비중을 올린다** [A-IMI-진입-08]. **금요일이면 주말 불확실성을 감안해 비중을 미리 줄인다** [F-IMI-리스크-15].\n\n### 8.2 실적 발표와 셀온 [IMI 0826 / 주간 0625]\n- **컨센서스 부합은 대부분 셀온**이다. 실적은 절대값이 아니라 **증권사 예상치(가이던스)를 압도적으로 상회하는지**가 관건 — 잘 나와도 **가이던스 하회 시 셀온**.\n- **\"당연히 좋을 건데 시장이 생각하는 것보다 더 좋게 나와야 산다\"** [주간 0705].\n- **실적 기대치가 높을수록 발표 앞뒤로 단기 차익 물량이 나온다 — 무적의 단어 \"선반영\"** [클로징 0706].\n- **이벤트 앞에서는 전량 익절하고 오버나잇하지 않는다** [F-IMI-청산-01].\n\n### 8.3 요인값(트리거 키워드) 프레임 [A-IMI-판단-02, IMI 0826]\n- 관리 섹터별 **요인값 키워드로 검색**해 시황을 갱신한다. **3층 구조**로 관리 — **시장 전체 / 섹터 / 개별 종목.**\n- 전날 미국에서 **강세였던 섹터를 확인하고 대응 섹터를 관종에 반영**. **야간선물이 빠졌으면 장 초반 약세를 전제**로 계획 [A-IMI-진입-06].\n- 미국 시장 체크 [A-선정-05, A-진입-07]: 인베스팅닷컴에서 **US30(다우)·US500(S&P)·US Tech100(나스닥)·US2000(러셀2000)** 4개 선물지수 확인. **대형주 지수와 러셀2000이 동반 상승하면 컨디션 양호**, **대형주만 오르고 러셀2000이 빠지면** 국내 중소형주·테마주는 약세를 예상하고 보수적으로 접근.\n\n### 8.4 주가는 (유동성 + 실적) × 기대감이다 [월독프 1주차]\n- **유동성과 실적이 아무리 좋아도 기대감이 0이거나 마이너스면 주가는 움직이지 않거나 빠진다.** 곱셈이기 때문이다.\n- **기대감이 이미 반영된 고평가주**는 투자자가 **더 나은 기대감을 가진 종목으로 갈아타면서 하락**한다.\n- **관심 소외주**(실적은 좋지만 유동성이 극단적으로 낮은 종목)는 **주가조작의 표적이 되기 쉽다.**\n\n### 8.5 센티먼트 지표로 타이밍을 본다 [A-IMI7, 주간 0618]\n- **시그널 게이지 / 공포탐욕지수(미국) / 에디얼 지표** 세 가지를 본다.\n- **저점에서 우상향 시작** → 음의 구간에선 **강한 대장주를 음봉마다 매집.**\n- **상단 도달 시 서서히 정리**, 게이지 상단에서 꺾이면 **음봉에 팔지 말고 양봉에 조금씩 수익 실현.**\n\n---\n\n## 9. 시황과 내 매매가 맞았는지 채점한다 [월독프 4주차]\n\n| 판정 | 의미 |\n|---|---|\n| **시황이 좋다** | 섹터 주도주가 잘 형성됐다 |\n| **시황이 안 좋다** | 섹터 주도주가 없어 재미가 없다 |\n| **시황과 안 맞는 매매를 했다** | 오늘 섹터 주도주와 관련 없는 종목을 매매했다 |\n| **시황과 딱 맞는 매매를 했다** | 오늘 섹터 주도주와 딱 맞는 매매를 했다 |\n\n- **매매할 종목이 없으면 쉰다** — 마땅한 자리가 없으면 현금·비중을 유지하며 쉬는 것도 정답 [G-IMI-멘탈-10].\n- 지수가 **상승 추세에 진입하지 않았으면 세게 매매하지 않고 당일 이슈만 가볍게** [F-주간-리스크-01].\n- **\"이 정도 빠졌으면 됐지\"라는 생각이 들면 체감으로 폭을 재고 있다는 신호** — 수급과 자리로 다시 판단한다 [G-주간-판단-02].\n\n---\n\n## 10. 실행 순서 요약\n\n### 주말·주초\n1. **이번 주 매매 유니버스 확정** — 거래대금 쏠림 여부를 보고 대상을 좁힌다 [C-주간-선정-01]\n2. **포지션별 분리** — 단타용과 스윙용 종목군을 따로 적는다(두 결론이 달라도 정상) [C-주간-선정-02]\n3. **일정 캘린더** 작성 + 정례 악재 이벤트 표시 [F-주간-리스크-02]\n4. **기준선 기록** — 지수·주도주의 120일선 값과 서킷브레이커 발동 가격대 [F-주간-판단-02]\n5. **유동성 방향 규정** — 예탁금·거래대금·주담대 증감 [A-주간-판단-03]\n\n### 장전\n1. **매크로·해외 지표** 확인(미국 4개 선물지수, 야간선물, 전날 강세 섹터) [A-선정-05, A-IMI-진입-06]\n2. **지수 위치 판정**(이평선 구간 + 거래대금 + 저·고점) → **오늘의 기본 비중** 결정 [A-선정-01, F-IMI-리스크-09]\n3. **8시 45분 선물·투자자별 매매**로 수급 주체 예상 [월독프 5주차]\n4. **장세 유형 가설** 수립(테마/대형/개별/실적) + 헤지 테마 후보 숙지 [차읽남 25년 강의]\n5. 지수가 **오르면/내리면/횡보하면** 각각 뭘 살지 시나리오를 미리 정한다 [월독프 5주차]\n\n### 장중\n1. **장 초반 5~10분**으로 그날 성격 확정, 9시 1~2분 실시간 조회순위 확인 [월독프 9·5주차]\n2. **실시간 시황 재정의** — 조회순위 → 섹터 연결 → 뉴스 검증 [A-IMI1]\n3. **상승/하락 종목 수**로 쏠림 여부 판정 [A-IMI-판단-07]\n4. **시황을 한 줄로 정의**한다 [A-IMI-선정-07]\n5. 급락 시 **하락의 성격(기계적 청산 vs 판단 매도)** 판별 → 헤지 수혜 업종 스캔 [클로징 0703, 월독프 9주차]\n6. 가설과 실제가 다르면 **장세를 재판정**한다\n\n### 마감 후\n1. **4분면 채점** — 시황이 좋았나 × 내 매매가 시황과 맞았나 [월독프 4주차]\n2. **\"오늘 시장은 이랬고, 내일 키포인트는 X이고, 나는 무엇을 할 것인가\"**를 안 보고 말로 정리 [G-IMI-멘탈-18·19]\n3. 매일 노트 5항목: ① 당일 영향 요인 ② 현재 시장의 특징 ③ 매크로·개별 이슈 ④ 일정 ⑤ **그래서 나는 무엇을 할 것인가** [G-IMI-멘탈-30]\n\n---\n\n## 부록 — 참조 원문 위치\n\n| 저자 | 원문 블록 (`2차 종합/A_시황·시장환경.md`, 930행) |\n|---|---|\n| 제시스페라(베이스) | A1~A7 (9~215행) — 이평선 지수 구분, 미국 지표, 대장주 서열 |\n| IMI(날짜별) | A-IMI1~11 및 날짜별 추가 (219~700행) |\n| 차읽남 | 342~410행(재사용 원칙) / 790~852행(4대 장세, 지수 판정 공식) |\n| 클로징 노트 | 410~482행 (구조적 해석 레이어, 하락 성격 판별) |\n| THE FLOW | 483~497행 (월간 프레임) |\n| 주간매매 | 498~541행 (주간 유니버스·포지션 분리) |\n| 월독프 | 703~763행 (시황 6요소, 수급 임계값, 기대감 공식, 4분면) |\n| 소와곰 | 764~789행 (지수 국면별 대응, 헤지 테마) |\n\n---\n\n## 변경 이력\n- 2026-09-06: 최초 작성. `A_시황·시장환경.md`(930행)에서 **날짜별 시황 기록을 제외한 재사용 프레임**만 10개 주제로 통합. 관점 차이 3건 병기.\n"}, {"label": "[공통운용] 손절", "file": "2_공통운용/손절.md", "md": "# 3차 공통운용 — 손절\n\n> **문서 성격**: 전략(E1~E21)과 무관하게 **모든 매매에 공통 적용되는 손절 원칙**만 모았다.\n> 저자별·날짜별로 흩어져 있던 내용을 주제로 통합하고, **공통되는 부분은 합치되 출처를 병기**했으며,\n> 저자마다 결론이 갈리는 부분은 삭제하지 않고 `⚠️ 관점 차이`로 나란히 적었다(00_운영규칙 §6).\n> **전략 고유의 손절 기준**(종가배팅 갭하락 대응, 음봉매매 칼손절 등)은 각 전략별 3차 가이드에서 다룬다 → §9 참조.\n> 카드 ID는 2.5차 규칙카드와 1:1 추적 가능하도록 그대로 유지한다.\n\n---\n\n## 1. 손절가는 매수 전에 정해진다 (전 저자 공통)\n\n- 진입 전 **총 투자금·종목 수·종목당 비중·분할 회차·손절가 5가지를 확정**한다 [F-IMI강의-리스크-01].\n- 매수 버튼을 누르기 직전, **\"왜 이 가격에 사고, 하락하면 어디서 손절할 것인가\"를 한 문장으로 말할 수 있어야 한다** [G-IMI강의-멘탈-02].\n- 큰 변동이 예상될 때는 즉흥 대응이 아니라 추가매수 조건·손절 한계·확대 베팅 조건을 미리 시나리오로 짜둔다 [G-멘탈-09].\n- 약세 종목인데 며칠 내 시장 관심을 뺏을 이벤트(신규 상장 등)가 예정돼 있으면, 진입 시점에 **\"n일 장마감까지 반등 없으면 전량 손절\"이라는 데드라인을 사전 설정**한다 [F-손절-05].\n\n> 이 항목에는 이견이 없다. 제시스페라·IMI강의 모두 \"손절은 매수 시점에 이미 결정된 것\"이라는 입장이다.\n\n---\n\n## 2. 손절 트리거 — 무엇을 보고 자를 것인가\n\n### 2.1 상황 판정 체크리스트 [제시스페라]\n다음 7가지 중 하나라도 해당하면 손절을 검토하고, **복수가 겹치면 더 확실하게** 손절한다. 실무적으로는 **금액 기준(2번)이 가장 많이 활용**된다 [F-손절-01]:\n1. 예상과 반대 움직임 (매수 근거와 반대로 감)\n2. **금액 기준** — 손실액이 평균 3일치 수익 초과\n3. **시간 기준** — 미수 3일 초과, 또는 3시간 이상 의미 있는 변동 없이 밀림\n4. **추세 기준** — 매수 근거였던 이평선 이탈 + 하락 지속\n5. **매수 근거 소멸** — 재료가 오보·정정으로 사라짐\n6. 악재 발생 / 시황 악화\n7. **퍼센트 기준** — 통상 2~3%\n\n### 2.2 기준선 이탈형\n\n> ⚠️ **관점 차이 — 무엇을 손절 기준선으로 삼는가**\n| 저자 | 기준선 | 성격 | 카드 |\n|---|---|---|---|\n| **제시스페라** | **매수 근거였던 이평선** (종목·진입마다 다름) | 진입 논리에 종속 | [F-손절-01] |\n| **제시스페라** | **제시봉(JB) 시가 이탈** — 즉시 손절. 새 상한가(JB) 발생 시 기존 기준 폐기하고 재설정 | 기준봉 종속 | [C-손절-01·02], [D-손절-04] |\n| **IMI강의** | **직전 저점 이탈** (계속 갱신하며 재설정). 단타는 1·3분봉 5·10분선, 스윙은 일봉 5일선 | 파동 구조 기준 | [D-IMI강의-손절-01] |\n| **소와곰** | **120분선 단일 기준** (+ 디마크 상단 보조) | 하나의 선으로 통일 | [소와곰 2023~2024] |\n> 서로 배타적인 것이 아니라 **운용 스타일의 차이**다. 진입 근거가 매번 달라지는 매매라면 제시스페라식, 파동을 세는 매매라면 IMI강의식, 판단을 단순화하고 싶으면 소와곰식이 맞는다. 다만 **하나를 골라 일관되게 쓰는 것**이 중요하다.\n\n- 분봉 이평선 단계적 청산: **5일선 이탈 50% / 10일선 이탈 전량**. 단 **지수가 약세면 5일선 이탈 시 전량** [D-IMI강의-청산-02].\n- 급등 국면 3단 축소: **1분봉 5분선 이탈 1차 → 10분선 이탈 2차 → 20분선 이탈 전량**. 3분봉 5·10·20선으로 봐도 무방 [F-소와곰-청산-05, 소와곰 230331].\n- **디마크 지지도 실패하고 120분선까지 깨지면 투매**가 나올 수 있으니 즉시 정리 [소와곰].\n\n### 2.3 다음 날 갭하락으로 시작한 경우\n- **시가가 핵심 지지 가격대 위인지 아래인지 하나만** 본다. 위면 지켜보고(말아 올리면 매수세가 강한 것이므로 추가 진입 가능), 아래면 던진다 [D-IMI-손절-01].\n- 비중이 작으면 다음 지지 구간까지 볼 수 있고, **크게 실었으면 칼같이 손절**한다 [D-IMI-손절-01, F-IMI-리스크-16].\n\n### 2.4 수급·시황발 손절\n- **기타법인 매도가 지속되면** 판단 오류를 인정하고 즉시 손절한다(좋은 종목이면 종가에 재진입). **외인 프로그램 매도 지속은 회피** [차읽남 24·25년 강의].\n- **11시까지 관망 중 지수가 하락 중이면** 손절을 고려한다 [차읽남].\n- 종목이 **5% 이상 하락하면 \"쎄함\"을 감지**하고, 과거 급락일 최대 낙폭과 비교해 하락 한계를 가정한 뒤 분할 대응한다(무지성 지지매수 금지) [F-IMI-손절-04].\n- 앞선 상승 거래량을 잡아먹는 **대량 음봉 = 정보 유출 정황** → 매수 중단, 뒤통수 공시 종목은 블랙리스트 [A-IMI-손절-06].\n\n### 2.5 재료·공시발 손절\n- 뉴스로 매수했는데 **후속 매수세 없이 빠지면 즉시 손절** [F-손절-04].\n- 강한 키워드 공시였으나 본문에 **계약금액이 \"유보\"·\"추후 공시\"** 처리 → 소량 매수했더라도 즉시 손절하고, 익일 추가 뉴스가 나와도 그 종목은 **\"위험 종목\"으로 재평가** [C-손절-03].\n- 매수 이유였던 재료가 **오보·정정으로 사라지면** 트리거 [F-손절-01 5번].\n\n---\n\n## 3. 손절 폭 — 몇 %에서 자를 것인가\n\n> ⚠️ **관점 차이 ① — 손절 퍼센트의 기준을 무엇에 연동하는가**\n| 저자 | 기준 | 전제 |\n|---|---|---|\n| **제시스페라** | **통상 2~3%** [F-손절-01] | 손실률 자체를 고정값으로 둠. 비중 언급 없음 |\n| **IMI** | **2중 기준**: ① 깨면 안 되는 지지 자리를 깨면 **-2%라도 즉시**(1순위) ② 종목당 최대 비중을 다 채운 상태면 **-5% 무조건** [F-IMI-손절-06] | **자리 × 비중** 조합. 비중 관리가 선행돼야 작동 |\n| **IMI (급락장)** | 풀비중 **-5% 손절**, 잡주·B/C급은 -5% 전이라도 저점 깨면 던짐 [F-IMI-손절-05] | 분할 후 -5% = 첫 매수 기준 약 -10% |\n| **소와곰** | **급락이 나오면 본절** [소와곰] | 손실 확대 전 탈출 우선 |\n> **해석**: 숫자가 다른 게 아니라 **연동 대상이 다르다.** 제시스페라는 손실률 고정값, IMI는 \"자리 이탈 여부 × 비중\"의 조합. IMI 방식이 더 세분화돼 있으나 **비중 관리가 전제**돼야 성립한다.\n\n> ⚠️ **관점 차이 ② — 소량 진입 상태에서 하락하면 자를 것인가, 더 살 것인가 (실질적 충돌)**\n| 저자 | 입장 |\n|---|---|\n| **제시스페라** | **물타기는 원칙적으로 금지.** 최저점(맥점) 포착에 집중하는 것이 먼저다 [F-리스크-04]. 퍼센트 기준(2~3%)은 비중과 무관하게 적용 |\n| **IMI** | **소량(5~10%) 투입이면 4% 빠져도 손절하지 않는다** → 더 빠지면 분할 추가해 단가를 낮추고 반등 시 익절. **풀비중일 때만** 지지 이탈 시 즉시(-2% 수준) 손절 [F-IMI-손절-01] |\n> **이건 스타일 차이가 아니라 정면으로 갈리는 지점이다.** 같은 -4% 상황에서 제시스페라는 손절 검토, IMI는 추가매수를 지시한다.\n> 차이의 뿌리는 **\"첫 매수를 얼마나 작게 하느냐\"** — IMI는 첫 매수를 5~10%로 아주 작게 잡는 분할 설계([F-IMI-리스크-02] 10→20→30→40)를 전제하므로 하락이 곧 계획된 추가매수 구간이 된다. 제시스페라는 맥점 저격을 전제하므로 하락 = 판단 오류가 된다.\n> **따라서 어느 쪽을 따르든, 진입 방식(맥점 저격형 vs 분할 설계형)과 짝을 맞춰야 한다. 진입은 맥점 저격인데 손절은 IMI식으로 미루면 최악이다.**\n\n- 진입할 때 **\"여기서 끝낼 매매인가, 모아갈 매매인가\"**를 먼저 정해 비중을 맞춘다 [F-IMI-리스크-16].\n- **종목당 최대 금액을 다 썼다면 그 자체가 손절 준비 신호** [F-IMI-리스크-19].\n\n---\n\n## 4. 차트 위치에 따라 무반등 대응이 갈린다\n\n> ⚠️ **관점 차이 — 익일 무반등일 때 버틸 것인가**\n| 상황 | 대응 | 출처 |\n|---|---|---|\n| **낮은 자리(바닥권 근접) + A급 이상**, 익일 무반등 | **자동 스윙 전환** — 물타기 없이 원물량으로 3~4일 대기 | [D-손절-03] |\n| **높은 자리(고가권)**, 익일 무반등 | **즉시 손절** | [D-손절-03] |\n| **엘리어트 5파(최고점) 구간 + 무반등** | 세력의 추가 부양 동기가 부족 → **즉시 칼손절**. 진입 자체도 회피 대상 | [D-손절-01] |\n| **장이 안 좋을 때** | 하락을 버티지 말고 **근거가 깨지면 컷** | [F-소와곰-손절-01] |\n> 제시스페라는 **자리(바닥권/고가권)에 따라 버티기를 허용**하고, 소와곰은 **시황이 나쁘면 버티지 않는다**는 쪽이다. 정면 충돌은 아니지만, \"바닥권 A급인데 장이 나쁜 날\"에는 둘이 다른 답을 준다 — 이때는 **비중이 큰 쪽 기준을 따르는 것**이 안전하다.\n\n- **점상한가로 매물 소화 없이 30% 직행(\"허공\" 구조)** 종목은 지지자리를 특정할 수 없어 원칙적으로 관심종목에서 제외한다 [D-손절-02].\n\n---\n\n## 5. 손절보다 먼저인 것 — 계좌·비중 관리 [IMI강의]\n\n- **손절보다 계좌관리가 먼저다. 비중이 잘못되면 손절 기준 자체가 무의미해진다** [F-IMI강의-리스크-08].\n- **3단계 리스크 축소 구조**: ① 종목당 최대 금액 제한 ② 그 안에서 분할 매수 ③ 손절. 최악의 손실을 **예수금의 0.5% 수준(잽)**으로 유지해 어퍼컷 KO를 방지한다 [F-IMI-리스크-11].\n- 하루 손실이 **일평균 수익의 2일치**에 도달하면 그날은 멈춘다 [F-IMI강의-리스크-03].\n- 익절·손절을 **1:1 수준**으로 관리하고 피라미딩 추매를 배제해 확률(승률) 기반으로 승부한다 [F-멘탈-01].\n- 종목이 4개가 되면 **제일 구린 것부터 컷**한다(3종목 이내 유지) [F-월독프-리스크-02].\n\n> 이 관점은 IMI강의·월독프에만 명시적으로 나온다. 다른 저자들이 손절을 개별 매매 단위로 다루는 데 비해, 이쪽은 **손절 기준의 유효성 자체가 비중 설계에 종속된다**고 본다.\n\n---\n\n## 6. 판단이 애매할 때 — 자문법\n\n> ⚠️ **관점 차이 — 트리거를 이성에 두는가, 감정 신호에 두는가**\n> - **제시스페라 (역지사지법)**: \"지금 이 종목을 **안 들고 있다고 가정**하고, 지금 가격에 같은 비중으로 다시 살 의향이 있는가?\" → 있으면 보유 유지, 없으면 손절 검토 [F-손절-02]\n> - **월독프 (감정 신호법)**: **\"손절해야겠다는 생각이 드는 그 순간이 최고가 손절이다.\"** 아니다 싶은 것은 아니다. 희망을 갖지 마라. 잘못됐다 싶으면 잘못된 것이다. 아쉬워서 버티면 큰 고통이 따른다 [F-월독프-손절-01]\n>\n> 방향은 같지만 **트리거가 다르다.** 역지사지법은 한 번 더 생각하게 만들고, 감정 신호법은 생각이 든 즉시 실행하게 만든다. 손절을 미루는 성향이라면 월독프 쪽이, 충동적으로 자르는 성향이라면 제시스페라 쪽이 교정 효과가 있다.\n\n---\n\n## 7. 손절을 미루면 실제로 어떻게 되는가 [월독프]\n\n- 손절 지점 이후 추가 하락 실측: **-35%(레이저쎌) / -30%(에스엠) / -100%(네오위즈홀딩스)** [F-월독프-손절-02].\n- **가장 나쁜 패턴은 \"손절해야 하는 걸 알면서 고민하며 홀딩하다가 결국 손절\"하는 것** — 판단은 맞았는데 실행을 늦춰 수익이 손실로 바뀐다. 기준에 닿으면 즉시 실행한다 [F-월독프-손절-02].\n- 손절이 지연됐던 사례를 **일반화하지 않는다**(운 좋게 버텨서 살아난 경험을 규칙으로 만들지 말 것) [E3-손절-05].\n\n---\n\n## 8. 손절 이후의 태도\n\n- **손절 후 반등해도 결과론으로 후회하지 않는다.** 그 순간의 정보로 옳게 판단했으면 된 것 [G-IMI-멘탈-11].\n- 걸러낸 종목이 급등했어도 자책하지 않는다 [G-IMI-멘탈-15].\n- 이번 주 손실이 있었다면 감정이 아니라 **다음 주 매매 범위를 좁히는 규칙**으로 바꿔 적는다 [G-주간-멘탈-03].\n- ⚠️ **상승장에서 몸에 밴 \"기다리면 반등한다\"를 하락장에 그대로 적용하면 손절 타이밍을 놓친다** [차읽남 24·25년 강의].\n- 상승장의 \"버티면 된다\" 학습을 경계하고, 상승장/하락장 구분 없이 항상 비중·계좌·현금을 관리한다 [G-IMI-멘탈-28].\n- 원칙대로 실행한 손절은 잘한 매매다. **평가 기준은 수익/손실이 아니라 원칙 준수**다.\n\n---\n\n## 9. 전략별 손절 기준 — 이 문서에서 다루지 않는 것\n\n전략마다 기준이 달라 각 전략별 3차 가이드에서 다룬다. 대표 카드만 위치 안내용으로 적는다.\n\n| 전략 | 대표 손절 카드 |\n|---|---|\n| E1 종가배팅 | 갭하락 기본 대응, 장기투자 전환 금지, 시간 기준 손절 [E1-손절-01~05] |\n| E2 양봉·상한가 | ML1(-5%) 손절, 시간 손절, 데드라인 손절, 1% 컷 후 재진입 [E2-손절-01~08] |\n| E3 음봉매매 | 시가 갭하락 음봉 회피, 고가권 무반등 칼손절, 복합 악재 시 무조건 손절 [E3-손절-01~05] |\n| E5 뉴스매매 | 알맹이 없는 공시, 재탕 뉴스, 선취매 흔적 대응 [E5-손절-01~04] |\n| E6 대형주매매 | 대형주는 짧게, 음봉 전환 시 중단, 5일선 이탈 [E6-손절-01~03] |\n| E7 종합·기타 | 보호예수 해제 직전 회피, 점상한가 패스, 진입 가정 붕괴 시 정리 [E7-손절-01~03] |\n| E8/E9 신규주·급등주눌림 | 변동성 반영 손절 기준 [E8-차읽남-손절-01·02, E9-차읽남-손절-01] |\n| E11 바닥권눌림 | -5% 손절, 4음봉 신호, 5일선 이탈 대응 [E11-차읽남-손절-01~03] |\n\n---\n\n## 부록 — 참조 카드 목록\n\n**제시스페라(베이스)**: [F-손절-01~06] [F-리스크-04] [F-멘탈-01] [C-손절-01~03] [D-손절-01~04] [G-멘탈-09]\n**IMI(날짜별)**: [F-IMI-손절-01~06] [F-IMI-리스크-02·11·16·19] [D-IMI-손절-01] [A-IMI-손절-06] [G-IMI-멘탈-11·15·28]\n**IMI강의**: [F-IMI강의-리스크-01·03·08] [D-IMI강의-손절-01] [D-IMI강의-청산-02] [G-IMI강의-멘탈-02]\n**월독프**: [F-월독프-손절-01·02] [F-월독프-리스크-02]\n**소와곰**: [F-소와곰-손절-01] [F-소와곰-청산-05]\n**주간매매**: [G-주간-멘탈-03]\n**차읽남**: 24·25년 강의 시간대별 운용표\n\n---\n\n## 변경 이력\n- 2026-09-06: 최초 작성. `0_공통루틴.md`에 저자별로 흩어져 있던 손절 내용 + 2.5차 카드(F·C·D·A·G)를 주제별로 통합. 관점 차이 5건 병기.\n"}, {"label": "하루루틴", "file": "0_하루루틴_시스템연동.md", "md": "# 3차 — 0. 하루 루틴 (ForNext 시스템 연동판)\n\n> 장전 준비 → 장중 알람 → 장후 복기 루프를 ForNext/ForNext API/클로드와 함께 도는 실전 루틴.\n> 매매 원칙 자체는 `0_공통루틴.md`가 기준이고, 이 문서는 **어떤 도구로 언제 무엇을 하는지**만 다룬다.\n> 작성: 2026-07-04 (인터뷰 확정 구조 기준)\n\n---\n\n## 🌅 장전 (08:00 ~ 09:00)\n\n| # | 할 일 | 도구 |\n|---|---|---|\n| 1 | 미국장 체크 — 다우/S&P/나스닥/러셀2000 4개 선물. 러셀까지 동반 상승이면 양호, 빅테크만 오르면 중소형주 보수적 [A-선정-05] | 인베스팅닷컴 |\n| 2 | 시황 판단 — 코스피가 5/10/20/60일선 어디 위인지로 오늘 배팅 강도 결정 [A-선정-01] | HTS |\n| 3 | 후보 선정 — 전일 특징주·관심종목에서 오늘 볼 종목 2~5개 + 종목별 지지선 가격 메모 | HTS |\n| 4 | 클로드에게 후보 전달 — \"오늘 후보: OO전자 지지선 45,000 / XX바이오 지지선 12,300\" | 클로드(PC) |\n| 5 | 클로드가 처리 — 회피필터 체크(질문 몇 개) → 통과 종목 감시등록+지지저항 입력 → 타점 역산 브리핑 회신 | (자동) |\n| 6 | 감시목록 최종 확인 — `/list` | 텔레그램 |\n\n## 📈 장중 (09:00 ~ 15:30)\n\n| # | 할 일 | 도구 |\n|---|---|---|\n| 7 | 알람 수신 — D1 점수제/단순패턴 알람은 **후보 신호일 뿐**, 매수 지시가 아님 | 텔레그램 |\n| 8 | 알람 종목 직접 확인 — 대장 서열, 거래대금, S/A/B/C 등급, 재료 생존 [C-진입-03·04] | HTS |\n| 9 | 진입 시 비중 규칙 준수(물타기 금지, 맥점 한 자리 [F-리스크-04·09]) + **진입 시각·가격·이유 한 줄 메모** (복기 재료) | HTS+메모 |\n| 10 | 알람 과다하면 \"알림 끄기\" 버튼, 재개는 `/on 번호` | 텔레그램 |\n\n## 🌙 장후 (15:30 이후, 30분 이내)\n\n| # | 할 일 | 도구 |\n|---|---|---|\n| 11 | 복기 대상 선별 — 그날 가장 크게 수익/손실 난 종목 1~2개만 [G-멘탈-03] | — |\n| 12 | 학습사례 입력 — 기사/테마/판단근거/교훈/매매시점 + 일봉·분봉 XLS 업로드 | ForNext 웹화면 `/learning-cases` |\n| 13 | 클로드와 복기 — \"오늘 복기하자, OO전자\" + CSV 제공 → 클로드가 그날 알람로그·3분봉 흐름을 VM에서 불러와 대조 → 질문 먼저 → 카드 기준 피드백 → **규칙 준수로 평가(수익 아님)** | 클로드(PC) |\n| 14 | 마무리 — \"내일 주의할 것 1가지\" 도출. 패턴 반복 발견 시 공식 개선/신규 제안 → 공식 관리 탭 등록 | 클로드(PC) |\n\n## 📱 틈새 (아무 때나, 폰)\n\n| # | 할 일 | 도구 |\n|---|---|---|\n| 15 | 규칙카드 1일 1장 — \"오늘 카드 줘\" → 최근 매매에서 지켰는지 한 줄 자문 | 클로드 앱(폰) |\n\n---\n\n## 바쁜 날 최소 루틴\n\n형식보다 지속성 [G-멘탈-04]. 아래 3개만 해도 루프는 끊기지 않는다:\n\n1. ④ 후보 전달 (아침 1분)\n2. ⑦ 알람 대응 (장중)\n3. ⑬ 말로만 3줄 복기 — \"뭐 샀고, 왜 샀고, 규칙 지켰나\" (차트 CSV 없어도 됨)\n\n웹화면 입력(⑫)은 제대로 복기하는 날만.\n\n---\n\n## 시스템 참고\n\n- 알람 공식 켜기/끄기·수치 수정: ForNext API 대시보드(`open_dashboard.bat`) → 공식 관리 탭\n- 그날 알람 내역: 클로드가 `GET /api/alert-log`로 조회 (복기 때 자동)\n- 신규 공식은 검증 전 **비활성** 등록이 기본, 대시보드에서 검토 후 직접 켠다\n"}, {"label": "종가배팅", "file": "E1_종가배팅_가이드.md", "md": "# 3차 — E1. 종가 배팅 실전 가이드 (시간순)\n\n> 공통 매매 루틴(3차-0)을 기본 전제로 하고, 종가배팅(E1) 고유의 타이밍·기준만 추가한다.\n> 2.5차 카드 27개를 시간 흐름으로 재배치. 카드 번호는 본문에 [E1-진입-01] 형식으로 유지.\n\n---\n\n## 0. 종가배팅이란 — 시작 전 알아둘 것\n\n장 마감 시간대에 매수해 익일 시세 차익을 노리는 추세 매매다. 보유시간이 짧고 손실위험이 제한되며 뇌동매매 방지 효과가 있는 반면, 오버나잇 리스크와 시초가 갭하락 가능성이 약점이다. 직장인은 종가배팅·스윙 위주로, 전업 트레이더도 장중매매에만 의존하지 말고 매매법 포트폴리오에 포함하는 것이 좋다 [E1-멘탈-01].\n\n---\n\n## 1단계. 진입 전 점검 (오후 시간대, 진입 전)\n\n### 1.1 체크리스트 6항목 — 빠짐없이 확인\n1. 악재 확인(계절적 리스크, 과거 악성 이력 재발 패턴)\n2. 오버행 점검(DART에서 미상환 전환사채 확인)\n3. 매매동향(외국인·기관 순매수, 프로그램 매매)\n4. 지수·환율·해외지표 확인\n5. 정보채널 확인(HTS 0700 + 텔레그램 + 뉴스/토론실)\n6. 해외선물 체크(인베스팅닷컴)\n\n6항목을 모두 점검한 뒤에만 진입을 결정한다 [E1-선정-02].\n\n### 1.2 종목 자격 — 3대 핵심 요건\n다음 3가지를 모두 충족할 때 종가배팅 대상으로 적합하다 [E1-선정-01]:\n1. 시장 주도주(시장이 주목하는 종목)\n2. 익일 추가 상승 모멘텀 존재\n3. 선제적 진입 가능(예측 매매 여지)\n\n### 1.3 유형 선택 — 오늘은 어떤 종가배팅인가\n| 상황 | 유형 |\n|---|---|\n| 상승 추세 중인 양봉 | 추세 종가배팅 |\n| 상승 추세 중 조정·반등 예상 | 눌림 종가배팅 |\n| 익일 거래 폭증이 예상되는 신고가 부근 | 선제 진입(예측 매매) |\n| 하락 추세 중 더 이상 안 밀리는 자리 | 낙폭과대 진입 |\n| 라운드피겨·매물대·쌍봉 돌파 자리 | 해당 가격대 진입 |\n| 시황 악화 | 종가배팅 대신 익일 시가배팅으로 전환 |\n[E1-진입-07]\n\n### 1.4 양봉 강도 판단\n평소 변동폭(3~5%)을 크게 초과하는 장대양봉(예 갑자기 15%)은 익일 조정 가능성이 높아 회피한다. 애매한 강도(약 6~7%) 상승으로 조정 없이 마감한 종목이 오히려 이상적인 패턴이다 [E1-진입-05].\n\n### 1.5 너무 뻔한 자리는 피하고, 하루 전에 선점\n누구나 알 만한 자리(정확히 역사적 신고가 등)는 매물대가 과다해 잘 안 통하는 경우가 많다. 역발상으로, 신고가 도달이 예상되면 **그 하루 전**에 미리 선점하는 쪽이 유리하다 [E1-진입-06].\n\n---\n\n## 2단계. 진입 (표준 시간대)\n\n### 2.1 표준 진입 시간대\n- **KRX 종목**: 15:00~15:30(시간외단일가 직전)\n- **NXT 종목**: 19:30~20:00(애프터마켓 마감 30분 전), 가능하면 이 30분을 분할 매수\n[E1-진입-01, E1-진입-02]\n\n### 2.2 시간 예외\nA급 이상 확신 종목이 표준 시간대 진입 전부터 이미 추세를 타며 상승 중이면, 표준 시간보다 일찍 진입한다 [E1-진입-03].\n\n### 2.3 시황에 맞춘 타이밍 조정\n- 지수가 양봉(잘 버팀) → 진입 시점을 다소 앞당김\n- 지수가 음봉(지속 하락) → 진입 시점을 최대한 늦춤\n- 지수가 횡보 → 흐름을 지켜보며 시점·비중 결정\n[E1-진입-04]\n\n### 2.4 어드밴스드 종가배팅(고난도, 숙련자용)\n확신도가 매우 높은 A급 종목이고 지수가 견고할 때만, 12시(점심시간)부터 조기 진입한다. 익숙하지 않으면 10~30분 간격으로 소액 분할 매수한다 [E1-진입-08]. 진입 후 장세가 불안정해지면 오후 2시를 기준으로 손절을 결정하고, 그 이후는 스탠다드 방식(15시 이후)으로 전환한다 [E1-손절-05]. 비중 대응(세렌바이)은 과도한 하락 시 추가매수 또는 손절, 과도하고 급격한 상승 시 불타기 또는 수익실현으로 한다 [E1-리스크-01].\n\n---\n\n## 3단계. 보유 중 (진입 후 ~ 익일 개장 전)\n\n### 3.1 거래량 폭증 시\n보유 중 거래량이 갑자기 폭증하면서 강한 반등이 나타나면, 고점에서 매도가 쉬워지는 타이밍이므로 일부 또는 전량 매도한다 [E1-청산-06].\n\n### 3.2 파이널 종가배팅 — 오버나잇 연장 판단\n당초 음봉눌림으로 진입했는데 분봉 반등이 매우 강해 일봉이 양봉으로 전환되고, 외국인·프로그램 순매수가 지속되며 우량 거래원의 매수 비중이 확인되면, 전량 매도 대신 일부 물량을 오버나잇한다 [E1-진입-09].\n\n---\n\n## 4단계. 익일 개장 — 시가 시나리오별 대응\n\n### 4.1 갭상승(강한 재료 기반)\n추가 상승 가능성이 높다고 보고 보유 또는 추가 매수를 검토한다 [E1-청산-01].\n\n### 4.2 갭상승(일반 종목, +5% 이상)\n차익실현 매물이 많을 시점이므로 분할 매도한다 [E1-청산-02].\n\n### 4.3 갭상승 후 재하락\n약한 신호로 보고 분할 매도한다 [E1-청산-03].\n\n### 4.4 보합/미미한 변동 — 타임컷\n장 시작 후 15분이 지나도 방향이 안 보이면 타임컷을 적용한다. 유의미한 수급이 없으면 본전 부근에서 매도한다 [E1-청산-04].\n\n### 4.5 거래량 안 터지고 횡보\n시장 관심이 떠났다고 판단하고 미련 없이 정리한다 [E1-청산-05].\n\n### 4.6 갭하락(손실 구간)\n손절가를 이탈했으면 기계적으로 손절한다. 단, 지수 영향에 의한 일시적 눌림이라면 장 초반 기술적 반등이 나올 때 본전 또는 최소손실로 매도한다 [E1-손절-01].\n\n### 4.7 핵심 마인드 — 시간대별 행동\n- 갭상승: 9시 5분 전에 일부 물량이라도 익절한다(전량 아님, 심리 안정 목적) [E1-청산-07].\n- 보합: 9시 5분까지 무변화면 분할 매도를 준비한다 [E1-청산-08].\n- 갭하락: 판단이 틀렸음을 인정하고, 지지선·손절기준 이탈 시 즉시 칼손절한다 [E1-손절-04].\n\n---\n\n## 손절 판단 — 언제든 적용\n\n### 절대 원칙\n매수 근거가 깨졌다면, 단기 매매를 억지로 장기 투자로 전환하지 말고 즉시 인정한 뒤 손절한다 [E1-손절-02].\n\n### 역지사지 판단법\n\"지금 이 종목을 안 들고 있다고 가정하고, 현재가에 같은 비중으로 다시 살 의향이 있는가?\" 있으면 보유 유지, 없으면 손절을 검토한다 [E1-손절-03].\n\n---\n\n## 부가 전략 — \"승부수\" (숙련자 전용)\n\nA급 종목이거나 반등이 잘 나오는 종목에 대해, 단기 수익(2~3%)에 자동으로 매도되는 습관을 깨고 싶을 때만 의도적으로 HTS를 보지 않는 전략을 쓸 수 있다. 30%(또는 70%)를 먼저 수익실현해 마음을 안정시키고 나머지로 승부한다. 초보자에게는 권하지 않는다 [E1-리스크-02].\n\n---\n\n## 참고\n- 시황 판단(이평선 배열, 미국선물 체크 등)과 자금관리 기본원칙(미수금지, 비중한도 등)은 3차-0(공통 매매 루틴) 참고.\n- 대형주 종가배팅(SK하이닉스·삼성전자 등 구체 사례)의 NXT 타이밍 디테일은 3차-E6(대형주매매) 참고.\n"}, {"label": "음봉매매", "file": "E3_음봉매매_가이드.md", "md": "# 3차 — E3. 음봉 매매(눌림목, 상단/중단) 실전 가이드 (시간순)\n\n> 공통 매매 루틴(3차-0)을 기본 전제로 하고, 음봉매매(E3) 고유의 타이밍·기준만 추가한다.\n> 2.5차 카드 29개를 시간 흐름으로 재배치. 카드 번호는 본문에 [E3-진입-01] 형식으로 유지.\n> E3는 강의 시리즈 전체에서 가장 핵심적인 기법이라 분량이 가장 많다. 상단(5일선 위)과 중단(5일선 아래)을 구분해서 다룬다.\n\n---\n\n## 0. 시작 전 — 두 가지 마음가짐\n\n### 학습·적용 순서\n중단(상대적으로 간단·안정적)을 먼저 마스터한 후, 상단(고난이도)으로 진행한다 [E3-멘탈-04].\n\n### \"물림 매매\" 경계\n\"물려 있는 것이 정상\"이라고 여기는 일반적 눌림매매(\"물림 매매\")를 경계한다. 바닥을 미리 확인하고 반등을 확인한 뒤 진입하는 \"안 물리는\" 방식을 추구한다. 정확한 저점(맥점)을 예측할 수 있을 때는 선제 진입도 섞어 쓴다 [E3-멘탈-01, E3-진입-02].\n\n---\n\n## 1단계. 관심종목 선정 (장 시작 전 / 전일 준비)\n\n### 1.1 관심종목 선정 3원칙\n1. JB 확인(전일 발생 종목, 재료크기·시장관심도 파악)\n2. 타점 파악(라운드피겨·전저점·전일종가·전일거래량집중구간의 교집합 — 교집합이 많을수록 신뢰도 상승)\n3. 수익실현 기준 사전 설정\n[E3-선정-02]\n\n### 1.2 음봉매매 상단 6대 체크리스트\n1. JB 유무 및 테마 대장주 여부\n2. 일봉 위치\n3. 거래대금\n4. 분봉 거래량·패턴·파동\n5. 목표가 및 손절가 설정\n6. 재료의 신선도 및 지속 여부\n\n6가지를 모두 점검한 뒤 매매를 결정한다 [E3-선정-01].\n\n### 1.3 음봉매매 중단 4대 매매대상 조건\n1. 바닥권 첫 장대양봉(상한가일수록 좋음)\n2. 대량 거래량(JB 발생)\n3. 강력한 저항·박스권 돌파\n4. 상승추세 전환(역배열→정배열)\n\n4조건을 충족하는 종목을 중단 매매 대상으로 선정한다 [E3-선정-03].\n\n### 1.4 회피 대상 — 사전 필터링\n- 점상한가(매물 소화 과정 없이 상승)는 지지·저항 자리를 특정할 수 없으므로 관심종목에서 제외한다 [E3-선정-04].\n- 거래대금이 적은 약한 상한가(예 100억대)+역배열 차트(매물대 다수)는 B·C급으로 분류해 A급과 구분, 회피한다 [E3-선정-05].\n\n### 1.5 패턴 신뢰도가 쌓인 종목은 우대\n동일 종목이 유사 패턴(상한가→투자경고→5일선이탈 등)을 2회 이상 반복 검증했다면, \"패턴 신뢰도\"가 누적된 것으로 보고 동일 전략을 신뢰감 있게 재적용한다 [E3-선정-06].\n\n---\n\n## 2단계. 진입 — 음봉매매 상단(5일선 위)\n\n### 2.1 골든타임 — 뉴 테마 첫 눌림\n새로운 테마(뉴 테마) 대장주의 첫 눌림(첫 음봉)은 최적 진입 구간(맥점)이다. 적극적으로 매수를 검토한다 [E3-진입-01].\n\n### 2.2 패턴 A·B 공략\n전일 JB(상한가/장대양봉) 종가 대비 익일 음봉으로 마감하는 두 가지 패턴이 있다:\n- **패턴 A**: 종가가 JB 종가 아래로 마감\n- **패턴 B**: 종가가 JB 종가보다 위에서 마감(장중엔 이탈 가능하나 종가상으론 비이탈)\n\n두 패턴 모두 다음을 확인한 뒤 양호하면 진입한다: 분봉상 장대음봉·투매 여부, 거래원·프로그램 수급, 전일 분봉 지지대 지지 여부 [E3-진입-03].\n\n### 2.3 일봉 위치별 비중 전략\n| 위치 | 비중 전략 |\n|---|---|\n| A자리(바닥권 첫 상승 후 눌림) | 가장 안전, 비중 확대 가능 |\n| B자리(두 번째 자리) | 비중 축소 |\n| C·D자리(고가권) | 비중 추가 축소(거래대금 5천억+대장이면 예외) |\n[E3-진입-05]\n\n박스권을 막 돌파한 첫 자리, 특히 뉴 테마라면 상대적으로 안전하니 적극 진입을 고려한다 [E3-진입-06].\n\n### 2.4 진짜 하락 vs 가짜 하락 판별\n음봉이 발생했을 때 거래량이 양봉(상승일) 대비 적으면 \"주포 미이탈\"로 해석해 진입을 검토한다. 거래량이 양봉 대비 많으면(특히 2배 이상) 주포 이탈 가능성으로 보고 회피한다 [E3-진입-09].\n\n### 2.5 갭하락이 심할 때\n갭하락이 심하게 시작되면 즉시 손절보다, 저점에서 반등을 기다린 뒤 대응하는 것이 더 효율적이다 [E3-진입-12].\n\n---\n\n## 3단계. 진입 — 음봉매매 중단(5일선 아래, 20일선 위)\n\n### 3.1 핵심 발상의 전환\n일반적으로 5일선 이탈은 손절 신호다. 하지만 중단 매매에서는 바닥권 첫 장대양봉/상한가/JB 종목의 첫 5일선 이탈을, 그 실망 매물을 받아먹는 **매수 기회**로 거꾸로 활용한다 [E3-진입-04].\n\n### 3.2 분석 방법 선택\n중단 매매는 상단보다 시간이 길어지므로 최소 30분봉 이상으로 분석한다. 가장 간단한 방법은 일봉만으로 분석하는 것(확률은 다소 낮지만 가장 빠르다) [E3-진입-07].\n\n### 3.3 강한 대장주는 추세가 한번에 안 죽는다\n바닥권에서 2연상 이상 강하게 상승한 대장주가 급락해도, 시발점(첫 상한가 기준봉)까지 단번에 밀리는 경우는 드물다. 중간에 설거지 반등이라도 나올 거라고 기대하고 대응한다 [E3-진입-08].\n\n---\n\n## 4단계. 진입 시 추가 판단 — 두 영역 공통\n\n### 4.1 반복매매 확률 저하\n같은 자리에 재진입을 반복(\"두 탕\", \"세 탕\")할수록 확률이 급격히 떨어진다. 첫 자리가 맥점이라는 원칙을 항상 다시 새기고, 반복할수록 더 신중해진다 [E3-진입-10].\n\n### 4.2 신규주 3배 법칙\n신규 상장주는 일반 종목 대비 상승·하락 모두 약 3배 탄력을 보인다. 상승 기대도 크지만 하락 위험도 3배로 커진다는 걸 비중에 반영한다 [E3-진입-11].\n\n### 4.3 제시봉(JB) 시가 — 손절 기준선이자 진입 기준선\n제시봉의 시가를 이탈하면 즉시 손절하는 게 원칙이다. 단, 시초가 자체가 그날의 최저가였던 경우(행운의 사례)는 예외로 두고 일반화하지 않는다 [E3-진입-13]. 동일 종목에 새로운 상한가(JB)가 발생하면, 기존 제시봉 기준은 폐기하고 새 제시봉을 기준으로 재설정한다 [E3-진입-14].\n\n---\n\n## 5단계. 비중 운용 — 진입 후 ~ 보유 중\n\n### 스나이퍼 방식 — 분산 금지\n여러 자리에 나눠 사는 것보다 맥점 한 자리를 정확히 저격하는 방식을 우선한다 [E3-멘탈-02].\n\n### 안 보는 매매(상단 매매 특유)\n매수 후 실시간 관찰 없이 분할 주문만 걸어두는 방식이 유리할 수 있다 — 실시간 관찰이 호가창 변동에 휘둘려 조기 손절·조기 매도를 유발할 수 있기 때문이다 [E3-멘탈-03]. (세팅 디테일은 3차-0 \"B\" 카드 참고)\n\n---\n\n## 6단계. 손절 — 상황별 대응\n\n### 6.1 시가 갭하락 음봉\n시가부터 갭하락한 음봉은 힘이 약한 종목으로 매매 대상에서 제외한다 [E3-손절-01].\n\n### 6.2 고가권 무반등\n엘리어트 5파 등 고가권에 진입했는데 반등이 없으면 즉시 칼손절한다 — 평단 논리상 세력이 추가로 부양할 동기가 부족하기 때문이다 [E3-손절-02].\n\n### 6.3 차트 위치별 무반등 대응\n| 위치 | 익일 무반등 시 대응 |\n|---|---|\n| 낮은 자리(바닥권 근접)+A급 이상 | 자동 스윙 전환(물타기 없이 원물량 3~4일 대기) |\n| 높은 자리(고가권) | 즉시 손절 |\n[E3-손절-03]\n\n### 6.4 복합 악재 — 타점 도달해도 패스\n타점에 도달했어도 투자경고지정+추가악재기사 등 복합 악재가 동반되면, 타점만 보고 매수하지 말고 악재의 내용·파괴력을 먼저 평가해 매매를 패스한다 [E3-손절-04].\n\n### 6.5 손절 지연 후 회복 — 일반화 금지\n손절 시점을 놓쳐 보유를 지속하다 자연 반등으로 본전 이상을 회복하는 경우가 있다. 이건 운이 좋았던 결과로만 인식하고, \"안 보는 매매\"가 항상 유리하다고 일반화하지 않는다 [E3-손절-05].\n\n---\n\n## 참고\n- ML·JL·CL 지표의 구체 세팅값과 교집합 활용법은 3차-0(공통 매매 루틴) 2단계 \"지표 활용\" 항목 참고.\n- 대형주 음봉매매(현대차·SK하이닉스 등 대형주 특화 사례)는 3차-E6(대형주매매) 참고.\n- 뉴스 재료를 기반으로 한 음봉매매 진입 판단(ADC 3타순 등)은 3차-E5(뉴스매매) 참고.\n\n\n\n# 〔IMI 계열 통합 보강〕 눌림 매매 실전 절차 [IMI체크리스트 / IMI눌림총정리 / 상천 / 상천유니온 / IMI 2024]\n\n> 상천정리 → 파헤치기 → 관종 → 자리 → 진입 → 청산까지, IMI 계열 전 출처에서 반복 확인된 절차를 하나로 합친 것.\n\n## 0단계. 오늘 매매해도 되는 시장인가\n- **\"시장 상황이 어떻지? 돈을 실어도 되는 시장인가? 줄여야 하나?\"**를 먼저 묻는다 [F-유니온-리스크-01].\n- **상승추세면** 오버나잇 가능·비중 확대·지지선 횡보에서 모아가기. **하락추세면** 오버나잇 금지·비중 축소·칼 손절·**확실히 물량 실리고 뚫어줄 때만** [F-상천-리스크-01].\n- **거래대금이 줄어든 장**에서는 돌파도 속임수가 나오고 눌림 반등도 잘 안 나온다 [F-유니온-판단-01].\n- **지수가 하락세면 시간 자체를 자른다**(\"10시 이전까지만\") [F-IMI2024-리스크-01].\n- **새로운 큰 테마가 생긴 날**은 기존 주도주가 죽으므로, 단타는 새 테마에서 하거나 **아예 쉰다** [C-유니온-선정-03].\n\n## 1단계. 종목 — 상천정리에서 매매용만 골라낸다\n- 억봉 스캔: **거래대금 500억 & 상승률 15% 이상**으로 뽑고 **150억까지 한 번 더** 훑는다 [B-IMI강의-세팅-09].\n- **그 종목의 과거 거래대금 대비 더 터졌는지**, **유동주식수보다 거래량이 큰지**, **못 뚫던 저항을 뚫었는지**로 가점 [D-유니온-판단-02].\n- **매매용 / 공부용을 분리**하고, 재료가 별로면 **관종에 넣지도 않는다** [C-유니온-선정-05].\n- 재료 채점: **신선함 · 연관성 · 지속성/확장성**, 그리고 **\"세계 최초·국내 최초\"** 키워드 [C-IMI강의-선정-02 / C-유니온-선정-04].\n- **제외**: 관리·환기종목, 시총 1,000억 미만·호가 얇음, 만성적자·동전주, 5년 내 유증·CB [C-IMI강의-선정-03]. 단 **끼 있는 종목은 비중을 낮춰 예외** [C-IMI강의-선정-13].\n- **투자경고 단계**를 공시로 확인한다 [C-유니온-선정-07].\n\n## 2단계. 파헤치기 — 하루로 끝내지 않는다\n- 회사 홈페이지·재무(3년 연속 적자/부채비율 200%/자본잠식)·공시·최근 뉴스 [C-IMI강의-선정-04].\n- **관종에 넣은 뒤에도 키워드로 계속 검색해 정보를 최신화**한다 [C-유니온-선정-02·06].\n- 좋은 기사·리포트는 **에버노트 등에 저장**해 두었다가 그 종목이 급등할 때 꺼내 쓴다 [B-유니온-세팅-01].\n- **재료 유효성 3판정**: 시간이 얼마나 지났나 / 다른 주도주가 나왔나 / 전 저점·15일선을 깼나 [C-IMI2024-선정-01].\n\n## 3단계. 자리 — 일봉에서 긋고 분봉으로 좁힌다\n1. **일봉상 지지구간에 라인을 긋고, 그 라인을 분봉에도 긋는다.** 분봉 자체의 지지·저항도 긋고 **겹치는 곳이 콜라보 구간** [D-IMI강의-진입-09 / 상천유니온 240513].\n2. **신뢰도는 1분봉 < 3분봉 < 30분봉 < 일봉 < 주봉** — 1분봉 지지는 잘 깨지니 **3~30분봉**을 본다 [상천유니온 240513].\n3. **파동 위치 확인**: 1파 후 첫 조정이 최우선, **3파 조정은 매수 금지**, **3파 + 역대급 거래대금이면 피날레** [D-IMI강의-진입-02 / D-유니온… 상천유니온 240515].\n4. **억봉 종가 기준**: 종가를 깨면 3~8일선 눌림, 종가 위에서 놀면 지지선 보며 매매 [E3-체크리스트-진입-01].\n5. **이평선 반등 순서**: 3일선 반등이 나오면 다음은 8일선, 3일선 반등이 없으면 5~8일선. **5일선을 이미 줬으면 8일선은 안 줄 확률이 높다** [D-IMI2024-판단-01].\n\n## 4단계. 진입 — 방식은 환경이 정한다\n| 상황 | 방식 |\n|---|---|\n| 장을 못 봄 | **지지 예상 구간에 피라미드식 분할 주문**(밑으로 갈수록 비중↑) [B-유니온-세팅-04] |\n| 폰만 잠깐 볼 수 있음 | **분봉 우상향 중 조정 타이밍에 모아가기** [E3-유니온-진입-02] |\n| 장을 계속 볼 수 있음 | **확실히 돈이 들어올 때 따라 들어가 빠르게** [E3-유니온-진입-02] |\n\n- **비중 설계**: 총 투입액의 **10~20%만 1차** → 안 깨면 추가 없이 관망 → 깨면 **다음 지지에서 2차(더 큰 비중)** → 또 깨면 **손절**. **최종까지 갔을 때의 손실액을 미리 계산**해 소폭 (-)가 되게 배분 [F-IMI강의-리스크-01 / 상천유니온 240513].\n- **가격 하나가 아니라 밴드로** 건다 — 1호가 100 / 2호가 200 / 3호가 300 [D-유니온-판단-01].\n- **반드시 조정을 기다린다.** 올라가는 도중(1번 자리)은 호구 자리 [E3-유니온-멘탈-01].\n- **첫 하락에는 잡지 않는다.** 두 번째부터 분할, 3~4번까지 열어둔다 [F-주간-진입-01].\n- **음봉 매수는 지수에 따라** — 지수가 빠질 땐 하루 더 기다렸다 **전날 저점을 안 깨고 반등할 때** 산다(효과는 거의 같고 더 안전) [E3-유니온-리스크-01 / 상천유니온 240425].\n\n## 5단계. 진입 직전 최종 점검\n- **\"지금 이 자리는 지지구간인가 저항구간인가?\"** 3초 자문 [D-IMI강의-멘탈-01].\n- **\"왜 이 가격에 사고, 하락하면 어디서 손절하는가\"**를 한 문장으로 [G-IMI강의-멘탈-02].\n- **이 충동이 뉴스·분봉 슈팅·특징주 기사·조회순위·유튜브 중 어디서 왔는가** [G-IMI강의-멘탈-09].\n- **호가창 4가지**(한 호가 금액 / 손절 시 받아지는지 / 촘촘한지 / 위쪽 큰 매도 물량) [B-유니온-세팅-05].\n- **거래량 실린 하락은 이유를 먼저 찾는다.** 못 찾으면 그날은 안 한다 [E3-유니온… 상천유니온 240515].\n\n## 6단계. 청산\n- **분봉 5일선 이탈 50% / 10일선 이탈 전량**(지수 약세면 5일선에서 전량) [D-IMI강의-청산-02].\n- **1파 상승폭만큼 2파를 가정해 미리 매도 주문**. 길게 갈 땐 **반 익절 후 나머지는 기준선을 올려가며 지키고, 본전까지 오면 무조건 턴다** [D-IMI강의-청산-01 / F-유니온-청산-01].\n- **직전 저점 이탈 = 추세 전환 신호** [D-IMI강의-손절-01].\n- **상승추세면 매도를 높게, 하락추세면 가까이** 건다 [F-상천-청산-01].\n- **하루 최대 손실**(일평균 수익의 2일치)에 닿으면 그날 종료 [F-IMI강의-리스크-03].\n\n## 7단계. 마감 후\n- **차트를 과거로 돌려 한 봉씩 넘기며** 복기한다 [G-유니온-멘탈-02].\n- **주도섹터·주도주 중 지지구간 근처에 온 종목만 따로 압축**해 다음 날 관찰 대상으로 [G-유니온-멘탈… 상천유니온 240721].\n- **오늘 조정 준 섹터 / 강하게 돈 들어온 섹터**를 구분하고 관종 상단을 갱신 [C-게시글-선정… IMI게시글 2602].\n- **읽은 것은 안 보고 떠올려본다** [G-유니온-멘탈-04].\n"}, {"label": "대형주매매", "file": "E6_대형주매매_가이드.md", "md": "# 3차 — E6. 대형주 매매 실전 가이드 (시간순)\n\n> 공통 매매 루틴(3차-0)을 기본 전제로 하고, 대형주 매매(E6) 고유의 타이밍·기준만 추가한다.\n> 2.5차 카드 26개를 시간 흐름으로 재배치. 카드 번호는 본문에 [E6-진입-01] 형식으로 유지.\n\n---\n\n## 0. 시작 전 — 대형주는 다른 분야다\n\n급등주에 익숙한 사람일수록 대형주 매매를 더 어렵게 느낄 수 있다는 점을 먼저 인지한다. 분야가 다른 매매로 받아들여야 한다 [E6-멘탈-01]. 핵심 전제도 분명히 한다: \"대형주 양봉 종가배팅은 시황이 받쳐줘야 한다\" — 지수가 꺾이면 이 매매법은 통하지 않는다 [E6-멘탈-02]. 평소에 \"제2·제3의 주도주\"가 될 종목을 지속적으로 찾아두는 습관도 들인다 [E6-멘탈-03].\n\n---\n\n## 1단계. 종목 분류 — 무엇을 매매할 것인가\n\n### 1.1 수급주/세력주/수급세력주\n| 구분 | 정의 | 적합 대상 |\n|---|---|---|\n| 수급주(대형주, 기관외국인 주도) | | 투자금 큰 사람·장기투자 |\n| 세력주(급등주, 개인 주도) | | 투자금 작은 사람·단타 |\n| 수급세력주(혼합) | | 큰 수익 가능 |\n[E6-선정-04]\n\n평시엔 세력주가 단타 주력이지만, 역대급 유동성 불장에서는 변동폭이 커진 수급주 중 시장주도주를 적극적 트레이딩 대상으로 전환한다(불장 종료 후 다시 세력주로 회귀) [E6-선정-05].\n\n### 1.2 시장 주도주 vs 세력 주도주 — 구분해서 다른 기법 적용\n| 구분 | 지속기간 | 선정기준 | 공략기법 |\n|---|---|---|---|\n| 시장주도주 | 2~3개월 이상 | 정배열 우상향, 신고가 후 광기적 상승 | 양봉종가배팅·신고가종가배팅·대형주음봉매매 |\n| 세력주도주 | 당일~단기 | 당일거래대금 상위20위+종가2,000억 이상 | 뉴스매매·상한가매매·음봉매매 |\n[E6-선정-02]\n\n**관심종목 기준 혼동 주의**: 상승률 기준 관심종목은 거래대금 500억, 세력주도주 포착은 거래대금 2,000억 — 서로 다른 기준이니 헷갈리지 않는다 [E6-선정-03].\n\n### 1.3 시장 주도주 3대 특징\n1. 시장 최강자(지수하락 시에도 상대적 강세, 빠른 회복력)\n2. 글로벌 매출·실적·정책지원\n3. 강력한 수급(프로그램 대량매수, 목표가 상향 리포트 빈발)\n\n3가지를 충족하는 종목을 시장 주도주로 선정한다 [E6-선정-01].\n\n---\n\n## 2단계. 진입 — 대형주 양봉 종가배팅\n\n### 2.1 적용 4조건\n1. 지수 상승추세(20일선 위, 특히 10일선 위) + 투자심리 긍정적\n2. 일봉 위치: 신고가 또는 박스권 돌파 시점\n3. 구조적·장기적 섹터 호재(일회성 아님)\n4. 기관 리포트 목표가 지속 상향 추세\n\n4조건을 모두 충족할 때 적극 진입한다 [E6-진입-03].\n\n### 2.2 연속 양봉 한도\n양봉 1~2개째까지는 종가배팅이 유효하다. 3개 연속 양봉은 조정 부담이 크므로 비권장이다 [E6-진입-04].\n\n### 2.3 신고가 매매의 구조적 장점\n역사적 신고가 구간이고 시황이 강하면, 위쪽에 매물대가 없어 상승탄력이 좋다 — 종가배팅에 적극 활용한다 [E6-진입-01].\n\n---\n\n## 3단계. 진입 — 대형주 음봉 매매\n\n### 3.1 시황별 전환\n| 시황 | 대응 |\n|---|---|\n| 상승 추세 | 양봉 종가배팅(종가최고가·신고가돌파 자리) |\n| 하락장 | 종가배팅 패스 또는 시가배팅 전환 |\n| 박스권(횡보) | 하단매수→상단매도 전략 |\n[E6-진입-05]\n\n### 3.2 상승추세→박스권 전환 판단\n종가 기준 10일선 이탈을 박스권 장세 진입 신호로 본다. 박스권 장세에서는 원음봉보다 투음봉(2음봉) 관점에서 분할매수한다 [E6-진입-08].\n\n### 3.3 전략적 종목 교체\n특정 섹터(예 반도체 쌍두마차)가 압도적으로 강해지는 시기에는, 기존 보유 종목에 집착하지 말고 더 센 종목으로 갈아탄다 [E6-선정-06].\n\n---\n\n## 4단계. NXT 타이밍 활용 — 진입·청산 공통\n\n### 4.1 확정수급 활용\nNXT 종목이고 프로그램 매도가 확인됐다면 19:30~20:00(애프터마켓 마감 전)에 분할매수한다. 익일 NXT 프리마켓(08:00~08:50)에 상승이 매우 크면 전량 매도를 권장한다 [E6-진입-06].\n\n### 4.2 NXT-KRX 차트 괴리 주의\nNXT 기준 차트가 비정상적으로 왜곡되어 보이면(거래량 적은 시초가 등), KRX 기준 차트로 전환해 정확한 눌림 폭·등락률을 확인한다 [E6-진입-11].\n\n### 4.3 NXT 시간대 수급 특성\nNXT 프리·애프터마켓은 개인 중심이고, 기관·외국인은 KRX 정규장에서 주로 개입한다. 전량매도보다 정규장 확인 후 대응(반반치킨 또는 오후 매수)이 더 안전하다 [E6-청산-02].\n\n---\n\n## 5단계. 투매 잡기 — 급락 대응\n\n### 5.1 투매 구분\n상승 추세 중 단기 투매(이미 많은 자금이 투입된 종목)는 빠른 회복 가능성이 높아 매수 기회로 활용한다. 정규장 추세 꺾임(프로그램 대량매도 동반)은 익일까지 하락이 이어질 위험이 있으므로, 단순 투매와 구분해서 대응한다 [E6-진입-07].\n\n### 5.2 신고가 구간 첫 하락 투매\n신고가 구간에서의 첫 하락이며 지지선을 깨지 않은 투매이고, 원인이 대외 이슈(종목 자체 문제 아님)라면 반등 가능성이 높다고 보고 매수 기회로 포착한다(비트코인 등 실시간 지표로 반등 확인 후 추가매수) [E6-진입-02].\n\n### 5.3 투매 잡기 요령 2가지\n1. 지지선 확인 후 저점부터 분할매수\n2. 지수 1분봉을 띄워두고 지수 반등 확인 후 매수\n[E6-진입-09]\n\n### 5.4 라운드피겨+ML 교집합 \"낚시매매\"\n라운드피겨(예 10만원, 50만원)와 ML1 또는 ML0이 겹치는 자리에 미리 분할 매수 주문을 걸어두고 대기한다 [E6-진입-10].\n\n---\n\n## 6단계. 청산 — 보유 중 ~ 매도\n\n### 6.1 반반치킨\n장후반 큰 상승이 발생하면 전량 매도 대신 일부(예 30%)를 남겨 익일 추가 시세까지 확인한 뒤 매도한다 [E6-청산-01].\n\n### 6.2 거래폭증 시 신속 매도\n투매 잡기 후 작은 반등 구간에서 거래량이 동반된 빠른 회복이 보이면, 수익률이 작아도 비중이 크면 신속하게 매도해 수익금을 확보한다 [E6-청산-03].\n\n---\n\n## 7단계. 손절\n\n### 7.1 짧게 끊는다\n대형주는 1~2%만 빠져도 타격이 크다(레버리지 비중이 높은 경향). 짧게 손절 기준을 설정하고, NXT에서 충분한 수익이 나면 KRX까지 끌지 말고 조기 수익실현한다 [E6-손절-01].\n\n### 7.2 음봉전환 시 매매 중단\n갭이 뜨고 고가권에서 음봉으로 마감하면, 추가 조정이 필요하다고 보고 종가배팅을 자제한다(매매 중단 시점으로 판단) [E6-손절-02].\n\n### 7.3 5일선 이탈 시 손절 검토\n대형주 음봉매매에서 5일선이 이탈되면, 기존 손절기준(F1)에 더해 이것도 손절 검토 신호로 추가한다 [E6-손절-03].\n\n---\n\n## 참고\n- 시황 판단(이평선 배열 등)과 기본 손절 7기준은 3차-0(공통 매매 루틴) 참고.\n- 종가배팅의 표준 진입 시간대는 3차-E1 참고.\n- 대형주 음봉매매의 ML·JL 지표 활용은 3차-E3(음봉매매) 참고.\n\n\n---\n\n# ⟦IMI · 주간매매 추가⟧ — E6. 대형주 매매 가이드\n\n> 제시 베이스(대형주 스윙·음봉 매매)에 IMI의 4종목 집중 전략을 추가.\n> 현 시황(쏠림장) 전용. 시황 변화 시 제시 베이스 기준으로 전환.\n\n## 0. 전제 — 언제 이 가이드를 쓰는가\n\n**4종목 쏠림장** 판단 시([A-IMI-진입-01]):\n- 지수는 오르는데 하락 종목 수가 압도적으로 많음\n- 삼전·하닉·삼성전기·SK스퀘어 외 대부분 종목이 약세\n\n## 1. 장 전\n\n- 4종목 전날 종가·신고가 여부 확인.\n- 연관 외국 대장주(마이크론·무라타 등) 전날 등락률 확인 → 급등이면 당일 단타 준비 [E6-IMI-진입-02].\n- 직전 저지바·저항대에 시세 알림 등록 [B-IMI-세팅-04].\n- 비중 계획: 4종목 90%, 나머지 10%([F-IMI-리스크-03]).\n\n## 2. 장중\n\n### 2.1 분봉 회전매매 (느린 흐름)\n분봉 저지바 확인 → 20% 분할 매수 → 아침 급등 시 매도 → 조정 후 저지바 재진입 → 반복 [E6-IMI-진입-01].\n\n### 2.2 연관 외국 대장주 급등 → 빠른 단타\n① 시세 알림으로 저항 돌파 포착\n② 뉴스 검색 확인(무라타·MLCC 등)\n③ 거래대금 터진 분봉 고점 돌파 진입\n④ 저항받으면 50%씩 분할 매도 [E6-IMI-진입-02].\n\n### 2.3 비중·손절 판단\n- 첫 진입은 10%(소량) → 바로 가면 익절, 안 가면 추가 [F-IMI-리스크-02].\n- 풀비중 투입 상태에서 지지 깨지면 즉시 손절(-2%) [F-IMI-손절-01].\n- -5% 도달 시 무조건 손절 [F-IMI-손절-02].\n\n## 3. 홀딩 판단 (전업·공격적 한정)\n\n- 당일 익절하지 않고 스윙으로 가져가는 것도 가능 [E6-IMI-진입-01].\n- 레버리지(삼전·하닉 2배·반도체 레버리지)는 전업·공격적 매매자만 [E6-IMI-진입-03].\n\n## 4. 마감\n\n- 센티먼트 게이지 상단 도달 여부 확인 → 상단 꺾이면 음봉에 팔지 말고 양봉에 분할 익절 [A-IMI-선정-01].\n- 넥스트(시간외) 급등 시 무조건 수익 실현(정규장에 다 던져짐) [E7-IMI-청산-02].\n\n---\n\n# 〔2026-06-22 보강〕 — 대형주 분봉 분할 [IMI 0622]\n\n## 분봉 분할 매수 구체 비율 (4종목)\n- 장초반 지지구간 **20%** 매수 → 추가 하락(꼭짓점 구간)이면 **10%** 소량 추가 → 중요 저지바 구간에서 **40%** 추가로 비중 크게 → 고점 매도 주문 체결.\n- 4종목이 음봉 줄 때마다 익절하는 당일 단타로 대응(고정값에서 수익 대부분 발생).\n\n## 지주사 확장 (대형주 연계)\n- 삼성전자 지분 보유 = 삼성생명·삼성물산 / 하이닉스 지분 = SK스퀘어. 신고가 저지바 + 음봉 지지 자리에서 매수, \"상승폭만큼 조정 후 재상승\" 개념으로 저항대 매도.\n\n---\n\n# 〔2026-06-23~25 보강〕 — 급락→반등 4종목 운용 [IMI 0623·0624 / 주간 0625]\n\n## 급락일 (예: 6/23)\n- 고정값 -5% 넘게 급락 시작 → 분할 매수 개시(10→추가→저지바 비중). 단 내일 반대매매 대비 약수익이라도 일부 현금화.\n- 15분봉 지지선→3분봉, 꼭지점은 정찰병(소액)부터, 저지바·쌍바닥에서 추가.\n\n## 반등일 (예: 6/24)\n- 전날 분할분을 반등에 익절. 가장 먼저·크게 반등하는 게 대장(고정값) → 대장 위주.\n- 어제 빠진 종목 다 반등하는 것 아님 → 후발주·잡주 제외, 고정값만.\n\n## 실적 트리거일 (예: 6/25 마이크론)\n- 강한 종목은 상승폭 대비 조정폭 작음 → 최근 3일 내 어디서 사도 수익. 시초가 인지 놓치지 말 것.\n- 1차만 오버나이트로 갭 익절, 미스 시 2·3차. 지주사(삼성물산 등)는 고정값 상승분 수혜.\n\n---\n\n# ⟦복기 추가⟧ — 주도주 과대낙폭 당일반등 루틴 [복기 0714]\n\n> 전제: 쏠림장 고정값 4종목 + 슈퍼사이클 시황 한정. 카드는 2.5차 [E6-복기-*] 참조.\n\n## 전일 마감 후 (급락 확인일)\n- [ ] 고정값 주도주 -15% 이상 급락인가? 급락 원인이 매크로·수급(일시적 공포)인가, 스토리 훼손인가?\n- [ ] 일봉 지지구간(과거 박스권·직전 랠리 출발점) 도달 여부 + \"고점 대비 -○%, 며칠에 걸쳐\" 기록\n- [ ] 하락 성격: 변동폭 큰 하락(진입 검토) vs 계단식(대기)\n\n## 당일 장전\n- [ ] NXT 프리 저가 기록 → 당일 핵심 지지선으로 줄 긋기 (프리마켓에서는 미진입)\n- [ ] 전일 종가·당일 시가·3분봉 40분선 위치 확인 — 겹치는 구간 있으면 타점 A 후보\n\n## 장중\n1. 갭상승 직후 V자 급반등은 추격 금지 [E6-복기-진입-04]\n2. 타점 A: 삼중 겹침 위 횡보(지지 확인) + 프로그램 순매수·기관/외인 확인 → 진입, 손절 = 40분선 이탈 [E6-복기-진입-02]\n3. 보유 중: 40분선·당일 시가 상회 유지되는지로 강약 판단 [D-IMI-진입-07]\n4. 익절: 라운드피겨·전일 종가권 저항 or 음봉 전환 시 당일 청산 [E6-복기-청산-01]\n5. 타점 B: 오후 NXT 프리 저가 재테스트 + 반등 양봉 → 재진입, 손절 = 프리 저가 이탈 [E6-복기-진입-03]\n\n## 마감 후\n- [ ] 오버나잇 없이 정리했는가 (하락추세 국면 전제)\n- [ ] 복기 기록: 진입가/손절가/비중%, 타점별 결과 → `국장 복기/` 누적\n---\n\n# 〔2026-08-25·26 보강〕 3종목 집중 회전 실행 절차 [IMI 0825·0826]\n\n## 전날 밤\n1. 미국 반도체 마감을 보고 \"내일 빠지겠다 → 빠지면 살 만한 자리인가\" 판단.\n2. 일봉·중기 분봉에 지지선을 미리 긋는다. 다음 날은 계획 실행만 [E6-IMI-진입-08].\n\n## 장 전 (일봉 위치 판정)\n- **보류**: 고점에서 막 하락하기 시작한 자리 → 더 깊은 조정 대기.\n- **진입 근거 성립**: 고점 찍고 내려와 **저지바·매물대 + 20일선**이 겹치는 자리에 도달.\n- 삼전·닉스는 급락 후에도 PER 기준 저평가 구간이라는 전제 위에서 판단.\n- **자사주 매입 기간**인지 확인 — 기타법인 매수세 = 자사주 매입분이면 지지 확률↑ [E6-IMI-진입-06].\n\n## 장 중 (수급 → 타점 → 회전)\n1. **수급 확인이 최우선**. 외국인·기관 둘 다 매도 + 개인만 매수면 미진입(또는 최대비중 10% 수준). 하나라도 뚜렷하게 매수하며 우상향이면 진입 가능, 둘 다 매수면 적극 [E6-IMI-진입-04].\n2. NXT에서 오른 종목이 9시에 갭하락하면 **분봉 지지구간을 체크해 오히려 비중을 실어 싸게 매수**. 시장·재료가 살아 있으면 시가 회복 여부 확인 [E6-IMI-진입-07].\n3. 중기 분봉에 그은 선을 3분봉에 그대로 옮겨 세부 타점 구간을 만든다 [B-IMI-세팅-10].\n4. 잽처럼 소액부터, 아래로 갈수록 비중 확대. 지지 확인 후 본격 비중.\n5. **회전**: 반등 시 저항대 익절 → 조정 시 저지바 확인 후 재매수 → 고점 돌파 시 소액 추가 → 상승에 매도. 꼭짓점에서 팔고 내려올 때 사는 패턴을 하루 여러 번.\n6. 변동성이 작아 3% 상승에 3~4시간이 걸리므로 **0.8~1%도 큰 수익**으로 인정 [F-IMI-진입-08].\n\n## 마감 / 오버나잇\n- 실적 등 이벤트가 임박하면 **전량 익절, 오버나잇 금지**. 실적이 잘 나와 상승해도 그 흐름 안에서 단기 매매가 가능하므로 아까워하지 않는다 [E6-IMI-청산-01, F-IMI-청산-01].\n- 오버나잇을 한다면 현금 40~50% 유지 [F-IMI-리스크-12].\n\n## 실행 사례\n- **0824**: 삼성전기 = 기관 매수 확인 → 전날부터 피라미드 분할, NXT 장초 반등 익절 → 조정 재분할 → 반등 익절. 삼성전자 = 프로그램·외국인·기관 전부 매도 확인 → **-2% 손절**(이후 5% 추가 하락).\n- **0825**: 하이닉스 잠정합의안 부결로 -6% 급락했으나 기관 매수 확인 → 지수 20일선 지지 근거로 3종목 분할 매집 → 저항대마다 분할 익절, 8% 반등 구간 회전.\n- **0826**: 9시 갭하락 → 분봉 지지구간 확인 후 비중 실어 매수 → 지수 반등과 함께 3종목 전량 익절, NVIDIA 실적 리스크로 오버나잇 안 함.\n"}, {"label": "급등주눌림", "file": "E9_급등주눌림_가이드.md", "md": "# 3차 — E9. 급등주 눌림 실전 가이드 [차읽남]\n> 장 전·장중·장 후 루틴 + 체크리스트\n\n---\n\n## 장 전 루틴\n\n### 1. 보유 급등주 재검토\n- [ ] 전일 이평선 위치 확인 (3일선 / 8일선 / 15일선 어느 자리?)\n- [ ] 재료·이슈 살아있는지 확인 (섹터 뉴스, 호재 일정)\n- [ ] 속임수 음봉 여부 (하락시 거래대금 < 상승시 거래대금?)\n- [ ] 조정봉 완성 여부 (도지 + 거래량 급감?)\n\n### 2. 신규 후보 급등주 탐색\n- [ ] 최근 5일 내 100%+ 급등한 종목 중 2~3음봉 조정 중인 것\n- [ ] 2개 이상 섹터에 엮인 종목 우선\n- [ ] 끼 있는 종목 확인 (첫 투매 후 강하게 반등한 이력)\n- [ ] 재료·이슈 잔존 여부 + 호재 일정 남아있는지\n\n### 3. 시나리오 설정\n- [ ] 상승 시나리오: 목표가 (전고점 / 라운드피겨 / 대량거래 자리)\n- [ ] 하락 시나리오: 손절 포인트 (-5%/-6%/-8%)\n\n---\n\n## 장중 루틴\n\n### 1. 이평선 눌림 확인\n- [ ] 5일선 위 → 3일선 매매 가능\n- [ ] 5일선 이탈 → 8일선 기준으로 전환\n- [ ] 15일선 부근 → 반등 기대 낮추고 손절 빡빡하게\n\n### 2. 진입 타이밍\n- [ ] 1음봉 → 관망\n- [ ] 2음봉 + 거래량 감소 → 1차 진입 검토\n- [ ] 3음봉 + 추가 거래량 감소 → 분할 추가 진입 가능\n- [ ] 5음봉+ → 낙폭과대 → 첫 투매 자리 분할 진입 가능\n- [ ] 갭 구간이면 → 라운드피겨 부근 지지 확인 후 진입\n\n### 3. 급등상승음봉 진입\n- [ ] 전날 급등 후 갭 상승 시작\n- [ ] 첫 음봉 발생 = 매수 타점 확인\n- [ ] 분봉에서 저점 지지 확인 후 진입\n\n### 4. 첫 투매 자리 진입\n- [ ] 급등 후 처음 강하게 하락 (-35%~-40%)\n- [ ] 분봉 투매 후 강한 반등 = 끼 확인\n- [ ] 확인 후 분할 매수 진입 (손절 -6%~-8%)\n- [ ] 단기 매매 (2~3일) 필수 — 재하락 가능\n\n---\n\n## 손절·청산 기준\n\n| 구분 | 기준 |\n|------|------|\n| 3일선 눌림 손절 | -5%~-6% |\n| 8일선 눌림 손절 | -5%~-6% |\n| 15일선 눌림 손절 | -5% (엄격하게) |\n| 첫 투매 자리 손절 | -6%~-8% |\n| 원하는 자리 반등 없으면 | 즉시 손절 |\n\n| 구분 | 기준 |\n|------|------|\n| 3일선 눌림 보유 | 2~3일 |\n| 8일선 눌림 보유 | 3~5일 |\n| 첫 투매 자리 | 2~3일 (홀딩 금지) |\n\n---\n\n## 급등주 체크리스트 (종합)\n\n| # | 항목 | 확인 |\n|---|------|------|\n| 1 | 속임수 음봉 확인 (하락시 거래대금 < 상승시) | □ |\n| 2 | 급격 상승 vs 공방 상승 판단 | □ |\n| 3 | 2개 이상 섹터 엮임 여부 | □ |\n| 4 | 재료·이슈 잔존 여부 | □ |\n| 5 | 이평선 위치 (3/8/15일선) | □ |\n| 6 | 5일선 위 or 이탈 여부 | □ |\n| 7 | 1음봉 관망 → 2음봉 진입 원칙 | □ |\n| 8 | 갭 구간이면 라운드피겨 지지 확인 | □ |\n| 9 | 조정봉 완성 (도지 + 거래량 급감) | □ |\n| 10 | 첫 투매 자리 끼 확인 (강한 반등 이력) | □ |\n| 11 | 섹터 순환매 흐름 (중대형→중소형) | □ |\n| 12 | 손절 기준 설정 (-5%/-6%/-8%) | □ |\n| 13 | 무상증자 종목 → 추가 상장일 전후 주의 | □ |\n| 14 | 신규주 8일선 이상 눌림 → 자제 여부 확인 | □ |\n\n---\n\n## 이평선별 매매 요약표\n\n| 이평선 | 특성 | 진입 기준 | 손절 | 보유 |\n|--------|------|-----------|------|------|\n| 3일선 | 가장 강한 자리 | 2~3음봉 + 거래량 감소 | -5%~-6% | 2~3일 |\n| 8일선 | 중간 자리 | 3~5음봉, 밑꼬리 확인 | -5%~-6% | 3~5일 |\n| 15일선 | 약해지는 신호 | 단음봉 계단식 면 자제 | -5% (엄격) | 3~5일 |\n| 첫 투매 | 고점 -35~40% | 강한 반등 끼 확인 후 | -6%~-8% | 2~3일 |\n\n---\n\n## 하지 말아야 할 것 (금지 리스트)\n\n- 차익실현 음봉에서 진입 (하락시 거래대금 큰 음봉)\n- 15일선 + 계단식 단음봉 하락 → 진입\n- 재료 소멸 + 섹터 약화 → 눌림 진입\n- 첫 투매 후 홀딩 (단기 매매 반드시)\n- 신규주 8일선 이상 눌림 → 반등 기대 매수\n- 급격 상승(일직선) 종목 눌림 → 예측 매수 (지지 약함)\n- 원하는 자리에서 반등 안 해도 홀딩 → 즉시 손절\n"}, {"label": "섹터눌림", "file": "E10_섹터눌림_가이드.md", "md": "# 3차 — E10. 섹터 눌림 실전 가이드 [차읽남]\n> 장전/장중/장후 루틴 + 체크리스트\n\n---\n\n## 장전 루틴\n\n### 1. 어제 섹터 점검\n- [ ] 어제 집단 상한가 발생 섹터가 있었는가?\n- [ ] 상한가 종목 몇 개? (3개+ = 강한 섹터)\n- [ ] 파생 섹터 발생 여부 확인 (ex. 1차 섹터 → 2차 섹터 상승)\n- [ ] 재탕 섹터인가? (기대치 낮추기)\n\n### 2. 대장주 선정\n- [ ] 섹터 내 가장 강하게 상승한 종목 확인\n- [ ] 신규주 있으면 먼저 확인 → 기존 상장 대비 강도 비교\n- [ ] 관심종목에 섹터 내 2~3개 묶어두기\n\n### 3. 차트 분석 (일봉)\n- [ ] 어떻게 올라왔나? 공방 vs 일자 상승 확인\n  - 공방 = 매물 소화 → 지지 강함\n  - 일자 = 매물 소화 없음 → 지지 약함, 급락 주의\n- [ ] 현재 며칠째 조정 중인가? (2~3음봉 = 기술적 반등 자리)\n- [ ] 고가 대비 낙폭 확인 (-10% 이하 = 첫눌림 / -25% 이상 = 낙폭과대)\n- [ ] NXT 차트 왜곡 없는지 → KRX 차트 기준 지지/저항 설정\n\n### 4. 수급 확인 (대형주·수급주 해당)\n- [ ] 투자자별 매매동향: 기관/외국인 방향?\n  - 양매수 = 진입 고려 / 양매도 = 제외\n- [ ] 외국인 순매수 연속성 확인 (중단 = 추세 이탈 가능)\n\n### 5. 리스크 점검\n- [ ] 단기과열/투자경고 지정 예고 여부 확인\n  - 예고 있으면 → 비중 줄이거나 제외\n- [ ] 투자경고 종목 → NXT 거래 불가 여부 확인\n\n### 6. 시나리오 작성\n- **상승 시나리오**: 반등 자리, 1차 목표가, 최종 목표가\n- **하락 시나리오**: 손절 기준, 재진입 자리\n- 손절 기준을 반드시 미리 정하고 진입\n\n---\n\n## 장중 루틴\n\n### 진입 판단 순서\n1. 전날 이상 없이 음봉 마감 확인 (속임수 음봉 여부)\n2. 오전 10~11시: 거래량 확인 → 줄어드는가?\n3. 핵심 지지 자리에서 반등하는가? (KRX 기준 지지선)\n4. 반등 확인 후 진입 (예측 말고 대응)\n\n### 장중 관리\n- [ ] 기관/외국인 실시간 수급 확인 (대형주·수급주)\n- [ ] NXT 거래량 있는 상한가 = 지지로 인정 여부 확인\n- [ ] 신용 잔고 확인 (잔고 풀 이후 상승 가능성)\n- [ ] 파생 섹터 새로 발생 여부 → 섹터 강도 업데이트\n\n### 매도 판단\n- 1차 목표: 거래대금 많은 자리 / 전일 종가 / 상한가 종가\n- 2차 목표: 전고점 / 박스권 상단 (대형주)\n- 손절: 설정한 기준 이탈 즉시 (미련 없이)\n\n---\n\n## 장후 루틴\n\n- [ ] 오늘 섹터 전체 흐름 기록 (강했나? 약했나?)\n- [ ] 새로운 섹터 집단 상한가 발생 여부 확인\n- [ ] 내일 단기과열/투자경고 지정 예고 종목 확인\n- [ ] 수급 방향 변화 여부 업데이트\n\n---\n\n## 진입 전 최종 체크리스트\n\n| # | 항목 | 확인 |\n|---|------|------|\n| 1 | 집단 상한가 3개+ 발생 확인 | □ |\n| 2 | 파생 섹터 발생 여부 확인 | □ |\n| 3 | 재탕 섹터인지 확인 (기대치 조정) | □ |\n| 4 | 섹터 내 대장주 선정 완료 | □ |\n| 5 | 신규주 비교 확인 완료 | □ |\n| 6 | 공방 vs 일자 상승 구분 완료 | □ |\n| 7 | KRX 차트 기준 지지/저항 설정 | □ |\n| 8 | 속임수 음봉 여부 확인 | □ |\n| 9 | 단기과열/투자경고 여부 확인 | □ |\n| 10 | 수급 방향 확인 (해당 시) | □ |\n| 11 | 손절 기준 사전 설정 | □ |\n| 12 | 상승/하락 시나리오 작성 | □ |\n| 13 | 보유 기간 계획 수립 | □ |\n| 14 | 대형주 = 분할 매수 계획 수립 | □ |\n\n---\n\n## 섹터 눌림 손절·보유 빠른 참조표\n\n| 케이스 | 손절 | 보유 |\n|--------|------|------|\n| 일반 첫눌림 | -5% | 2~3일 |\n| 파생섹터 강한 경우 | -6% | 3~5일 |\n| 변동성 큰 섹터 | -7% | 3~7일 |\n| 재탕·특수 섹터 | -8% | 5~12일 |\n| 대형주 스윙 | -10% | 15일+ |\n\n---\n\n## 핵심 원칙 요약 (10초 복기)\n\n1. **집단 상한가 3개+** → 강한 섹터 진입 가능\n2. **파생 섹터** 발생 → 더 강한 섹터\n3. **첫 눌림**이 가장 강한 자리\n4. **대장주** 선택 (2등주 제외)\n5. **신규주** 먼저 확인\n6. **공방 상승** = 지지 강함 / **일자 상승** = 지지 약함\n7. **속임수 음봉** = 거래량 줄면서 하락\n8. **KRX 차트** 기준 (NXT 왜곡 주의)\n9. **수급주** = 기관/외국인 방향 확인 필수\n10. **손절 사전 설정** → 이탈 즉시 실행\n"}, {"label": "바닥권눌림", "file": "E11_바닥권눌림_가이드.md", "md": "# 3차 — E11. 바닥권 눌림 매매 실전 가이드 [차읽남]\n> 장 시작 전 → 장중 → 장 마감 → 마감 후 흐름으로 배치\n> 카드 ID로 추적: [E11-차읽남-코드-NN]\n\n---\n\n## 장 시작 전 (전날 밤 ~ 장 전)\n\n### Step 1. 종목 발굴\n- 당일 이슈 상한가 발생 종목 중 바닥권 구조 확인\n  - 횡보 기간 3개월 이상? → [E11-차읽남-선정-01]\n  - 상한가 거래대금 1,500억 이상? → [E11-차읽남-선정-01]\n  - 여러 섹터 보유? → [E11-차읽남-선정-02]\n  - 바이오라면 유상증자/CB 확인 → [E11-차읽남-선정-03]\n\n### Step 2. 차트 분석 (일봉)\n- 역배열 구조인가? 역배열이면 매물 소화 신뢰도 하락 감안\n- 이전 상승 시도(윗꼬리)와 비교: 이번 거래대금·횡보 기간이 더 큰가?\n- 상한가 종가 확인 → **핵심 지지 라인** 메모\n\n### Step 3. 시나리오 사전 설정\n- 상승 시나리오: 어느 자리에서 지지 → 목표가 어디까지\n- 하락 시나리오: 어느 자리 이탈 시 손절\n- → [E11-차읽남-진입-04]\n\n### Step 4. 시장 환경 확인\n- 오늘 시장 전체 거래대금 수준 확인\n  - 적으면 → 3일선보다 **5일선** 기준 적용 → [E11-차읽남-진입-03]\n\n---\n\n## 장 중\n\n### 시가 확인 (오전 9:00)\n- 갭 상승 시작? → 시가 지지 여부가 1차 관문 → [E11-차읽남-청산-01]\n- 갭 하락 시작? → 거래대금 많은 자리, 상한가 종가 지지 확인 → [E11-차읽남-청산-02]\n\n### 진입 타이밍\n- 2음봉 확인 후 1차 진입 → [E11-차읽남-진입-01]\n- 5일선 위 + 거래량 감소 = 진입 신호 → [E11-차읽남-진입-02]\n- 1음봉에는 관망, 3음봉까지 분할 허용\n\n### 지지/저항 모니터링\n지지 확인 자리 (분봉 기준):\n1. 큰 거래대금 발생 구간\n2. 라운드피겨 (00단위)\n3. 상한가 종가\n4. 전일 종가\n5. 시가\n\n> 단기과열 기간(거래량 적음) 형성 봉 = 지지·저항 의미 없음\n\n### 긴급 손절 조건\n- -5% 도달 → 즉시 손절 → [E11-차읽남-손절-01]\n- 4음봉 마감 징조 → 분할매수 중단, 재평가 → [E11-차읽남-손절-02]\n- 5일선 이탈 (바닥권 상한가 종목) → 추가 하락 대비 → [E11-차읽남-손절-03]\n\n---\n\n## 장 마감 후\n\n### 오늘 봉 확인\n| 확인 사항 | 판단 |\n|-----------|------|\n| 5일선 위 종가 + 거래량 감소 | 내일 반등 기대 → 홀딩 |\n| 5일선 아래 종가 | 추가 하락 가능성 → 손절 or 비중 축소 |\n| 4음봉 마감 | 종목 재평가, 손절 검토 |\n| 거래대금 대폭 증가 + 음봉 | 악재 가능성 → 손절 우선 |\n\n### 추가 상승 조건 점검 (홀딩 결정 시)\n- 내일 추가 상승이 강하려면: 큰 거래대금(1,500억+) 재유입 예상되는가?\n- 섹터 전체 순환매 흐름이 살아있는가?\n\n---\n\n## 매매 체크리스트 (한눈에)\n\n```\n[ ] 바닥권 횡보 3개월 이상?\n[ ] 상한가 거래대금 1,500억 이상?\n[ ] 여러 섹터 보유?\n[ ] 바이오 → 유상증자/CB 발행 확인?\n[ ] 일봉 역배열 구조 파악\n[ ] 상한가 종가 기록 (핵심 지지선)\n[ ] 상승/하락 시나리오 미리 설정\n[ ] 시장 거래대금 확인 (적으면 5일선 기준 적용)\n[ ] 2음봉에서 진입 (1음봉 관망)\n[ ] 5일선 위 + 거래량 감소 확인\n[ ] 손절 -5% 설정 완료\n[ ] 4음봉 마감 시 재평가 원칙 인지\n```\n"}, {"label": "이평선매매가이드", "file": "E12_이동평균선매매_가이드.md", "md": "# 3차 — E. 이동평균선 매매 실전 가이드 [차읽남]\n> 장전/장중/장후 루틴 + 체크리스트\n\n---\n\n## 장전 루틴\n\n### 1. 시장 강도 파악\n- [ ] 전날 코스닥 거래대금 확인\n  - 많음 (12조+) → 3일선 매매 가능\n  - 보통 (8~12조) → 5일선 매매\n  - 적음 (8조 이하) → 8일선 매매\n- [ ] 시장 하락장 여부 → 하락장이면 3일선 매매 자제\n\n### 2. 이평선 위치 확인 (관심종목)\n- [ ] 5일선 위에 있는가? → 추세 살아있음 (급등주)\n- [ ] 5일선 이탈 → 추세 이탈 신호, 관망 검토\n- [ ] 3일선/8일선/15일선 중 어디에 근접했는가?\n\n### 3. 거래대금 확인 (전날 상한가 종목)\n- [ ] 150억봉 / 500억봉 발생했나?\n  - YES → 3일선 매매 유효\n  - NO → 5일선/8일선 접근\n- [ ] 상한가 안착 방식 확인\n  - 공방하며 안착 → 지지 강함\n  - 급격하게 안착 → 지지 약함\n\n### 4. 음봉 성격 파악\n- [ ] 속임수 음봉인가?\n  - 하락 거래량 < 상승 거래량 → 기술적 반등 기대\n- [ ] 차익실현 음봉인가?\n  - 하락 거래량 > 상승 거래량 → 반등 약함\n\n### 5. 역배열 종목 점검\n- [ ] 역배열 차트인가? → 아래 두 조건 중 하나 필수\n  - 횡보기간 충분했는가? (3개월 이상)\n  - or 대량거래량 상승(역배열 멈추는 신호)이 나왔는가?\n  - 둘 다 없으면 → 진입 금지\n\n### 6. 재료 파악\n- [ ] 신규 재료 vs 재탕 재료 구분\n  - 신규 → 강한 반등 기대 가능\n  - 재탕 → 기대치 낮추기\n- [ ] 지속 가능한 재료인가? → 다음 일정 확인\n\n---\n\n## 장중 루틴\n\n### 진입 판단\n1. 설정한 이평선 부근까지 하락하는가?\n2. 거래량 감소 확인 (속임수 음봉 확인)\n3. 라운드피겨에서 지지가 되는가?\n4. 분봉상 거래대금 터진 구간과 겹치는가?\n5. 지지 확인 후 반등 시 진입 (예측 말고
